[project]
name = "bgfin"
version = "0.1.0"
description = "Collects Bulgarian economic and financial indicators into PostgreSQL with full revision history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bgfin = "bgfin.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
bgfin = ["sql/*.sql"]
