apiVersion: 1
datasources:
  - name: bgfin
    uid: bgfin-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: bgfin
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
