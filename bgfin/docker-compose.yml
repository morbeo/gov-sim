# PostgreSQL + collector + Grafana on one host.
#   cp .env.example .env   (set passwords)
#   docker compose up -d
#   docker compose run --rm collector backfill     (first full history load)
# Grafana: http://localhost:3000 (bound to localhost; put a reverse proxy in front for remote access)

services:
  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bgfin
      POSTGRES_USER: bgfin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgfin -d bgfin"]
      interval: 10s
      retries: 10

  collector:
    build: .
    image: bgfin:latest
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      BGFIN_DSN: postgresql://bgfin:${POSTGRES_PASSWORD}@db:5432/bgfin
    volumes:
      - ./config:/app/config:ro      # edit config without rebuilding
    command: ["run", "--tick", "15"]

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_DEFAULT_THEME: light
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bgfin-overview.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  pgdata:
  grafana:
