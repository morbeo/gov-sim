<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Политико: държавно устройство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea;
  --panel: #fffdf8;
  --ink: #1d1d1f;
  --muted: #6b6760;
  --line: #d9d3c7;
  --accent: #0b4f8a;
  --hi: #fff4d6;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
h1 { margin: 0; font-size: 20px; }
header p { margin: 0; color: var(--muted); flex: 1 1 320px; }
.srch { position: relative; flex: 0 1 380px; min-width: 240px; }
.srch input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
#results { position: absolute; right: 0; left: 0; top: 100%; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; z-index: 10; display: none; }
#results.on { display: block; }
#results .r { padding: 6px 10px; cursor: pointer; border-top: 1px solid #eee7da; font-size: 13px; }
#results .r:first-child { border-top: 0; }
#results .r.act, #results .r:hover { background: #eef4fb; }
#results .r .k { font-size: 11px; color: var(--muted); }
#results mark { background: #ffe9a8; padding: 0; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 52px); }
#left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; user-select: none; }
.chip.off { opacity: .4; text-decoration: line-through; }
.chip svg { flex: none; }
.bar .sp { flex: 1; }
.clegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; width: 100%; justify-content: flex-end; }
.clegend span { display: inline-flex; align-items: center; gap: 5px; }
.clegend i { width: 12px; height: 12px; border: 2.5px solid; border-radius: 3px; background: #fff; }
.fchart { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 118px; column-gap: 30px; row-gap: 24px; align-items: start; padding: 6px 0 6px 46px; margin: 10px 0; }
.fchart svg.fl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.fbox { background: #fff; border: 1.5px solid #8c877d; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; line-height: 1.3; cursor: pointer; position: relative; z-index: 1; }
.fbox:hover { border-color: var(--ink); }
.fbox.k-decision { background: #fff8e6; border-color: #c98a1b; border-radius: 18px; text-align: center; }
.fbox.k-end { background: #eef6ef; border-color: #2e6b3a; border-width: 2.5px; }
.fbox.side { font-size: 11.5px; }
.fbox.on { box-shadow: 0 0 0 3px #0b4f8a; }
.fbox .n { font-size: 10.5px; color: var(--muted); margin-right: 4px; }
.flegend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); }
.flegend span { display: inline-flex; gap: 5px; align-items: center; }
.flegend i { width: 18px; height: 11px; border: 1.5px solid; display: inline-block; }
a.law.reg, a.law.lnk { text-decoration: none; color: #0b4f8a; }
a.law.lnk { white-space: normal; }
a.law.reg:hover, a.law.lnk:hover { text-decoration: underline; }
a.site { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.site:hover { text-decoration: underline; }
#stage { position: relative; flex: 1; min-height: 0; overflow: auto; }
#graph { width: 100%; height: 100%; min-width: 860px; min-height: 560px; display: block; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: none; z-index: 5; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; background: none; padding: 8px 4px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { position: relative; padding: 14px 16px 28px; overflow: auto; flex: 1; display: none; }
.pane.on { display: block; }
h2 { font-size: 17px; margin: 0 0 4px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
button, input, select { font: inherit; color: var(--ink); }
button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
input[type=search], select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
input[type=search] { width: 100%; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; vertical-align: 1px; }
dl { margin: 8px 0 0; display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; }
dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
dd { margin: 0; }
ul.pw { margin: 0; padding: 0; list-style: none; }
ul.pw li { padding: 6px 0; border-top: 1px solid var(--line); }
.refs { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 2px; }
a.art { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #ece6f6; color: #3d2a6e; text-decoration: none; white-space: nowrap; cursor: pointer; }
a.art:hover { background: #ddd2f0; }
a.ext { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.ext:hover { text-decoration: underline; }
.law { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #eee9df; color: #5a554c; white-space: nowrap; }
.conn { padding: 5px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
.conn svg { flex: none; margin-top: 6px; }
.who { font-weight: 600; cursor: pointer; } .who:hover { text-decoration: underline; }
.who.mbtn { display: inline-flex; align-items: center; gap: 1px; font-weight: 600; padding: 0 5px; border: 1px solid var(--line); border-radius: 5px; background: #fff; line-height: 1.35; white-space: nowrap; }
.who.mbtn:hover { border-color: var(--accent); text-decoration: none; background: #f2f6fb; }
.who.mbtn .ico { vertical-align: 0; margin-right: 2px; }
.legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; cursor: pointer; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; flex: none; }
.node { cursor: pointer; }
.node rect.box { stroke-width: 1.6; }
.ico { vertical-align: -2px; margin-right: 3px; flex: none; }
.node .t { font-size: 12.5px; font-weight: 700; fill: var(--ink); pointer-events: none; }
.node .mt.two { font-size: 9.6px; }
.node .mt { font-size: 11px; font-weight: 600; fill: var(--ink); pointer-events: none; }
.node .cnt { fill: #f3e6d6; }
.node .cntt { font-size: 11px; font-weight: 700; fill: #8a4a06; pointer-events: none; }
.zone { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.glabel { font-size: 10.5px; fill: var(--muted); font-weight: 600; cursor: pointer; }
.glabel:hover { fill: var(--ink); text-decoration: underline; }
.group.dim { opacity: .35; }
.unit.hi { background: var(--hi); }
.unit { padding: 3px 0; border-top: 1px dotted var(--line); font-size: 12.5px; display: flex; gap: 8px; justify-content: space-between; }
.node .s { font-size: 10px; fill: var(--muted); pointer-events: none; }
.node.sel rect.box { stroke-width: 3.2; }
.edge { fill: none; opacity: .55; }
.edge.on { opacity: 1; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12px; cursor: pointer; }
.dim { opacity: .1; }
.flow { animation: flow 1.1s linear infinite; stroke-dasharray: 9 5 !important; }
@keyframes flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
.scnpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.scn button.pick { font-size: 12.5px; }
.scn button.pick.on { border-color: var(--accent); background: #eef4fb; }
.step { background: var(--hi); border: 1px solid #e6c873; border-radius: 6px; padding: 10px; margin: 8px 0; }
.stepnav { display: flex; gap: 6px; align-items: center; }
.stepnav .muted { flex: 1; text-align: center; }
.term { display: grid; grid-template-columns: 150px 1fr; gap: 2px 8px; align-items: center; margin: 3px 0; font-size: 12.5px; }
.term .nm { cursor: pointer; text-align: right; } .term .nm:hover { text-decoration: underline; }
.term .tr { position: relative; height: 18px; background: #f0ece3; border-radius: 3px; }
.term .tb { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.term .tl { position: absolute; left: 6px; top: 0; font-size: 11px; line-height: 18px; color: #fff; white-space: nowrap; font-weight: 600; }
.pubrow { padding: 7px 0; border-top: 1px solid var(--line); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.maj { padding: 6px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
.maj b { font-size: 18px; }
.article { border-top: 1px solid var(--line); padding: 8px 0; }
.article.hi { background: var(--hi); margin: 0 -16px; padding: 8px 16px; }
.article .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.article .hd b { cursor: pointer; } .article .hd b:hover { text-decoration: underline; }
.article .tx { white-space: pre-wrap; font-size: 12.5px; margin: 4px 0; }
mark.cit { background: #ffe58a; color: inherit; border-radius: 3px; padding: 1px 2px; box-shadow: inset 3px 0 0 #c98a1b; }
.article .cited { font-size: 12px; color: var(--muted); }
.chap { font-weight: 700; margin: 14px 0 4px; font-size: 13px; color: #3d2a6e; }
.note { font-size: 12px; color: #7a4a00; }
.src { font-size: 12px; background: #f5f1e8; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #stage { height: 64vh; flex: none; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .pane { max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>Държавно устройство на България</h1>
  <p>Кой кого избира, кой може да спре, свали или провери другия. Всяко правомощие е с линк към члена от Конституцията.</p>
  <div class="srch"><input type="search" id="q" placeholder="Търси: институция, агенция, област, правомощие, член…" autocomplete="off" aria-label="Търсене"><div id="results" role="listbox"></div></div>
</header>
<main>
  <div id="left">
    <div class="bar" id="filters"></div>
    <div id="stage"><svg id="graph" viewBox="0 0 1300 1090" role="img" aria-label="Схема на институциите и връзките между тях"></svg></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button data-tab="info" aria-selected="true">Институция</button>
      <button data-tab="scn">Сценарии</button>
      <button data-tab="terms">Мандати</button>
      <button data-tab="pub">Публичност</button>
      <button data-tab="maj">Мнозинства</button>
      <button data-tab="const">Конституция</button>
    </div>
    <div class="pane on" id="p-info"></div>
    <div class="pane scn" id="p-scn"></div>
    <div class="pane" id="p-terms"></div>
    <div class="pane" id="p-pub"></div>
    <div class="pane" id="p-maj"></div>
    <div class="pane" id="p-const"></div>
  </aside>
</main>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
const G = DATA.gov, C = DATA.const;
const NODES = G.nodes, EDGES = G.edges, ET = G.edgeTypes, BR = G.branches, PL = G.publicityLevels;
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const edgeById = Object.fromEntries(EDGES.map(e => [e.id, e]));
const ART_RE = /чл\.\s*(\d+[а-я]?)/g;
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const arts = ref => [...String(ref || '').matchAll(ART_RE)].map(m => m[1]);

const state = { unitHi: null, icons: true, group: null, sel: null, hover: null, scn: null, art: null, hidden: new Set(), color: 'branch', tab: 'info' };

// ---------- links to the Constitution ----------
function officialUrl(key) {
  return C.source.official + '#:~:text=' + encodeURIComponent('Чл. ' + key + '.');
}
function refHtml(ref, law) {
  let h = '';
  if (ref) h += String(ref).split(';').map(p => p.trim()).filter(Boolean).map(p => {
    const k = arts(p)[0];
    return k ? `<a class="art" data-art="${esc(k)}" data-ref="${esc(p)}" title="Покажи текста на чл. ${esc(k)}">${esc(p)}</a>` : `<span class="law">${esc(p)}</span>`;
  }).join('');
  if (law) h += lawHtml(law);
  return h ? `<span class="refs">${h}</span>` : '';
}

// ---------- links to laws ----------
const EU_ACTS = {
  'Договор за Европейския съюз': 'CELEX:12016M/TXT',
  'Договор за функционирането на ЕС': 'CELEX:12016E/TXT',
  'Регламент (ЕС) 2017/1939': 'CELEX:32017R1939',
};
function lawUrl(name) {
  const base = name.replace(/,?\s*(чл\.|ал\.|т\.).*$/, '').trim();
  for (const [k, v] of Object.entries(EU_ACTS)) if (base.startsWith(k)) return { url: 'https://eur-lex.europa.eu/legal-content/BG/TXT/?uri=' + v, where: 'EUR-Lex' };
  if (/^(Закон|Изборен кодекс|Кодекс|Административнопроцесуален|Наказателен|Граждански|Правилник|Устройствен)/.test(base))
    return { url: 'https://www.google.com/search?q=' + encodeURIComponent(`site:lex.bg "${base}"`), where: 'lex.bg' };
  return null;
}
function lawHtml(law) {
  return String(law).split(';').map(p => p.trim()).filter(Boolean).map(p => {
    const u = lawUrl(p);
    return u ? `<a class="law lnk" href="${esc(u.url)}" target="_blank" rel="noopener" title="Уредено в закон, не в Конституцията. Текст в ${u.where}">${esc(p)} ↗</a>`
             : `<span class="law" title="Уредено в закон, не в Конституцията">${esc(p)}</span>`;
  }).join('');
}

// ---------- citation index ----------
const CITED = {};
function cite(ref, item) { for (const k of arts(ref)) (CITED[k] ||= []).push(item); }
for (const n of NODES) {
  const it = { kind: 'node', id: n.id, label: n.label };
  cite(n.refs, it); cite(n.pub?.ref, it);
  for (const p of n.powers || []) cite(p.ref, it);
}
for (const e of EDGES) cite(e.ref, { kind: 'edge', id: e.id, label: `${byId[e.from].label} → ${byId[e.to].label}` });
for (const s of G.scenarios) for (const st of s.steps) cite(st.ref, { kind: 'scn', id: s.id, label: 'Сценарий: ' + s.title });
for (const m of G.majorities) cite(m.ref, { kind: 'maj', id: m.n, label: 'Мнозинство ' + m.label });

const ICONS = {
  ballot: 'M4 12h16v8H4z M8 12V4h8v8 M10 8l1.5 1.5L14 7',
  columns: 'M3 21h18 M4 10h16 M12 3l9 5H3z M6 10v8 M10 10v8 M14 10v8 M18 10v8',
  mic: 'M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3',
  users: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6 M16 5.2a3 3 0 0 1 0 5.6 M21 20c0-2.8-1.6-5-4-5.8',
  euro: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M15.5 9a3.5 3.5 0 1 0 0 6 M7.5 11h6 M7.5 13h6',
  audit: 'M9 3h6v3H9z M7 4.5H5V21h14V4.5h-2 M8.5 14l2.5 2.5 4.5-5',
  heart: 'M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z',
  tv: 'M3 7h18v12H3z M8 3l4 4 4-4',
  bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
  star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
  user: 'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-7 8-7s8 3 8 7',
  shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
  building: 'M4 21V4h16v17 M8 8h2 M14 8h2 M8 12h2 M14 12h2 M8 16h2 M14 16h2 M3 21h18',
  pin: 'M12 21s-7-6-7-12a7 7 0 0 1 14 0c0 6-7 12-7 12z M12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  home: 'M3 11l9-8 9 8 M5 9v12h14V9 M10 21v-6h4v6',
  book: 'M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z M12 6v14',
  search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M21 21l-5-5',
  scale: 'M12 3v18 M7 21h10 M4 7h16 M4 7l-2.5 6a3 3 0 0 0 5 0z M20 7l-2.5 6a3 3 0 0 0 5 0z',
  jet: 'M12 2l2.5 7.5L21 13v2l-6.5-1.5L13 19l2 2H9l2-2-1.5-5.5L3 15v-2l6.5-3.5z',
  globe: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c3 3.5 3 14.5 0 18 M12 3c-3 3.5-3 14.5 0 18',
  briefcase: 'M3 8h18v12H3z M9 8V5h6v3 M3 13h18',
  cap: 'M2 9l10-5 10 5-10 5z M6 11v5c3 2 9 2 12 0v-5 M22 9v6',
  cross: 'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',
  factory: 'M3 21V10l6 4V10l6 4V5h6v16z M3 21h18',
  chip: 'M7 7h10v10H7z M10 3v4 M14 3v4 M10 17v4 M14 17v4 M3 10h4 M3 14h4 M17 10h4 M17 14h4',
  road: 'M8 21L10 3 M16 21L14 3 M12 5v2 M12 10v3 M12 16v3',
  bus: 'M6 3h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M4 11h16 M8 21v-3 M16 21v-3 M8 14.5h.01 M16 14.5h.01',
  wheat: 'M12 21V8 M12 8c-3 0-4-3-4-5 2 0 4 1 4 5 M12 8c3 0 4-3 4-5-2 0-4 1-4 5 M12 14c-3 0-4-3-4-5 2 0 4 1 4 5 M12 14c3 0 4-3 4-5-2 0-4 1-4 5',
  leaf: 'M5 21c0-9 5-15 15-16-1 10-7 15-15 16z M5 21l8-8',
  mask: 'M4 4h16v6a8 8 0 0 1-16 0z M9 9h.01 M15 9h.01 M9 13c1.5 1.5 4.5 1.5 6 0',
  sun: 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7.5l4 3-1.5 4.5h-5L8 10.5z'
};
const iconSvg = (n, size = 16) => n.icon && state.icons ? `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${BR[n.branch].color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n.icon]}"/></svg>` : '';

// ---------- geometry ----------

// cited points of an article: "чл. 84, т. 8; чл. 99, ал. 5" → { '84': [{al: null, t: '8'}], '99': [{al: '5', t: null}] }
function citedParts(ref) {

// article text with the cited paragraphs (ал.) and points (т.) highlighted
function articleTextHtml(k, ref) {
  const text = C.articles[k].text, want = citedParts(ref)[k];
  if (!want) return esc(text);
  const marks = [];
  for (const m of text.matchAll(/(^|\s)\((\d+[а-я]?)\)\s/g)) marks.push({ type: 'al', n: m[2], pos: m.index + m[1].length });
  for (const m of text.matchAll(/(^|\n|[:;]\s)(\d+[а-я]?)\.\s/g)) marks.push({ type: 't', n: m[2], pos: m.index + m[1].length });
  marks.sort((a, b) => a.pos - b.pos);
  const endOf = (i, sameOnly) => { for (let j = i + 1; j < marks.length; j++) if (!sameOnly || marks[j].type === 'al') return marks[j].pos; return text.length; };
  const ranges = [];
  for (const w of want) {
    let lo = 0, hi = text.length;
    if (w.al) {
      const i = marks.findIndex(m => m.type === 'al' && m.n === w.al);
      if (i < 0) continue;
      lo = marks[i].pos; hi = endOf(i, true);
    }
    if (w.t) {
      const i = marks.findIndex(m => m.type === 't' && m.n === w.t && m.pos >= lo && m.pos < hi);
      if (i < 0) continue;
      lo = marks[i].pos; hi = Math.min(hi, endOf(i, false));
    }
    ranges.push([lo, text.slice(lo, hi).trimEnd().length + lo]);
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let h = '', at = 0;
  for (const [lo, hi] of ranges) { if (lo < at) continue; h += esc(text.slice(at, lo)) + `<mark class="cit">${esc(text.slice(lo, hi))}</mark>`; at = hi; }

}

function drawFlow(sc) {
  const flow = $('#flow'); if (!flow) return;
  const base = flow.getBoundingClientRect();
  const R = {};
  flow.querySelectorAll('.fbox').forEach(b => { const r = b.getBoundingClientRect(); R[b.dataset.i] = { l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top, cx: (r.left + r.right) / 2 - base.left, cy: (r.top + r.bottom) / 2 - base.top, side: b.classList.contains('side'), row: +b.dataset.row }; });
  const svgf = document.createElementNS(SVGNS, 'svg');
  svgf.setAttribute('class', 'fl'); svgf.setAttribute('width', base.width); svgf.setAttribute('height', base.height);
  svgf.innerHTML = `<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b6760"/></marker></defs>`;
  let lane = 0;
  const path = (d, label, lx, ly, anchor = 'start') => {
    svgf.insertAdjacentHTML('beforeend', `<path d="${d}" fill="none" stroke="#6b6760" stroke-width="1.4" marker-end="url(#fa)"/>`

  };
  sc.steps.forEach((st, i) => {
    const a = R[i];

      const b = R[nx.to]; if (!b) continue;
      const L = nx.label || '';
      if (!a.side && !b.side && b.row === a.row + 1) {            // straight down
        path(`M${a.cx},${a.b} L${b.cx},${b.t - 1}`, L, a.cx + 5, a.b + 13);
      } else if (!a.side && b.side && b.row === a.row) {                              // across to the side
        const y = Math.min(Math.max(a.cy, b.t + 8), b.b - 8);
        path(`M${a.r},${y} L${b.l - 1},${y}`, L, a.r + 3, y - 4);
      } else if (!a.side && b.side) {                                              // side, lower row
        path(`M${a.r},${a.cy} L${b.cx},${a.cy} L${b.cx},${b.cy < a.cy ? b.b + 1 : b.t - 1}`, L, a.r + 3, a.cy - 4);
      } else if (a.side && !b.side) {                                              // back from the side
        const y = b.t > a.b ? b.cy : b.cy;
        path(`M${a.cx},${a.b} L${a.cx},${y} L${b.r + 1},${y}`, L, a.cx - 4, a.b + 12, 'end');
      } else {                                                                     // jump via the left gutter
        const x = 34 - (lane++ % 3) * 7;
        path(`M${a.l},${a.cy} L${x},${a.cy} L${x},${b.cy} L${b.l - 1},${b.cy}`, L, a.l - 3, a.cy - 4, 'end');

  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)

  for (const qt of nq.split(' ')) {
    let best = 0;
    for (const w of words) {
      if (w.startsWith(qt)) best = Math.max(best, 1);
      else if (qt.length >= 4 && w.length >= 3) {
        const dd = lev1(qt, w.slice(0, qt.length + 1)), d2 = lev1(qt, w);
        const m = Math.min(dd, d2);
        if (m <= (qt.length >= 7 ? 2 : 1)) best = Math.max(best, .7);
      }
      if (!best && qt.length >= 2 && qt.length <= 5 && w.length > 1 && qt === w.replace(/[^а-яa-z]/g, '').slice(0, qt.length)) best = .9;
    }
    if (!best) {  // initials: "кс" → Конституционен съд
      const ini = words.map(w => w[0]).join('');
      if (qt.length >= 2 && ini.includes(qt)) best = .8;
    }
    if (!best) return 0;
    total += best;
  }
  return 60 * total / nq.split(' ').length;
}
const SEARCH = [];
for (const n of NODES) {
  SEARCH.push({ kind: 'Институция', label: n.label + (n.abbr && n.abbr !== n.label ? ` (${n.abbr})` : ''), abbr: n.abbr, text: [n.label, n.short, n.sub, n.abbr].join(' '), extra: n.comp, go: () => select({ kind: 'node', id: n.id }), icon: n });
  for (const u of n.units || []) SEARCH.push({ kind: 'Структура · ' + (n.short || n.label).replace('|', ' '), label: u.name, text: u.name + ' ' + (u.area || ''), go: () => { select({ kind: 'node', id: n.id }); state.unitHi = u.name; renderInfo(); { const u = document.querySelector('.unit.hi'), pane = $('#p-info'); if (u) pane.scrollTop = u.offsetTop - pane.clientHeight / 2; } state.unitHi = null; }, icon: n });
  for (const pw of n.powers || []) SEARCH.push({ kind: 'Правомощие · ' + n.label, label: pw.t, text: pw.t, go: () => select({ kind: 'node', id: n.id }), weak: true });
}
for (const e of EDGES) SEARCH.push({ kind: 'Връзка · ' + byId[e.from].label + ' → ' + byId[e.to].label, label: e.label, text: e.label, go: () => select({ kind: 'edge', id: e.id }), weak: true });
for (const g of G.groups) SEARCH.push({ kind: 'Група', label: g.label, text: g.label, go: () => selectGroup(g.id) });
for (const sc of G.scenarios) SEARCH.push({ kind: 'Сценарий', label: sc.title, text: sc.title + ' ' + sc.steps.map(x => x.title).join(' '), go: () => { setTab('scn'); state.scn = { id: sc.id, i: 0 }; renderScn(); paint(); } });
for (const [k, a] of Object.entries(C.articles)) SEARCH.push({ kind: 'Конституция', label: 'Чл. ' + k, text: 'чл ' + k + ' член ' + k, extra: a.text, go: () => openArticle(k), weak: true });
let hits = [], act = 0;
const qi = $('#q'), res = $('#results');
function hl(label, q) {
  const nq = norm(q).split(' ').filter(x => x.length > 1);
  let h = esc(label);
  for (const t of nq) h = h.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
  return h;
}
function runSearch() {
  const q = qi.value;
  if (norm(q).length < 2) { res.classList.remove('on'); hits = []; return; }
  hits = SEARCH.map(it => {
    let sc = it.abbr && norm(it.abbr) === norm(q) ? 110 : fuzzyScore(q, it.text);
    if (!sc && it.extra) sc = fuzzyScore(q, it.extra) * .6;
    if (it.weak) sc *= .8;
    return { it, sc };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 14);
  act = 0;
  res.innerHTML = hits.length ? hits.map((h, i) => `<div class="r${i === act ? ' act' : ''}" data-h="${i}" role="option">${h.it.icon ? iconSvg(h.it.icon, 13) : ''}${hl(h.it.label, q)}<div class="k">${esc(h.it.kind)}</div></div>`).join('') : '<div class="r muted">Няма резултати</div>';
  res.classList.add('on');
}
function pick(i) { const h = hits[i]; if (!h) return; res.classList.remove('on'); h.it.go(); }
qi.addEventListener('input', runSearch);
qi.addEventListener('focus', runSearch);
qi.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); act = (act + (ev.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(hits.length, 1); res.querySelectorAll('.r').forEach((r, i) => r.classList.toggle('act', i === act)); res.querySelector('.r.act')?.scrollIntoView({ block: 'nearest' }); }
  if (ev.key === 'Enter') { ev.preventDefault(); pick(act); }
  if (ev.key === 'Escape') { res.classList.remove('on'); qi.blur(); }
});
res.addEventListener('mousedown', ev => { const r = ev.target.closest('[data-h]'); if (r) { ev.preventDefault(); pick(+r.dataset.h); } });
qi.addEventListener('blur', () => setTimeout(() => res.classList.remove('on'), 120));
document.addEventListener('keydown', ev => { if (ev.key === '/' && !ev.target.closest('input,select,textarea')) { ev.preventDefault(); qi.focus(); } });

// ---------- delegated clicks ----------
document.addEventListener('click', ev => {
  const a = ev.target.closest('a.art, .article .hd b[data-art]');
  if (a) { ev.preventDefault(); openArticle(a.dataset.art, a.dataset.ref); return; }
  const w = ev.target.closest('[data-node]');
  if (w) { ev.preventDefault(); select({ kind: 'node', id: w.dataset.node }); return; }
  const gq = ev.target.closest('[data-group]');
  if (gq) { ev.preventDefault(); selectGroup(gq.dataset.group); return; }
  const ed = ev.target.closest('[data-edge]');
  if (ed) { ev.preventDefault(); select({ kind: 'edge', id: ed.dataset.edge }); return; }
  if (ev.target.closest('a.back')) { ev.preventDefault(); select(null); }
});

renderFilters(); colorNodes(); renderInfo(); paint();
</script>
