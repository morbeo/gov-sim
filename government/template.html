<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Политико: държавно устройство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea;
  --panel: #fffdf8;
  --ink: #1d1d1f;
  --muted: #6b6760;
  --line: #d9d3c7;
  --accent: #0b4f8a;
  --hi: #fff4d6;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { display: flex; flex-direction: column; height: 100vh; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
h1 { margin: 0; font-size: 20px; }
header p { margin: 0; color: var(--muted); flex: 1 1 320px; }
.srch { position: relative; flex: 0 1 380px; min-width: 240px; }
.srch input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
#results { position: absolute; right: 0; left: 0; top: 100%; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; z-index: 10; display: none; }
#results.on { display: block; }
#results .r { padding: 6px 10px; cursor: pointer; border-top: 1px solid #eee7da; font-size: 13px; }
#results .r:first-child { border-top: 0; }
#results .r.act, #results .r:hover { background: #eef4fb; }
#results .r .k { font-size: 11px; color: var(--muted); }
#results mark { background: #ffe9a8; padding: 0; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; flex: 1; min-height: 0; }
#left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; user-select: none; }
.chip.off { opacity: .4; text-decoration: line-through; }
.chip svg { flex: none; }
.bar .sp { flex: 1; }
.clegend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11.5px; flex: 1 1 300px; justify-content: flex-end; }
.clegend span { display: inline-flex; align-items: center; gap: 5px; }
.clegend i { width: 12px; height: 12px; border: 2.5px solid; border-radius: 3px; background: #fff; }
.fchart { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 118px; column-gap: 30px; row-gap: 24px; align-items: start; padding: 6px 0 6px 64px; margin: 10px 0; }
.fchart svg.fl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.fbox { background: #fff; border: 1.5px solid #8c877d; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; line-height: 1.3; cursor: pointer; position: relative; z-index: 1; }
.fbox:hover { border-color: var(--ink); }
.fbox.k-decision { background: #fff8e6; border-color: #c98a1b; border-radius: 18px; text-align: center; }
.fbox.k-end { background: #eef6ef; border-color: #2e6b3a; border-width: 2.5px; }
.fbox.side { font-size: 11.5px; }
.fbox.on { box-shadow: 0 0 0 3px #0b4f8a; }
.fbox .n { font-size: 10.5px; color: var(--muted); margin-right: 4px; }
.flegend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); }
.flegend span { display: inline-flex; gap: 5px; align-items: center; }
.flegend i { width: 18px; height: 11px; border: 1.5px solid; display: inline-block; }
a.law.reg, a.law.lnk { text-decoration: none; color: #0b4f8a; }
a.law.lnk { white-space: normal; }
a.law.reg:hover, a.law.lnk:hover { text-decoration: underline; }
a.site { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.site:hover { text-decoration: underline; }
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#graph { width: 100%; height: 100%; min-height: 420px; display: block; touch-action: none; cursor: grab; user-select: none; }
#graph.panning { cursor: grabbing; }
.ctl { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
.ctl button { width: 34px; height: 34px; padding: 0; font-size: 17px; line-height: 1; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ctl button.on, .seg button.on { background: #0b4f8a; color: #fff; border-color: #0b4f8a; }
.ctl .sepr { height: 6px; }
.hint { transition: opacity .6s; position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); background: rgba(255,253,248,.85); padding: 2px 8px; border-radius: 10px; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; font-size: 12px; padding: 4px 9px; }
.seg button + button { border-left: 1px solid var(--line); }
.fwrap { position: relative; }
.fpop { position: absolute; left: 0; top: calc(100% + 6px); z-index: 12; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.14); padding: 10px 12px; width: min(560px, 86vw); display: none; }
.fpop.on { display: block; }
.fpop h4 { margin: 8px 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.fpop h4:first-child { margin-top: 0; }
.fpop .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fpop .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navrow { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.navrow button { font-size: 12px; padding: 3px 9px; }
.navrow .sp { flex: 1; }
.navrow input { font-size: 11.5px; flex: 1; min-width: 0; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.proxy { cursor: pointer; }
.proxy rect { fill: #fff; stroke-dasharray: 5 3; stroke-width: 1.6; }
.proxy.sel rect { stroke-width: 3.2; stroke: var(--ink); }
.proxy .t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.proxy .s { font-size: 10px; fill: var(--muted); }
.gtog { font-size: 12px; fill: var(--muted); cursor: pointer; font-weight: 700; }
.gtog:hover { fill: var(--ink); }
.under { opacity: .35; pointer-events: none; }
.ubox { cursor: pointer; }
.ubox:hover rect { stroke-width: 2.6; }
.uk { font-size: 14px; font-weight: 700; }
.ut { font-size: 13px; fill: var(--ink); pointer-events: none; }
.uct { font-size: 15px; font-weight: 700; fill: var(--ink); }
.ucs { font-size: 11px; fill: var(--muted); }
.node.gone, .proxy.gone { opacity: .05; pointer-events: none; }
#gZones.faded { opacity: .25; transition: opacity .3s; }
.node.pulse rect.box { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-width: 4.5; } }
@media (prefers-reduced-motion: reduce) { .node.pulse rect.box { animation: none; } }
.fbox.done { background: #f2f0ea; }
.scnbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.scnbar .sp { flex: 1; }
aside.full { position: fixed; inset: 0; z-index: 30; border: 0; }
aside.full .tabs, aside.full .navrow { display: none; }
aside.full #p-scn { padding: 16px 28px 40px; }
aside.full .scnbody { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 28px; align-items: start; }
aside.full .scndet { position: sticky; top: 0; }
aside.full .fchart { grid-template-columns: minmax(0, 1fr) 220px; column-gap: 90px; row-gap: 30px; }
aside.full .fbox { font-size: 14px; padding: 9px 12px; }
.wq { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.wq select { max-width: 100%; }
.wres h4 { margin: 12px 0 4px; font-size: 13px; }
.ans { font-size: 13px; background: #eef4fb; border: 1px solid #c9dbee; border-radius: 6px; padding: 6px 9px; margin: 8px 0; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: none; z-index: 5; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; background: none; padding: 8px 4px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { position: relative; padding: 14px 16px 28px; overflow: auto; flex: 1; display: none; }
.pane.on { display: block; }
h2 { font-size: 17px; margin: 0 0 4px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
button, input, select { font: inherit; color: var(--ink); }
button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
input[type=search], select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
input[type=search] { width: 100%; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; vertical-align: 1px; }
dl { margin: 8px 0 0; display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; }
dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
dd { margin: 0; }
ul.pw { margin: 0; padding: 0; list-style: none; }
ul.pw li { padding: 6px 0; border-top: 1px solid var(--line); }
.refs { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 2px; }
a.art { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #ece6f6; color: #3d2a6e; text-decoration: none; white-space: nowrap; cursor: pointer; }
a.art:hover { background: #ddd2f0; }
a.ext { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.ext:hover { text-decoration: underline; }
.law { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #eee9df; color: #5a554c; white-space: nowrap; }
.conn { padding: 5px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
.conn svg { flex: none; margin-top: 6px; }
.who { font-weight: 600; cursor: pointer; } .who:hover { text-decoration: underline; }
.who.mbtn { display: inline-flex; align-items: center; gap: 1px; font-weight: 600; padding: 0 5px; border: 1px solid var(--line); border-radius: 5px; background: #fff; line-height: 1.35; white-space: nowrap; }
.who.mbtn:hover { border-color: var(--accent); text-decoration: none; background: #f2f6fb; }
.who.mbtn .ico { vertical-align: 0; margin-right: 2px; }
.legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; cursor: pointer; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; flex: none; }
.node { cursor: pointer; }
.node rect.box { stroke-width: 1.6; }
.ico { vertical-align: -2px; margin-right: 3px; flex: none; }
.node .t { font-size: 12.5px; font-weight: 700; fill: var(--ink); pointer-events: none; }
.node .mt.two { font-size: 9.6px; }
.node .mt { font-size: 11px; font-weight: 600; fill: var(--ink); pointer-events: none; }
.node .cnt { fill: #f3e6d6; }
.node .cntt { font-size: 11px; font-weight: 700; fill: #8a4a06; pointer-events: none; }
.zone { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.glabel { font-size: 10.5px; fill: var(--muted); font-weight: 600; cursor: pointer; }
.glabel:hover { fill: var(--ink); text-decoration: underline; }
.group.dim { opacity: .35; }
.unit.hi { background: var(--hi); }
.unit { padding: 3px 0; border-top: 1px dotted var(--line); font-size: 12.5px; display: flex; gap: 8px; justify-content: space-between; }
.node .s { font-size: 10px; fill: var(--muted); pointer-events: none; }
.node.sel rect.box { stroke-width: 3.2; }
.node.nonstate rect.box { stroke-dasharray: 5 3; fill: #fbfaf6; }
.nsbadge { font-size: 8.5px; font-weight: 700; fill: #6b6760; letter-spacing: .04em; }
.badge.ns { color: #6b6760; border-style: dashed; }
.edge { fill: none; opacity: .55; }
.edge.on { opacity: 1; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12px; cursor: pointer; }
.dim { opacity: .1; }
.flow { animation: flow 1.1s linear infinite; stroke-dasharray: 9 5 !important; }
@keyframes flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
.scnpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.scn button.pick { font-size: 12.5px; }
.scn button.pick.on { border-color: var(--accent); background: #eef4fb; }
.step { background: var(--hi); border: 1px solid #e6c873; border-radius: 6px; padding: 10px; margin: 8px 0; }
.stepnav { display: flex; gap: 6px; align-items: center; }
.stepnav .muted { flex: 1; text-align: center; }
.term { display: grid; grid-template-columns: 150px 1fr; gap: 2px 8px; align-items: center; margin: 3px 0; font-size: 12.5px; }
.term .nm { cursor: pointer; text-align: right; } .term .nm:hover { text-decoration: underline; }
.term .tr { position: relative; height: 18px; background: #f0ece3; border-radius: 3px; }
.term .tb { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.term .tl { position: absolute; left: 6px; top: 0; font-size: 11px; line-height: 18px; color: #fff; white-space: nowrap; font-weight: 600; }
.pubrow { padding: 7px 0; border-top: 1px solid var(--line); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.maj { padding: 6px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
.maj b { font-size: 18px; }
.article { border-top: 1px solid var(--line); padding: 8px 0; }
.article.hi { background: var(--hi); margin: 0 -16px; padding: 8px 16px; }
.article .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.article .hd b { cursor: pointer; } .article .hd b:hover { text-decoration: underline; }
.article .tx { white-space: pre-wrap; font-size: 12.5px; margin: 4px 0; }
mark.cit { background: #ffe58a; color: inherit; border-radius: 3px; padding: 1px 2px; box-shadow: inset 3px 0 0 #c98a1b; }
.article .cited { font-size: 12px; color: var(--muted); }
.chap { font-weight: 700; margin: 14px 0 4px; font-size: 13px; color: #3d2a6e; }
.note { font-size: 12px; color: #7a4a00; }
.src { font-size: 12px; background: #f5f1e8; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
@media (max-width: 900px) {
  body { height: auto; display: block; }
  main { grid-template-columns: minmax(0, 1fr); height: auto; }
  .clegend { justify-content: flex-start; }
  .hint { display: none; }
  #stage { height: 70vh; flex: none; }
  aside.full .scnbody { grid-template-columns: 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .pane { max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>Държавно устройство на България</h1>
  <p>Кой кого избира, кой може да спре, свали или провери другия. Всяко правомощие е с линк към члена от Конституцията.</p>
  <div class="srch"><input type="search" id="q" placeholder="Търси: институция, агенция, област, правомощие, член…" autocomplete="off" aria-label="Търсене"><div id="results" role="listbox"></div></div>
</header>
<main>
  <div id="left">
    <div class="bar" id="filters"></div>
    <div id="stage"><svg id="graph" viewBox="0 0 1300 1310" role="img" aria-label="Схема на институциите и връзките между тях"></svg>
      <div class="ctl">
        <button id="zin" title="Приближи (+)" aria-label="Приближи">+</button>
        <button id="zout" title="Отдалечи (−)" aria-label="Отдалечи">−</button>
        <button id="zfit" title="Побери цялата схема (0)" aria-label="Побери">⤢</button>
        <span class="sepr"></span>
        <button id="star" title="Фокус: подреди връзките на избрания орган около него (F)" aria-pressed="false" aria-label="Фокус">✶</button>
      </div>
      <div class="hint" id="hint">Колелце: мащаб · влачене: местене · F: фокус</div>
    </div>
  </div>
  <aside>
    <div class="navrow">
      <button id="hback" title="Назад (Alt+←)">← Назад</button>
      <button id="hfwd" title="Напред (Alt+→)">Напред →</button>
      <span class="sp"></span>
      <button id="share" title="Копирай линк към текущия изглед">🔗 Линк</button>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="info" aria-selected="true">Институция</button>
      <button data-tab="scn">Сценарии</button>
      <button data-tab="ref">Справки</button>
      <button data-tab="const">Конституция</button>
    </div>
    <div class="pane on" id="p-info"></div>
    <div class="pane scn" id="p-scn"></div>
    <div class="pane" id="p-ref"></div>
    <div class="pane" id="p-const"></div>
  </aside>
</main>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
const G = DATA.gov, C = DATA.const;
const NODES = G.nodes, EDGES = G.edges, ET = G.edgeTypes, BR = G.branches, PL = G.publicityLevels;
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const edgeById = Object.fromEntries(EDGES.map(e => [e.id, e]));
const ART_RE = /чл\.\s*(\d+[а-я]?)/g;
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const arts = ref => [...String(ref || '').matchAll(ART_RE)].map(m => m[1]);

const state = { unitHi: null, icons: true, group: null, sel: null, hover: null, scn: null, art: null, hidden: new Set(), color: 'branch', tab: 'info',
  lines: 'focus',        // 'focus': lines only for the hovered / selected item; 'all': every line
  star: false,           // focus mode: arrange the selected institution's links around it
  collapsed: new Set(),  // collapsed group ids
  ref: 'who', whoQ: '',  // reference tab section and "who can" query
  play: null, scnFull: false };

// ---------- links to the Constitution ----------
function officialUrl(key) {
  return C.source.official + '#:~:text=' + encodeURIComponent('Чл. ' + key + '.');
}
function refHtml(ref, law) {
  let h = '';
  if (ref) h += String(ref).split(';').map(p => p.trim()).filter(Boolean).map(p => {
    const k = arts(p)[0];
    return k ? `<a class="art" data-art="${esc(k)}" data-ref="${esc(p)}" title="Покажи текста на чл. ${esc(k)}">${esc(p)}</a>` : `<span class="law">${esc(p)}</span>`;
  }).join('');
  if (law) h += lawHtml(law);
  return h ? `<span class="refs">${h}</span>` : '';
}

// ---------- links to laws ----------
const EU_ACTS = {
  'Договор за Европейския съюз': 'CELEX:12016M/TXT',
  'Договор за функционирането на ЕС': 'CELEX:12016E/TXT',
  'Регламент (ЕС) 2017/1939': 'CELEX:32017R1939',
};
function lawUrl(name) {
  const base = name.replace(/,?\s*(чл\.|ал\.|т\.).*$/, '').trim();
  for (const [k, v] of Object.entries(EU_ACTS)) if (base.startsWith(k)) return { url: 'https://eur-lex.europa.eu/legal-content/BG/TXT/?uri=' + v, where: 'EUR-Lex' };
  if (/^(Закон|Изборен кодекс|Кодекс|Административнопроцесуален|Наказателен|Граждански|Правилник|Устройствен)/.test(base))
    return { url: 'https://www.google.com/search?q=' + encodeURIComponent(`site:lex.bg "${base}"`), where: 'lex.bg' };
  return null;
}
function lawHtml(law) {
  return String(law).split(';').map(p => p.trim()).filter(Boolean).map(p => {
    const u = lawUrl(p);
    return u ? `<a class="law lnk" href="${esc(u.url)}" target="_blank" rel="noopener" title="Уредено в закон, не в Конституцията. Текст в ${u.where}">${esc(p)} ↗</a>`
             : `<span class="law" title="Уредено в закон, не в Конституцията">${esc(p)}</span>`;
  }).join('');
}

// ---------- citation index ----------
const CITED = {};

// cited points of an article: "чл. 84, т. 8; чл. 99, ал. 5" → { '84': [{al: null, t: '8'}], '99': [{al: '5', t: null}] }
function citedParts(ref) {
  const out = {};
  for (const part of String(ref || '').split(';')) {
    const k = arts(part)[0]; if (!k) continue;
    const al = part.match(/ал\.\s*(\d+[а-я]?)/)?.[1] || null, t = part.match(/т\.\s*(\d+[а-я]?)/)?.[1] || null;
    if (al || t) (out[k] ||= []).push({ al, t });
  }
  return out;
}
// article text with the cited paragraphs (ал.) and points (т.) highlighted
function articleTextHtml(k, ref) {
  const text = C.articles[k].text, want = citedParts(ref)[k];
  if (!want) return esc(text);
  const marks = [];
  for (const m of text.matchAll(/(^|\s)\((\d+[а-я]?)\)\s/g)) marks.push({ type: 'al', n: m[2], pos: m.index + m[1].length });
  for (const m of text.matchAll(/(^|\n|[:;]\s)(\d+[а-я]?)\.\s/g)) marks.push({ type: 't', n: m[2], pos: m.index + m[1].length });
  marks.sort((a, b) => a.pos - b.pos);
  const endOf = (i, sameOnly) => { for (let j = i + 1; j < marks.length; j++) if (!sameOnly || marks[j].type === 'al') return marks[j].pos; return text.length; };
  const ranges = [];
  for (const w of want) {
    let lo = 0, hi = text.length;
    if (w.al) {
      const i = marks.findIndex(m => m.type === 'al' && m.n === w.al);
      if (i < 0) continue;
      lo = marks[i].pos; hi = endOf(i, true);
    }
    if (w.t) {
      const i = marks.findIndex(m => m.type === 't' && m.n === w.t && m.pos >= lo && m.pos < hi);
      if (i < 0) continue;
      lo = marks[i].pos; hi = Math.min(hi, endOf(i, false));
    }
    ranges.push([lo, text.slice(lo, hi).trimEnd().length + lo]);
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let h = '', at = 0;
  for (const [lo, hi] of ranges) { if (lo < at) continue; h += esc(text.slice(at, lo)) + `<mark class="cit">${esc(text.slice(lo, hi))}</mark>`; at = hi; }
  return h + esc(text.slice(at));
}
function articleBlocks(ref) {
  return [...new Set(arts(ref))].map(k => {
    const a = C.articles[k];
    return `<div class="article"><div class="hd"><b data-art="${k}" data-ref="${esc(ref)}">Чл. ${esc(k)}</b><span class="badge muted">${a.verbatim ? 'Текст' : 'Резюме'}</span><a class="ext" href="${officialUrl(k)}" target="_blank" rel="noopener">официален текст ↗</a></div><div class="tx">${articleTextHtml(k, ref)}</div>${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}</div>`;
  }).join('');
}

// ---------- scenarios (flowchart) ----------
function stepNext(sc, i) {
  const st = sc.steps[i];
  if (st.next) return st.next;
  return st.kind === 'end' || i + 1 >= sc.steps.length ? [] : [{ to: i + 1 }];
}
function renderScn() {

  h += `<div class="scnpick">${G.scenarios.map(s => `<button class="pick${cur?.id === s.id ? ' on' : ''}" data-scn="${s.id}">${esc(s.title)}</button>`).join('')}</div>`;
  if (cur) {
    // rows: main steps in order; a side step sits on the row of the first step that leads to it
    const rowOf = {}, sideOn = {};
    let row = 0;
    cur.steps.forEach((st, i) => {
      if (st.side) return;
      rowOf[i] = row++;
      for (const nx of stepNext(cur, i)) {
        const t = cur.steps[nx.to];
        if (t?.side && rowOf[nx.to] === undefined && !sideOn[rowOf[i]]) { rowOf[nx.to] = rowOf[i]; sideOn[rowOf[i]] = true; }
      }
    });
    cur.steps.forEach((st, i) => { if (rowOf[i] === undefined) rowOf[i] = row++; });
    h += `<div class="scnbar"><button id="play" class="small">${state.play ? '⏸ Пауза' : state.scn.i && !stepNext(cur, state.scn.i).length ? '↺ Отначало' : '▶ Пусни'}</button><button id="sprev" class="small" ${state.scn.i ? '' : 'disabled'}>←</button><button id="snext" class="small" ${stepNext(cur, state.scn.i).length ? '' : 'disabled'}>→</button><span class="sp"></span><button id="full" class="small">${state.scnFull ? '✕ Затвори' : '⛶ На цял екран'}</button></div>`;
    h += `<div class="scnbody"><div class="scnflow"><div class="flegend"><span><i style="border-color:#8c877d"></i>действие</span><span><i style="border-color:#c98a1b;background:#fff8e6;border-radius:6px"></i>въпрос / решение</span><span><i style="border-color:#2e6b3a;background:#eef6ef;border-width:2.5px"></i>край</span></div>`;
    h += `<div class="fchart" id="flow">${cur.steps.map((st, i) => `<div class="fbox k-${st.kind}${st.side ? ' side' : ''}${i === state.scn.i ? ' on' : ''}${state.scn.seen?.includes(i) && i !== state.scn.i ? ' done' : ''}" data-i="${i}" data-row="${rowOf[i]}" style="grid-row:${rowOf[i] + 1};grid-column:${st.side ? 2 : 1}"><span class="n">${i + 1}</span>${esc(st.title)}</div>`).join('')}</div></div>`;
    const st = cur.steps[state.scn.i];
    h += `<div class="scndet"><div class="step"><b>${state.scn.i + 1}. ${esc(st.title)}</b><p>${lk(st.text)}</p><p>${refHtml(st.ref, st.law)}</p><p class="small">${st.nodes.map(who).join(' · ')}</p>
      ${stepNext(cur, state.scn.i).length ? `<div class="small">Следва: ${stepNext(cur, state.scn.i).map(nx => `<a href="#" class="goto" data-i="${nx.to}">${nx.label ? esc(nx.label) + ' → ' : ''}${esc(cur.steps[nx.to].title)}</a>`).join(' · ')}</div>` : '<div class="small muted">Край на процедурата.</div>'}</div>${articleBlocks(st.ref)}</div></div>`;
  }
  p.innerHTML = h;
  p.querySelectorAll('[data-scn]').forEach(b => b.addEventListener('click', () => { stopPlay(); openScn(b.dataset.scn, 0); }));
  p.querySelectorAll('.fbox, a.goto').forEach(b => b.addEventListener('click', ev => { ev.preventDefault(); goStep(+b.dataset.i); }));
  if (cur) {
    $('#play').addEventListener('click', () => state.play ? stopPlay() : startPlay());
    $('#sprev').addEventListener('click', () => { const sn = state.scn.seen || []; goStep(sn.length > 1 ? sn[sn.length - 2] : 0, true); });
    $('#snext').addEventListener('click', () => { const nx = stepNext(cur, state.scn.i)[0]; if (nx) goStep(nx.to); });

}
function openScn(id, i = 0) {
  if (state.tab !== 'scn') setTab('scn');
  state.scn = { id, i, seen: [i] }; state.sel = null;
  renderScn(); paint();
}
// go to a step; "back" drops the last visited step instead of adding one
function goStep(i, back = false) {
  const sc = state.scn; if (!sc) return;
  if (back) { sc.seen = (sc.seen || []).slice(0, -1); if (!sc.seen.length) sc.seen = [i]; }
  else (sc.seen ||= []).push(i);
  sc.i = i; renderScn(); paint();
  if (state.play) { sc.zoomed = true; fitNodes(G.scenarios.find(s => s.id === sc.id).steps[i].nodes, 90); }
}
function startPlay() {
  const sc = G.scenarios.find(s => s.id === state.scn.id);
  if (!stepNext(sc, state.scn.i).length) { state.scn.seen = []; state.scn.i = 0; }
  state.play = setInterval(() => {
    const nx = stepNext(sc, state.scn.i)[0];
    if (!nx || (state.scn.seen || []).filter(x => x === nx.to).length > 1) return stopPlay();
    goStep(nx.to);
  }, 2800);

}
function stopPlay(fit = true) {
  if (!state.play) return;

}
function setFull(on) {

}
function drawFlow(sc) {
  const flow = $('#flow'); if (!flow) return;
  const base = flow.getBoundingClientRect();
  const R = {};
  flow.querySelectorAll('.fbox').forEach(b => { const r = b.getBoundingClientRect(); R[b.dataset.i] = { l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top, cx: (r.left + r.right) / 2 - base.left, cy: (r.top + r.bottom) / 2 - base.top, side: b.classList.contains('side'), row: +b.dataset.row }; });
  const svgf = document.createElementNS(SVGNS, 'svg');
  svgf.setAttribute('class', 'fl'); svgf.setAttribute('width', base.width); svgf.setAttribute('height', base.height);
  svgf.innerHTML = `<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b6760"/></marker></defs>`;
  let lane = 0;
  const path = (d, label, lx, ly, anchor = 'start') => {
    svgf.insertAdjacentHTML('beforeend', `<path d="${d}" fill="none" stroke="#6b6760" stroke-width="1.4" marker-end="url(#fa)"/>`
      + (label ? `<text x="${lx}" y="${ly}" font-size="10.5" fill="#8a4a06" font-weight="600" text-anchor="${anchor}" paint-order="stroke" stroke="#fffdf8" stroke-width="3">${esc(label)}</text>` : ''));
  };
  sc.steps.forEach((st, i) => {
    const a = R[i];
    for (const nx of stepNext(sc, i)) {
      const b = R[nx.to]; if (!b) continue;
      const L = nx.label || '';
      if (!a.side && !b.side && b.row === a.row + 1) {            // straight down
        path(`M${a.cx},${a.b} L${b.cx},${b.t - 1}`, L, a.cx + 5, a.b + 13);
      } else if (!a.side && b.side && b.row === a.row) {                              // across to the side
        const y = Math.min(Math.max(a.cy, b.t + 8), b.b - 8);
        path(`M${a.r},${y} L${b.l - 1},${y}`, L, a.r + 3, y - 4);
      } else if (!a.side && b.side) {                                              // side, lower row
        path(`M${a.r},${a.cy} L${b.cx},${a.cy} L${b.cx},${b.cy < a.cy ? b.b + 1 : b.t - 1}`, L, a.r + 3, a.cy - 4);
      } else if (a.side && !b.side) {                                              // back from the side
        const y = b.t > a.b ? b.cy : b.cy;
        path(`M${a.cx},${a.b} L${a.cx},${y} L${b.r + 1},${y}`, L, a.cx - 4, a.b + 12, 'end');
      } else {                                                                     // jump via the left gutter

        path(`M${a.l},${a.cy} L${x},${a.cy} L${x},${b.cy} L${b.l - 1},${b.cy}`, L, b.l - 4, b.cy - 5, 'end');   // label at the target: several jumps can leave one box

    state.star = star; $('#star').classList.toggle('on', star); $('#star').setAttribute('aria-pressed', star);
    state.sel = null; state.group = null; state.art = null; state.whoHi = null;
    if (q.get('s')) { const [id, i] = q.get('s').split('.'); if (G.scenarios.some(s => s.id === id)) { setTab('scn'); state.scn = { id, i: Math.max((+i || 1) - 1, 0), seen: [Math.max((+i || 1) - 1, 0)] }; renderScn(); } }
    else if (q.get('t') === 'scn') setTab('scn');
    else if (q.get('a') && C.articles[q.get('a')]) { setTab('const'); state.art = q.get('a'); renderConst(state.art); }
    else if (q.get('t') === 'const') setTab('const');
    else if (q.get('r')) { state.ref = REFS[q.get('r')] ? q.get('r') : 'who'; state.whoQ = q.get('q') || ''; setTab('ref'); }
    else {
      if (state.tab !== 'info') setTab('info');
      if (q.get('n') && byId[q.get('n')]) state.sel = { kind: 'node', id: q.get('n') };
      else if (q.get('e') && edgeById[q.get('e')]) state.sel = { kind: 'edge', id: q.get('e') };
      else if (q.get('g') && G.groups.some(g => g.id === q.get('g'))) state.group = q.get('g');
      renderInfo();
    }
    placeNodes(); applyStar(); paint();
  } finally { nav.applying = false; }
  navButtons();
}
addEventListener('popstate', ev => { nav.idx = ev.state?.i ?? 0; applyHash(location.hash); });
$('#hback').addEventListener('click', () => { if (canPush) history.back(); else if (nav.i > 0) applyHash(nav.stack[--nav.i]); });
$('#hfwd').addEventListener('click', () => { if (canPush) history.forward(); else if (nav.i < nav.stack.length - 1) applyHash(nav.stack[++nav.i]); });
$('#share').addEventListener('click', async () => {
  const url = location.href.split('#')[0] + '#' + viewHash();
  const b = $('#share');
  try { await navigator.clipboard.writeText(url); b.textContent = '✓ Копирано'; setTimeout(() => { b.textContent = '🔗 Линк'; }, 1600); }
  catch {
    const row = $('.navrow'); row.querySelector('input')?.remove();
    const inp = document.createElement('input'); inp.value = url; inp.readOnly = true; inp.setAttribute('aria-label', 'Линк към изгледа');
    row.insertBefore(inp, b); inp.select();
  }
});

// ---------- keyboard ----------
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,select,textarea')) return;
  if (ev.altKey && ev.key === 'ArrowLeft') { ev.preventDefault(); $('#hback').click(); return; }
  if (ev.altKey && ev.key === 'ArrowRight') { ev.preventDefault(); $('#hfwd').click(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === '+' || ev.key === '=') zoomAt(vb.x + vb.w / 2, vb.y + vb.h / 2, .8);
  else if (ev.key === '-') zoomAt(vb.x + vb.w / 2, vb.y + vb.h / 2, 1.25);
  else if (ev.key === '0') fitAll();
  else if (ev.key === 'f' || ev.key === 'F' || ev.key === 'ф' || ev.key === 'Ф') setStar(!state.star);
});

// ---------- delegated clicks ----------
document.addEventListener('click', ev => {
  const a = ev.target.closest('a.art, .article .hd b[data-art]');
  if (a) { ev.preventDefault(); openArticle(a.dataset.art, a.dataset.ref); return; }
  const w = ev.target.closest('[data-node]');
  if (w) { ev.preventDefault(); select({ kind: 'node', id: w.dataset.node }); return; }
  const gq = ev.target.closest('[data-group]');
  if (gq) { ev.preventDefault(); selectGroup(gq.dataset.group); return; }
  const ed = ev.target.closest('[data-edge]');
  if (ed) { ev.preventDefault(); select({ kind: 'edge', id: ed.dataset.edge }); return; }
  const ub = ev.target.closest('[data-units]');
  if (ub) { ev.preventDefault(); showUnits(ub.dataset.units); return; }
  if (ev.target.closest('a.back')) { ev.preventDefault(); select(null); }
});

setTimeout(() => { $('#hint').style.opacity = 0; }, 9000);
renderFilters(); colorNodes();
if (location.hash.length > 1) applyHash(location.hash); else { renderInfo(); paint(); }
navButtons();
</script>
</body>
