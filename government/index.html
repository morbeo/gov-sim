<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Политико: държавно устройство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea;
  --panel: #fffdf8;
  --ink: #1d1d1f;
  --muted: #6b6760;
  --line: #d9d3c7;
  --accent: #0b4f8a;
  --hi: #fff4d6;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { display: flex; flex-direction: column; height: 100vh; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
h1 { margin: 0; font-size: 20px; }
header p { margin: 0; color: var(--muted); flex: 1 1 320px; }
.srch { position: relative; flex: 0 1 380px; min-width: 240px; }
.srch input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
#results { position: absolute; right: 0; left: 0; top: 100%; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; z-index: 10; display: none; }
#results.on { display: block; }
#results .r { padding: 6px 10px; cursor: pointer; border-top: 1px solid #eee7da; font-size: 13px; }
#results .r:first-child { border-top: 0; }
#results .r.act, #results .r:hover { background: #eef4fb; }
#results .r .k { font-size: 11px; color: var(--muted); }
#results mark { background: #ffe9a8; padding: 0; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; flex: 1; min-height: 0; }
#left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; user-select: none; }
.chip.off { opacity: .4; text-decoration: line-through; }
.chip svg { flex: none; }
.bar .sp { flex: 1; }
.clegend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11.5px; flex: 1 1 300px; justify-content: flex-end; }
.clegend span { display: inline-flex; align-items: center; gap: 5px; }
.clegend i { width: 12px; height: 12px; border: 2.5px solid; border-radius: 3px; background: #fff; }
.fchart { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 118px; column-gap: 30px; row-gap: 24px; align-items: start; padding: 6px 0 6px 64px; margin: 10px 0; }
.fchart svg.fl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.fbox { background: #fff; border: 1.5px solid #8c877d; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; line-height: 1.3; cursor: pointer; position: relative; z-index: 1; }
.fbox:hover { border-color: var(--ink); }
.fbox.k-decision { background: #fff8e6; border-color: #c98a1b; border-radius: 18px; text-align: center; }
.fbox.k-end { background: #eef6ef; border-color: #2e6b3a; border-width: 2.5px; }
.fbox.side { font-size: 11.5px; }
.fbox.on { box-shadow: 0 0 0 3px #0b4f8a; }
.fbox .n { font-size: 10.5px; color: var(--muted); margin-right: 4px; }
.flegend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); }
.flegend span { display: inline-flex; gap: 5px; align-items: center; }
.flegend i { width: 18px; height: 11px; border: 1.5px solid; display: inline-block; }
a.law.reg, a.law.lnk { text-decoration: none; color: #0b4f8a; }
a.law.lnk { white-space: normal; }
a.law.reg:hover, a.law.lnk:hover { text-decoration: underline; }
a.site { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.site:hover { text-decoration: underline; }
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#graph { width: 100%; height: 100%; min-height: 420px; display: block; touch-action: none; cursor: grab; user-select: none; }
#graph.panning { cursor: grabbing; }
.ctl { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
.ctl button { width: 34px; height: 34px; padding: 0; font-size: 17px; line-height: 1; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ctl button.on, .seg button.on { background: #0b4f8a; color: #fff; border-color: #0b4f8a; }
.ctl .sepr { height: 6px; }
.hint { transition: opacity .6s; position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); background: rgba(255,253,248,.85); padding: 2px 8px; border-radius: 10px; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; font-size: 12px; padding: 4px 9px; }
.seg button + button { border-left: 1px solid var(--line); }
.fwrap { position: relative; }
.fpop { position: absolute; left: 0; top: calc(100% + 6px); z-index: 12; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.14); padding: 10px 12px; width: min(560px, 86vw); display: none; }
.fpop.on { display: block; }
.fpop h4 { margin: 8px 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.fpop h4:first-child { margin-top: 0; }
.fpop .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fpop .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navrow { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.navrow button { font-size: 12px; padding: 3px 9px; }
.navrow .sp { flex: 1; }
.navrow input { font-size: 11.5px; flex: 1; min-width: 0; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.proxy { cursor: pointer; }
.proxy rect { fill: #fff; stroke-dasharray: 5 3; stroke-width: 1.6; }
.proxy.sel rect { stroke-width: 3.2; stroke: var(--ink); }
.proxy .t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.proxy .s { font-size: 10px; fill: var(--muted); }
.gtog { font-size: 12px; fill: var(--muted); cursor: pointer; font-weight: 700; }
.gtog:hover { fill: var(--ink); }
.node.gone, .proxy.gone { opacity: .05; pointer-events: none; }
#gZones.faded { opacity: .25; transition: opacity .3s; }
.node.pulse rect.box { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-width: 4.5; } }
@media (prefers-reduced-motion: reduce) { .node.pulse rect.box { animation: none; } }
.fbox.done { background: #f2f0ea; }
.scnbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.scnbar .sp { flex: 1; }
aside.full { position: fixed; inset: 0; z-index: 30; border: 0; }
aside.full .tabs, aside.full .navrow { display: none; }
aside.full #p-scn { padding: 16px 28px 40px; }
aside.full .scnbody { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 28px; align-items: start; }
aside.full .scndet { position: sticky; top: 0; }
aside.full .fchart { grid-template-columns: minmax(0, 1fr) 220px; column-gap: 90px; row-gap: 30px; }
aside.full .fbox { font-size: 14px; padding: 9px 12px; }
.wq { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.wq select { max-width: 100%; }
.wres h4 { margin: 12px 0 4px; font-size: 13px; }
.ans { font-size: 13px; background: #eef4fb; border: 1px solid #c9dbee; border-radius: 6px; padding: 6px 9px; margin: 8px 0; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: none; z-index: 5; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; background: none; padding: 8px 4px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { position: relative; padding: 14px 16px 28px; overflow: auto; flex: 1; display: none; }
.pane.on { display: block; }
h2 { font-size: 17px; margin: 0 0 4px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
button, input, select { font: inherit; color: var(--ink); }
button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
input[type=search], select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
input[type=search] { width: 100%; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; vertical-align: 1px; }
dl { margin: 8px 0 0; display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; }
dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
dd { margin: 0; }
ul.pw { margin: 0; padding: 0; list-style: none; }
ul.pw li { padding: 6px 0; border-top: 1px solid var(--line); }
.refs { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 2px; }
a.art { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #ece6f6; color: #3d2a6e; text-decoration: none; white-space: nowrap; cursor: pointer; }
a.art:hover { background: #ddd2f0; }
a.ext { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.ext:hover { text-decoration: underline; }
.law { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #eee9df; color: #5a554c; white-space: nowrap; }
.conn { padding: 5px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
.conn svg { flex: none; margin-top: 6px; }
.who { font-weight: 600; cursor: pointer; } .who:hover { text-decoration: underline; }
.who.mbtn { display: inline-flex; align-items: center; gap: 1px; font-weight: 600; padding: 0 5px; border: 1px solid var(--line); border-radius: 5px; background: #fff; line-height: 1.35; white-space: nowrap; }
.who.mbtn:hover { border-color: var(--accent); text-decoration: none; background: #f2f6fb; }
.who.mbtn .ico { vertical-align: 0; margin-right: 2px; }
.legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; cursor: pointer; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; flex: none; }
.node { cursor: pointer; }
.node rect.box { stroke-width: 1.6; }
.ico { vertical-align: -2px; margin-right: 3px; flex: none; }
.node .t { font-size: 12.5px; font-weight: 700; fill: var(--ink); pointer-events: none; }
.node .mt.two { font-size: 9.6px; }
.node .mt { font-size: 11px; font-weight: 600; fill: var(--ink); pointer-events: none; }
.node .cnt { fill: #f3e6d6; }
.node .cntt { font-size: 11px; font-weight: 700; fill: #8a4a06; pointer-events: none; }
.zone { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.glabel { font-size: 10.5px; fill: var(--muted); font-weight: 600; cursor: pointer; }
.glabel:hover { fill: var(--ink); text-decoration: underline; }
.group.dim { opacity: .35; }
.unit.hi { background: var(--hi); }
.unit { padding: 3px 0; border-top: 1px dotted var(--line); font-size: 12.5px; display: flex; gap: 8px; justify-content: space-between; }
.node .s { font-size: 10px; fill: var(--muted); pointer-events: none; }
.node.sel rect.box { stroke-width: 3.2; }
.edge { fill: none; opacity: .55; }
.edge.on { opacity: 1; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12px; cursor: pointer; }
.dim { opacity: .1; }
.flow { animation: flow 1.1s linear infinite; stroke-dasharray: 9 5 !important; }
@keyframes flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
.scnpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.scn button.pick { font-size: 12.5px; }
.scn button.pick.on { border-color: var(--accent); background: #eef4fb; }
.step { background: var(--hi); border: 1px solid #e6c873; border-radius: 6px; padding: 10px; margin: 8px 0; }
.stepnav { display: flex; gap: 6px; align-items: center; }
.stepnav .muted { flex: 1; text-align: center; }
.term { display: grid; grid-template-columns: 150px 1fr; gap: 2px 8px; align-items: center; margin: 3px 0; font-size: 12.5px; }
.term .nm { cursor: pointer; text-align: right; } .term .nm:hover { text-decoration: underline; }
.term .tr { position: relative; height: 18px; background: #f0ece3; border-radius: 3px; }
.term .tb { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.term .tl { position: absolute; left: 6px; top: 0; font-size: 11px; line-height: 18px; color: #fff; white-space: nowrap; font-weight: 600; }
.pubrow { padding: 7px 0; border-top: 1px solid var(--line); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.maj { padding: 6px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
.maj b { font-size: 18px; }
.article { border-top: 1px solid var(--line); padding: 8px 0; }
.article.hi { background: var(--hi); margin: 0 -16px; padding: 8px 16px; }
.article .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.article .hd b { cursor: pointer; } .article .hd b:hover { text-decoration: underline; }
.article .tx { white-space: pre-wrap; font-size: 12.5px; margin: 4px 0; }
mark.cit { background: #ffe58a; color: inherit; border-radius: 3px; padding: 1px 2px; box-shadow: inset 3px 0 0 #c98a1b; }
.article .cited { font-size: 12px; color: var(--muted); }
.chap { font-weight: 700; margin: 14px 0 4px; font-size: 13px; color: #3d2a6e; }
.note { font-size: 12px; color: #7a4a00; }
.src { font-size: 12px; background: #f5f1e8; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
@media (max-width: 900px) {
  body { height: auto; display: block; }
  main { grid-template-columns: minmax(0, 1fr); height: auto; }
  .clegend { justify-content: flex-start; }
  .hint { display: none; }
  #stage { height: 70vh; flex: none; }
  aside.full .scnbody { grid-template-columns: 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .pane { max-height: none; }
}
</style>
</head>

<header>
  <h1>Държавно устройство на България</h1>
  <p>Кой кого избира, кой може да спре, свали или провери другия. Всяко правомощие е с линк към члена от Конституцията.</p>
  <div class="srch"><input type="search" id="q" placeholder="Търси: институция, агенция, област, правомощие, член…" autocomplete="off" aria-label="Търсене"><div id="results" role="listbox"></div></div>
</header>
<main>
  <div id="left">
    <div class="bar" id="filters"></div>
    <div id="stage"><svg id="graph" viewBox="0 0 1300 1310" role="img" aria-label="Схема на институциите и връзките между тях"></svg>
      <div class="ctl">
        <button id="zin" title="Приближи (+)" aria-label="Приближи">+</button>
        <button id="zout" title="Отдалечи (−)" aria-label="Отдалечи">−</button>
        <button id="zfit" title="Побери цялата схема (0)" aria-label="Побери">⤢</button>
        <span class="sepr"></span>
        <button id="star" title="Фокус: подреди връзките на избрания орган около него (F)" aria-pressed="false" aria-label="Фокус">✶</button>
      </div>
      <div class="hint" id="hint">Колелце: мащаб · влачене: местене · F: фокус</div>
    </div>
  </div>
  <aside>
    <div class="navrow">
      <button id="hback" title="Назад (Alt+←)">← Назад</button>
      <button id="hfwd" title="Напред (Alt+→)">Напред →</button>
      <span class="sp"></span>
      <button id="share" title="Копирай линк към текущия изглед">🔗 Линк</button>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="info" aria-selected="true">Институция</button>
      <button data-tab="scn">Сценарии</button>
      <button data-tab="ref">Справки</button>
      <button data-tab="const">Конституция</button>
    </div>
    <div class="pane on" id="p-info"></div>
    <div class="pane scn" id="p-scn"></div>
    <div class="pane" id="p-ref"></div>
    <div class="pane" id="p-const"></div>
  </aside>
</main>

","law":"Административнопроцесуален кодекс"},{"id":"cik_kmet","from":"cik","to":"kmet","type":"call","label":"Насрочва частични избори за кмет; ОИК прекратява мандата","law":"Изборен кодекс"},{"id":"ns_kdos","from":"ns","to":"kdos","type":"elect","label":"Избира 9-те членове на Комисията по досиетата","law":"Закон за достъп и разкриване на документите и за обявяване на принадлежност на български граждани към Държавна сигурност и разузнавателните служби на Българската народна армия"},{"id":"ns_bkrs","from":"ns","to":"bkrs","type":"elect","label":"Избира 5-те членове на Бюрото","law":"Закон за специалните разузнавателни средства"},{"id":"bkrs_dans","from":"bkrs","to":"dans","type":"control","label":"Контролира прилагането на СРС от службите","law":"Закон за специалните разузнавателни средства"},{"id":"bkrs_ns","from":"bkrs","to":"ns","type":"control","label":"Отчита се пред НС с годишен доклад","law":"Закон за специалните разузнавателни средства"},{"id":"ns_kzd","from":"ns","to":"kzd","type":"elect","label":"Избира 5 от 9-те членове","law":"Закон за защита от дискриминация"},{"id":"prez_kzd","from":"prez","to":"kzd","type":"elect","label":"Назначава 4 от 9-те членове","law":"Закон за защита от дискриминация"},{"id":"ns_krs","from":"ns","to":"krs","type":"elect","label":"Избира председателя и двама членове","law":"Закон за електронните съобщения"},{"id":"prez_krs","from":"prez","to":"krs","type":"elect","label":"Назначава заместник-председателя и един член","law":"Закон за електронните съобщения"},{"id":"sem_bnt","from":"sem","to":"bnt","type":"elect","label":"Избира генералния директор на БНТ","law":"Закон за радиото и телевизията"},{"id":"sem_bnr","from":"sem","to":"bnr","type":"elect","label":"Избира генералния директор на БНР","law":"Закон за радиото и телевизията"},{"id":"ns_bta","from":"ns","to":"bta","type":"elect","label":"Избира генералния директор на БТА","law":"Закон за Българската телеграфна агенция"},{"id":"ns_noi","from":"ns","to":"noi","type":"elect","label":"Избира управителя и подуправителя; приема бюджета на ДОО със закон","law":"Кодекс за социалното осигуряване"},{"id":"ns_nzok","from":"ns","to":"nzok","type":"elect","label":"Избира управителя и надзорния съвет; приема бюджета на НЗОК със закон","law":"Закон за здравното осигуряване"},{"id":"min_mz_nzok","from":"min_mz","to":"nzok","type":"control","label":"Министърът на здравеопазването определя пакета от дейности и цените заедно с НЗОК","law":"Закон за здравното осигуряване"},{"id":"ms_dksi","from":"ms","to":"dksi","type":"elect","label":"Избира председателя и членовете по предложение на министър-председателя","law":"Закон за защита на класифицираната информация"},{"id":"ms_nsts","from":"ms","to":"nsts","type":"control","label":"Заместник министър-председател председателства НСТС; правителството внася проекти за консултация","law":"Кодекс на труда"},{"id":"iss_ns","from":"iss","to":"ns","type":"propose","label":"Дава становища по законопроекти и стратегии","law":"Закон за Икономическия и социален съвет"},{"id":"vss_nsls","from":"vss","to":"nsls","type":"elect","label":"Прокурорската колегия назначава директора по предложение на главния прокурор","ref":"чл. 129, ал. 1","law":"Закон за съдебната власт"},{"id":"pg_nsls","from":"pg","to":"nsls","type":"control","label":"Директорът на НСлС е заместник на главния прокурор","law":"Закон за съдебната власт"}],"scenarios":[{"id":"law","title":"Как се приема закон","steps":[{"title":"Внасяне на законопроект","text":"Законопроект внасят всеки народен представител или Министерският съвет. Бюджетът се внася само от МС.","ref":"чл. 87","nodes":["ns","ms"],"edges":["ms_ns_bill"],"kind":"step"},{"title":"Две гласувания в НС","text":"НС гласува закона два пъти на отделни заседания. Нужен е кворум над половината (121), а решението е с мнозинство от присъстващите.","ref":"чл. 88, ал. 1; чл. 81","nodes":["ns"],"edges":[],"kind":"step"},{"title":"Президентът връща ли закона?","text":"В 15-дневен срок президентът може мотивирано да върне закона за ново обсъждане. Ветото е само отлагателно.","ref":"чл. 101, ал. 1; чл. 88, ал. 3","nodes":["prez","ns"],"edges":["prez_ns_veto"],"kind":"decision","next":[{"to":3,"label":"да"},{"to":5,"label":"не"}]},{"title":"Повторно гласуване: има ли 121 гласа?","text":"НС може да приеме закона повторно с над половината от всички народни представители (121).","ref":"чл. 101, ал. 2","nodes":["ns"],"edges":["prez_ns_veto"],"kind":"decision","next":[{"to":5,"label":"да"},{"to":4,"label":"не"}]},{"title":"Законът не е приет","text":"Без 121 гласа законът не влиза в сила.","ref":"чл. 101, ал. 2","nodes":["ns"],"edges":[],"kind":"end","next":[],"side":true},{"title":"Обнародване в „Държавен вестник“","text":"Президентът обнародва закона; повторно приет закон трябва да обнародва до 7 дни. Указът не се приподписва.","ref":"чл. 98, т. 4; чл. 101, ал. 3; чл. 102, ал. 3","nodes":["prez"],"edges":[],"kind":"step"},{"title":"Сезира ли някой КС?","text":"1/5 от народните представители, президентът, МС, ВКС, ВАС, главният прокурор, омбудсманът и всеки съд по конкретно дело могат да сезират КС.","ref":"чл. 150","nodes":["ks","ns","prez","ms","vks","vas","pg","ombuds","courts"],"edges":["ns_ks_ref","prez_ks_ref","ms_ks_ref","vks_ks_ref","vas_ks_ref","pg_ks_ref","ombuds_ks_ref","courts_ks_ref"],"kind":"decision","next":[{"to":7,"label":"да"},{"to":9,"label":"не"}]},{"title":"КС: противоконституционен ли е? (7 от 12)","text":"КС решава с над половината от всички съдии.","ref":"чл. 151, ал. 1","nodes":["ks","ns"],"edges":["ks_ns"],"kind":"decision","next":[{"to":8,"label":"да"},{"to":9,"label":"не"}]},{"title":"Законът не се прилага","text":"Обявеният за противоконституционен закон не се прилага от влизането в сила на решението, 3 дни след обнародването му.","ref":"чл. 151, ал. 2","nodes":["ks"],"edges":[],"kind":"end","next":[],"side":true},{"title":"Законът е в сила","text":"Законът се прилага.","ref":"чл. 86","nodes":["ns"],"edges":[],"kind":"end","next":[]}]},{"id":"gov","title":"Съставяне на правителство","steps":[{"title":"Избори за НС","text":"Избирателите избират ново НС. Старото правителство подава оставка пред него и остава до избора на ново.","ref":"чл. 64; чл. 111, ал. 2; чл. 111, ал. 3","nodes":["narod","ns","ms","cik"],"edges":["v_ns","cik_ns"],"kind":"step"},{"title":"1-ви мандат: най-голямата група","text":"Президентът след консултации възлага мандат на кандидата на най-голямата група. Срокът е 7 дни.","ref":"чл. 99, ал. 1","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"decision","next":[{"to":4,"label":"успех"},{"to":2,"label":"провал"}]},{"title":"2-ри мандат: втората група","text":"Мандатът отива при кандидата на втората по численост група.","ref":"чл. 99, ал. 2","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"decision","next":[{"to":4,"label":"успех"},{"to":3,"label":"провал"}]},{"title":"3-ти мандат: група по избор на президента","text":"Президентът възлага на някоя следваща група да посочи кандидат.","ref":"чл. 99, ал. 3","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"decision","next":[{"to":4,"label":"успех"},{"to":5,"label":"провал"}]},{"title":"НС избира премиер и министри","text":"НС избира министър-председателя и по негово предложение министрите.","ref":"чл. 99, ал. 4; чл. 84, т. 6","nodes":["ns","ms"],"edges":["ns_ms"],"kind":"end","next":[],"side":true},{"title":"Служебно правителство","text":"Президентът назначава служебен кабинет. Служебният премиер е само от списък: председателят на НС, управителят или подуправител на БНБ, председателят или заместник на Сметната палата, омбудсманът или заместникът му.","ref":"чл. 99, ал. 5","nodes":["prez","ms","chair","bnb","smetna","ombuds"],"edges":["prez_ms_caretaker","chair_ms","bnb_ms","smetna_ms_pool","ombuds_ms"],"kind":"step"},{"title":"Разпускане на НС и нови избори","text":"Президентът разпуска НС и насрочва избори до 2 месеца. В последните 3 месеца от мандата си не може да разпусне НС.","ref":"чл. 99, ал. 5; чл. 99, ал. 7","nodes":["prez","ns","narod"],"edges":["prez_ns_diss","prez_ns_call"],"kind":"step","next":[{"to":0,"label":"отначало"}]}]},{"id":"noconf","title":"Вот на недоверие","steps":[{"title":"Предложение за недоверие (48 НП)","text":"Една пета от народните представители внасят предложение за вот на недоверие.","ref":"чл. 89, ал. 1","nodes":["ns","ms"],"edges":["ns_ms_nc"],"kind":"step"},{"title":"Гласуват ли „за“ поне 121?","text":"Вотът е приет, ако „за“ гласуват над половината от всички народни представители.","ref":"чл. 89, ал. 1","nodes":["ns","ms"],"edges":["ns_ms_nc"],"kind":"decision","next":[{"to":3,"label":"да"},{"to":2,"label":"не"}]},{"title":"Правителството остава","text":"Ново предложение на същото основание не може да се внесе 6 месеца.","ref":"чл. 89, ал. 3","nodes":["ms"],"edges":[],"kind":"end","next":[],"side":true},{"title":"Оставка на правителството","text":"Министър-председателят подава оставката на правителството, което работи до избора на ново.","ref":"чл. 89, ал. 2; чл. 111, ал. 3","nodes":["ms"],"edges":[],"kind":"step"},{"title":"Отново трите мандата","text":"Тече процедурата за съставяне на правителство (виж сценария „Съставяне на правителство“).","ref":"чл. 99, ал. 6; чл. 111, ал. 1","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"end","next":[]}]},{"id":"conf","title":"Вот на доверие","steps":[{"title":"МС иска доверие","text":"Министерският съвет иска от Народното събрание да му гласува доверие: по цялостната политика, по програмата или по конкретен повод. Инициативата е на правителството, не на опозицията.","ref":"чл. 112, ал. 1","nodes":["ms","ns"],"edges":["ms_ns_conf"],"kind":"step"},{"title":"Мнозинство от присъстващите „за“?","text":"Доверието е гласувано, ако „за“ са повече от половината от присъстващите народни представители (при кворум над половината, т.е. поне 121 в залата). Прагът е по-нисък от този за недоверие (121 от всички).","ref":"чл. 112, ал. 1; чл. 81, ал. 2","nodes":["ns"],"edges":[],"kind":"decision","next":[{"to":2,"label":"да"},{"to":3,"label":"не"}]},{"title":"Правителството е подкрепено","text":"Правителството продължава с потвърдено мнозинство. Вотът на доверие често се ползва, за да се дисциплинира управляващото мнозинство.","ref":"чл. 112, ал. 1","nodes":["ms","ns"],"edges":[],"kind":"end"},{"title":"Оставка на правителството","text":"Министър-председателят подава оставката на правителството, което изпълнява функциите си до избора на ново.","ref":"чл. 112, ал. 2; чл. 111, ал. 1; чл. 111, ал. 3","nodes":["ms","ns"],"edges":[],"kind":"step","side":true,"next":[{"to":4}]},{"title":"Отново трите мандата","text":"Тече процедурата за съставяне на правителство (виж сценария „Съставяне на правителство“).","ref":"чл. 99, ал. 1","nodes":["prez","ms","ns"],"edges":["prez_ms_mandate"],"kind":"end"}]},{"id":"imp","title":"Импийчмънт на президента","steps":[{"title":"Държавна измяна или нарушение на Конституцията","text":"Президентът отговаря само за тези две деяния.","ref":"чл. 103, ал. 1","nodes":["prez"],"edges":[],"kind":"step"},{"title":"Предложение от поне 60 НП (1/4)","text":"Обвинението се внася от поне една четвърт от народните представители.","ref":"чл. 103, ал. 2","nodes":["ns","prez"],"edges":["ns_prez_imp"],"kind":"step"},{"title":"Подкрепят ли го над 2/3 (161+)?","text":"НС поддържа обвинението, ако повече от две трети гласуват „за“.","ref":"чл. 103, ал. 2","nodes":["ns","prez"],"edges":["ns_prez_imp"],"kind":"decision","next":[{"to":3,"label":"да"},{"to":7,"label":"не"}]},{"title":"КС разглежда делото до 1 месец","text":"Конституционният съд разглежда обвинението в едномесечен срок.","ref":"чл. 103, ал. 3; чл. 149, ал. 1","nodes":["ks","prez"],"edges":["ks_prez_imp"],"kind":"decision","next":[{"to":4,"label":"виновен"},{"to":7,"label":"не"}]},{"title":"Пълномощията се прекратяват","text":"Президентът губи поста.","ref":"чл. 103, ал. 3; чл. 97, ал. 1","nodes":["ks","prez"],"edges":["ks_prez_imp"],"kind":"decision","next":[{"to":5,"label":"има ВП"},{"to":6,"label":"няма ВП"}]},{"title":"Вицепрезидентът става президент","text":"Вицепрезидентът встъпва до края на мандата.","ref":"чл. 97, ал. 3","nodes":["vp","prez"],"edges":["vp_prez"],"kind":"end","next":[]},{"title":"Ако и ВП не може: председателят на НС","text":"Функциите поема председателят на НС, а в 2 месеца се произвеждат избори.","ref":"чл. 97, ал. 4","nodes":["chair","prez"],"edges":["chair_prez"],"kind":"end","next":[],"side":true},{"title":"Президентът остава","text":"Обвинението отпада.","ref":"чл. 103","nodes":["prez"],"edges":[],"kind":"end","next":[],"side":true}]},{"id":"pg","title":"Избор на главен прокурор","steps":[{"title":"ВСС: 25 членове","text":"3 по право, 11 избрани от НС с 2/3 и 11 от магистратите.","ref":"чл. 130, ал. 1; чл. 130, ал. 3","nodes":["vss","ns","courts","pg"],"edges":["ns_vss","courts_vss","pg_vss"],"kind":"step"},{"title":"Пленумът на ВСС предлага кандидат","text":"Пленумът прави предложение до президента.","ref":"чл. 130а, ал. 2, т. 7","nodes":["vss","prez"],"edges":["vss_prez"],"kind":"step"},{"title":"Президентът приема ли?","text":"Президентът може да откаже веднъж.","ref":"чл. 129, ал. 2","nodes":["prez","vss"],"edges":["vss_prez"],"kind":"decision","next":[{"to":4,"label":"да"},{"to":3,"label":"отказ"}]},{"title":"Повторно предложение","text":"При повторно предложение президентът не може да откаже.","ref":"чл. 129, ал. 2","nodes":["vss","prez"],"edges":["vss_prez"],"kind":"step","next":[{"to":4,"label":"задължително"}],"side":true},{"title":"Указ: главен прокурор за 7 години","text":"Без право на повторно избиране.","ref":"чл. 129, ал. 2","nodes":["prez","pg"],"edges":["prez_pg"],"kind":"step"},{"title":"Освобождаване","text":"По същия ред и само на основанията от чл. 129, ал. 3 (напр. тежко нарушение).","ref":"чл. 129, ал. 2; чл. 129, ал. 3","nodes":["vss","prez","pg"],"edges":["vss_prez","prez_pg"],"kind":"end","next":[]}]},{"id":"const","title":"Промяна на Конституцията","steps":[{"title":"Засяга ли въпрос на ВНС?","text":"Нова Конституция, промяна на територията или на формата на управление, чл. 5, ал. 2 и 4, чл. 57, ал. 1 и 3 и глава девета се решават само от Велико НС.","ref":"чл. 158; чл. 153","nodes":["ns","vns"],"edges":[],"kind":"decision","next":[{"to":5,"label":"да"},{"to":1,"label":"не"}]},{"title":"Инициатива: 60 НП или президентът","text":"Инициатива имат 1/4 от народните представители и президентът. НС разглежда предложението след 1 до 3 месеца.","ref":"чл. 154","nodes":["ns","prez"],"edges":[],"kind":"step"},{"title":"Има ли 3/4 (180) на три гласувания?","text":"Обикновеното НС приема изменението с 3/4 на три гласувания в различни дни.","ref":"чл. 155, ал. 1","nodes":["ns"],"edges":[],"kind":"decision","next":[{"to":4,"label":"да"},{"to":3,"label":"2/3–3/4"}]},{"title":"След 2–5 месеца стига 2/3 (160)","text":"Ново обсъждане и гласуване с мнозинство 2/3 от всички.","ref":"чл. 155, ал. 2","nodes":["ns"],"edges":[],"kind":"step","next":[{"to":4,"label":"приет"}],"side":true},{"title":"Председателят на НС обнародва до 7 дни","text":"Законът за изменение се подписва и обнародва от председателя на НС.","ref":"чл. 156","nodes":["chair"],"edges":[],"kind":"end","next":[]},{"title":"Инициатива: 120 НП или президентът","text":"Поне половината народни представители или президентът.","ref":"чл. 159, ал. 1","nodes":["ns","prez"],"edges":[],"kind":"step"},{"title":"НС решава с 2/3 (160) избори за ВНС","text":"Президентът ги насрочва до 3 месеца; с изборите правомощията на НС се прекратяват.","ref":"чл. 160","nodes":["ns","prez","narod"],"edges":["ns_vns","prez_vns"],"kind":"step"},{"title":"ВНС (400 НП) решава с 2/3 на три гласувания","text":"Председателят на ВНС обнародва актовете до 7 дни.","ref":"чл. 157; чл. 161; чл. 163","nodes":["vns","narod"],"edges":["v_vns"],"kind":"end","next":[]}]},{"id":"budget","title":"Бюджетен цикъл","steps":[{"title":"Проект на бюджет","text":"Министерството на финансите подготвя проекта, Министерският съвет го одобрява и внася в НС. Само МС може да внесе бюджета.","ref":"чл. 87, ал. 2","law":"Закон за публичните финанси","nodes":["min_fin","ms","ns"],"edges":["ms_ns_bill"],"kind":"step"},{"title":"Комисии и две гласувания","text":"Бюджетната комисия и останалите комисии го обсъждат; НС го приема на две четения със закон.","ref":"чл. 84, т. 2; чл. 84, т. 3; чл. 88, ал. 1","nodes":["cmte","ns"],"edges":["ns_cmte"],"kind":"step"},{"title":"Вето на президента?","text":"Президентът може да върне закона за бюджета. НС го приема повторно с 121 гласа.","ref":"чл. 101","nodes":["prez","ns"],"edges":["prez_ns_veto"],"kind":"decision","next":[{"to":3,"label":"приет"},{"to":4,"label":"не"}]},{"title":"Изпълнение","text":"МС ръководи изпълнението; министрите отговарят за своите бюджети.","ref":"чл. 106","law":"Закон за публичните финанси","nodes":["ms","min_fin"],"edges":[],"kind":"step","next":[{"to":5}]},{"title":"Удължителен закон","text":"Ако бюджетът не е приет до началото на годината (напр. заради вето или разпуснато НС), НС приема удължителен закон и разходите продължават по старите параметри.","law":"Закон за публичните финанси","nodes":["ns","ms"],"edges":[],"kind":"step","next":[{"to":0,"label":"отначало"}],"side":true},{"title":"Одит и отчет","text":"Сметната палата одитира изпълнението; НС приема отчета за изпълнението на бюджета.","ref":"чл. 91, ал. 1; чл. 84, т. 2","law":"Закон за Сметната палата","nodes":["smetna","ns"],"edges":["smetna_ns","smetna_ms","ns_ms_ctrl"],"kind":"end"}]},{"id":"ref","title":"Национален референдум","steps":[{"title":"Предложение","text":"Предложение могат да направят 1/5 от депутатите (48), президентът, МС, 1/4 от общинските съвети или инициативен комитет с поне 200 000 подписа.","law":"Закон за прякото участие на гражданите в държавната власт и местното самоуправление","nodes":["ns","prez","ms","obs","narod"],"edges":[],"kind":"step"},{"title":"400 000 подписа?","text":"С поне 400 000 подписа НС е длъжно да насрочи референдума. С по-малко НС решава по своя преценка.","law":"Закон за прякото участие на гражданите в държавната власт и местното самоуправление","nodes":["narod","ns"],"edges":[],"kind":"decision","next":[{"to":2,"label":"да / по преценка"},{"to":5,"label":"не"}]},{"title":"Решение на НС","text":"НС приема решение за референдум и формулира въпроса. Не се допускат въпроси за бюджета, данъците и изключителната компетентност на ВНС.","ref":"чл. 84, т. 5","law":"Закон за прякото участие на гражданите в държавната власт и местното самоуправление","nodes":["ns"],"edges":["ns_narod"],"kind":"step"},{"title":"Насрочване и провеждане","text":"Президентът определя датата; ЦИК организира гласуването.","ref":"чл. 98, т. 1","law":"Изборен кодекс","nodes":["prez","cik","narod"],"edges":["prez_narod","cik_narod"],"kind":"step"},{"title":"Резултат и валидност","text":"Решението е прието, ако са гласували не по-малко от участвалите в последните избори за НС и „да“ са над половината. При по-ниска активност, но над 20%, НС е длъжно да обсъди въпроса.","law":"Закон за прякото участие на гражданите в държавната власт и местното самоуправление","nodes":["narod","ns"],"edges":[],"kind":"end"},{"title":"Отказ","text":"НС може да откаже, ако подписите са под 400 000. Решението подлежи на контрол пред КС.","ref":"чл. 149, ал. 1","law":"Закон за прякото участие на гражданите в държавната власт и местното самоуправление","nodes":["ns","ks"],"edges":["ns_ks_ref"],"kind":"end","side":true}]},{"id":"imm","title":"Сваляне на имунитет на депутат","steps":[{"title":"Искане от прокуратурата","text":"Главният прокурор (или негов заместник) иска разрешение за наказателно преследване или задържане на депутат за тежко престъпление.","ref":"чл. 70","nodes":["pg","ns"],"edges":["pg_ns"],"kind":"step"},{"title":"Писмено съгласие?","text":"Ако депутатът даде писмено съгласие, разрешение от НС не е нужно. Също не е нужно при заварено тежко престъпление.","ref":"чл. 70","nodes":["ns"],"edges":[],"kind":"decision","next":[{"to":3,"label":"да"},{"to":2,"label":"не"}]},{"title":"Гласуване в НС","text":"НС решава с мнозинство от присъстващите. Когато НС не заседава, разрешава председателят.","ref":"чл. 70; чл. 81, ал. 2","law":"Правилник за организацията и дейността на НС","nodes":["ns","chair"],"edges":[],"kind":"step"},{"title":"Преследване","text":"Прокуратурата повдига обвинение; делото се гледа от съда. Депутатът запазва мандата до влязла в сила присъда.","ref":"чл. 70","nodes":["pg","courts"],"edges":["pg_courts"],"kind":"end"}]},{"id":"war","title":"Война или извънредно положение","steps":[{"title":"Заплаха","text":"Въоръжено нападение, международни задължения или извънредна ситуация. КСНС обсъжда положението.","ref":"чл. 100, ал. 3","law":"Закон за отбраната и въоръжените сили на Република България","nodes":["prez","ksns","ms"],"edges":["prez_ksns"],"kind":"step"},{"title":"НС заседава ли?","text":"Решението е на НС. Ако НС не заседава, решава президентът и НС се свиква незабавно.","ref":"чл. 84, т. 10; чл. 84, т. 12; чл. 100, ал. 5","nodes":["ns","prez"],"edges":[],"kind":"decision","next":[{"to":2,"label":"да"},{"to":3,"label":"не"}]},{"title":"НС обявява","text":"НС обявява война, военно или друго извънредно положение и може да разреши използване на войски.","ref":"чл. 84, т. 10; чл. 84, т. 11; чл. 84, т. 12","nodes":["ns"],"edges":[],"kind":"step","next":[{"to":4}]},{"title":"Президентът обявява","text":"Президентът обявява положението и свиква НС да се произнесе по решението.","ref":"чл. 100, ал. 5","nodes":["prez","ns"],"edges":["prez_ns_call"],"kind":"step","next":[{"to":2,"label":"НС потвърждава"}],"side":true},{"title":"Мобилизация и командване","text":"Президентът е главнокомандващ и обявява мобилизация по предложение на МС. МО ръководи въоръжените сили.","ref":"чл. 100, ал. 1; чл. 100, ал. 4","law":"Закон за отбраната и въоръжените сили на Република България","nodes":["prez","ms","min_def"],"edges":[],"kind":"step"},{"title":"Мандатът се удължава","text":"Ако положението настъпи по време на мандата, пълномощията на НС се продължават до отпадането му.","ref":"чл. 64, ал. 2","nodes":["ns"],"edges":[],"kind":"end"}]},{"id":"treaty","title":"Ратифициране на международен договор","steps":[{"title":"Преговори и подписване","text":"МС води преговорите и одобрява договора; президентът сключва договори в предвидените в закон случаи.","ref":"чл. 106; чл. 98, т. 3","law":"Закон за международните договори на Република България","nodes":["ms","min_mfa","prez"],"edges":[],"kind":"step"},{"title":"Нужна ли е ратификация?","text":"Ратифицират се договорите по чл. 85, ал. 1: политически, военни, финансови, за правата на човека, за ЕС и др. Останалите МС одобрява сам.","ref":"чл. 85, ал. 1","nodes":["ns","ms"],"edges":[],"kind":"decision","next":[{"to":2,"label":"да"},{"to":6,"label":"не"}]},{"title":"Проверка от КС?","text":"При съмнение КС се произнася дали договорът съответства на Конституцията преди ратификацията.","ref":"чл. 149, ал. 1","nodes":["ks","ns","prez"],"edges":["ns_ks_ref","prez_ks_ref"],"kind":"decision","next":[{"to":4,"label":"съответства"},{"to":3,"label":"не"}]},{"title":"Първо промяна в Конституцията","text":"Договор, който изисква промени в Конституцията, се ратифицира само след приемането им.","ref":"чл. 85, ал. 4","nodes":["ns","vns"],"edges":[],"kind":"step","next":[{"to":4}],"side":true},{"title":"Закон за ратификация","text":"НС ратифицира със закон. Договор, който прехвърля правомощия на ЕС, изисква 2/3 (160 гласа).","ref":"чл. 85, ал. 1; чл. 85, ал. 2","nodes":["ns"],"edges":[],"kind":"step"},{"title":"Част от вътрешното право","text":"След обнародване и влизане в сила договорът е част от вътрешното право и има предимство пред противоречащите закони.","ref":"чл. 5, ал. 4","nodes":["courts"],"edges":[],"kind":"end"},{"title":"Одобрение от МС","text":"Договорите извън чл. 85 МС утвърждава с решение.","ref":"чл. 106","law":"Закон за международните договори на Република България","nodes":["ms"],"edges":[],"kind":"end","side":true}]},{"id":"indep","title":"Избор на независим орган от НС","steps":[{"title":"Процедурни правила","text":"НС (обикновено водещата комисия) приема правила за избора: срокове, документи, изслушване.","ref":"чл. 84, т. 8","law":"Правилник за организацията и дейността на НС","nodes":["ns","cmte"],"edges":["ns_cmte"],"kind":"step"},{"title":"Номинации","text":"Парламентарните групи (за омбудсман и депутати) предлагат кандидати; кандидатите представят концепции и декларации.","law":"Закон за омбудсмана; Закон за Българската народна банка","nodes":["ns"],"edges":[],"kind":"step"},{"title":"Публично изслушване","text":"Комисията изслушва кандидатите публично; НПО и граждани могат да дават становища.","ref":"чл. 79, ал. 1","law":"Правилник за организацията и дейността на НС","nodes":["cmte"],"edges":[],"kind":"step"},{"title":"Гласуване","text":"НС гласува; по правило е нужно мнозинство от присъстващите. Пример: омбудсман (5 г.), управител на БНБ (6 г.), КЕВР, КФН.","ref":"чл. 84, т. 8; чл. 91а, ал. 1","nodes":["ns","ombuds","bnb","kevr","kfn"],"edges":["ns_ombuds","ns_bnb","ns_kevr","ns_kfn"],"kind":"decision","next":[{"to":4,"label":"избран"},{"to":1,"label":"не"}]},{"title":"Встъпване и отчетност","text":"Избраният полага клетва или встъпва и се отчита пред НС с годишен доклад.","law":"Закон за омбудсмана; Закон за Българската народна банка","nodes":["ns","ombuds","bnb"],"edges":["ombuds_ns","bnb_ns"],"kind":"end"}]},{"id":"local","title":"Местни избори и предсрочно прекратяване на кмет","steps":[{"title":"Насрочване","text":"Президентът насрочва общите местни избори на всеки 4 години.","ref":"чл. 98, т. 1; чл. 138","law":"Изборен кодекс","nodes":["prez","obs","kmet"],"edges":["prez_local"],"kind":"step"},{"title":"Организиране","text":"ЦИК ръководи; общинските избирателни комисии (ОИК) регистрират кандидатите и обявяват резултата.","law":"Изборен кодекс","nodes":["cik"],"edges":["cik_local","cik_rik"],"kind":"step"},{"title":"Над 50% на първи тур?","text":"Кмет се избира с повече от половината гласове. Иначе след 7 дни има балотаж между първите двама.","ref":"чл. 139, ал. 1","law":"Изборен кодекс","nodes":["narod","kmet"],"edges":["v_kmet"],"kind":"decision","next":[{"to":4,"label":"да"},{"to":3,"label":"не"}]},{"title":"Балотаж","text":"Печели кандидатът с повече гласове.","law":"Изборен кодекс","nodes":["narod","kmet"],"edges":["v_kmet"],"kind":"step","next":[{"to":4}],"side":true},{"title":"Мандат","text":"Кметът управлява 4 години; областният управител и административният съд следят законността на актовете на общината.","ref":"чл. 139, ал. 1; чл. 144; чл. 120","law":"Закон за местното самоуправление и местната администрация","nodes":["kmet","obs","oblast","courts"],"edges":["oblast_kmet","courts_kmet","obs_kmet"],"kind":"step"},{"title":"Основание за прекратяване?","text":"Оставка, влязла в сила присъда, несъвместимост, конфликт на интереси, трайна невъзможност, смърт и др.","law":"Закон за местното самоуправление и местната администрация","nodes":["kmet","kpk","courts"],"edges":[],"kind":"decision","next":[{"to":6,"label":"да"}]},{"title":"ОИК прекратява, ЦИК насрочва частични избори","text":"ОИК прекратява пълномощията с решение, обжалваемо пред съда. ЦИК насрочва частични избори за остатъка от мандата (освен в последната година).","law":"Изборен кодекс; Закон за местното самоуправление и местната администрация","nodes":["cik","courts","kmet"],"edges":["cik_kmet"],"kind":"end"}]},{"id":"pgrem","title":"Освобождаване на главния прокурор","steps":[{"title":"Предложение","text":"Предложение за предсрочно освобождаване могат да направят най-малко една четвърт от членовете на ВСС или министърът на правосъдието.","law":"Закон за съдебната власт","nodes":["vss","minjust","pg"],"edges":[],"kind":"step","next":[{"to":1},{"to":5,"label":"НПК"}]},{"title":"Има ли основание?","text":"Главният прокурор се освобождава само на основанията по чл. 129, ал. 3: напр. влязла в сила присъда, трайна невъзможност, тежко нарушение на служебните задължения или действия, които накърняват престижа на съдебната власт.","ref":"чл. 129, ал. 3","nodes":["vss","pg"],"edges":[],"kind":"decision","next":[{"to":2,"label":"да"}]},{"title":"Пленум на ВСС гласува","text":"Пленумът изслушва главния прокурор и решава с мнозинство от две трети от членовете си.","ref":"чл. 130а, ал. 2, т. 7","law":"Закон за съдебната власт","nodes":["vss","pg"],"edges":["pg_vss"],"kind":"decision","next":[{"to":3,"label":"прието"}]},{"title":"Указ на президента","text":"Президентът освобождава с указ. Може веднъж да върне предложението; при повторно не може да откаже.","ref":"чл. 129, ал. 2","nodes":["prez","vss","pg"],"edges":["vss_prez","prez_pg"],"kind":"step"},{"title":"Обжалване пред ВАС","text":"Решението на ВСС подлежи на обжалване пред Върховния административен съд.","ref":"чл. 125, ал. 2","law":"Закон за съдебната власт","nodes":["vas","vss"],"edges":[],"kind":"end"},{"title":"Разследване на главния прокурор","text":"НПК урежда особен ред за разследване на главния прокурор и заместниците му. Правилата бяха променяни няколко пъти след 2023 г., затова при конкретен случай проверете действащата редакция.","law":"Наказателно-процесуален кодекс; Закон за съдебната власт","nodes":["pg","courts"],"edges":[],"kind":"end","side":true}]},{"id":"pardon","title":"Помилване и амнистия","steps":[{"title":"Кого засяга?","text":"Помилването е за конкретен осъден човек; амнистията е за всички, извършили определен вид престъпление.","nodes":["prez","ns"],"edges":[],"kind":"decision","next":[{"to":1,"label":"един човек"},{"to":3,"label":"група"}]},{"title":"Молба за помилване","text":"Осъденият или негови близки подават молба до президента; Комисията по помилването дава становище.","ref":"чл. 98, т. 11","nodes":["prez"],"edges":[],"kind":"step"},{"title":"Указ за помилване","text":"Президентът опрощава изцяло или отчасти наложеното наказание или го заменя с по-леко. Присъдата не се отменя.","ref":"чл. 98, т. 11","law":"Наказателен кодекс","nodes":["prez"],"edges":[],"kind":"end"},{"title":"Закон за амнистия","text":"НС приема закон за амнистия: отпада наказателната отговорност или наказанието за всички в обхвата му.","ref":"чл. 84, т. 13","law":"Наказателен кодекс","nodes":["ns"],"edges":[],"kind":"step"},{"title":"Вето?","text":"Президентът може да върне закона; НС го приема повторно с над половината от всички.","ref":"чл. 101","nodes":["prez","ns"],"edges":["prez_ns_veto"],"kind":"end"}]},{"id":"reshuf","title":"Смяна на министър и промени в министерствата","steps":[{"title":"Предложение на премиера","text":"Само министър-председателят може да предложи смяна на министър или създаване и закриване на министерство.","ref":"чл. 84, т. 6; чл. 84, т. 7","nodes":["ms","ns"],"edges":["ms_ns_bill"],"kind":"step","next":[{"to":1},{"to":5,"label":"или"}]},{"title":"Какво се променя?","text":"Смяна на министри или промяна в структурата на правителството.","nodes":["ns"],"edges":[],"kind":"decision","next":[{"to":2,"label":"министър"},{"to":3,"label":"структура"}]},{"title":"НС гласува министрите","text":"НС освобождава и избира министри по предложение на премиера с мнозинство от присъстващите; новите министри полагат клетва.","ref":"чл. 84, т. 6","nodes":["ns","ms"],"edges":["ns_ms"],"kind":"step","next":[{"to":4}]},{"title":"НС създава или закрива министерство","text":"Решение на НС по предложение на министър-председателя.","ref":"чл. 84, т. 7","nodes":["ns","ms"],"edges":["ns_ms"],"kind":"step"},{"title":"Нови устройствени правилници","text":"МС приема устройствените правилници и разпределя администрацията.","ref":"чл. 114","law":"Закон за администрацията","nodes":["ms"],"edges":[],"kind":"end"},{"title":"Оставка на премиера","text":"Ако премиерът подаде оставка, пада целият кабинет и тече процедурата с трите мандата.","ref":"чл. 111, ал. 1","nodes":["ms","prez"],"edges":["prez_ms_mandate"],"kind":"end","side":true}]},{"id":"prezend","title":"Предсрочно прекратяване на мандата на президента","steps":[{"title":"Основание","text":"Оставка пред КС, трайна невъзможност поради тежко заболяване, осъждане по импийчмънт или смърт.","ref":"чл. 97, ал. 1","nodes":["prez","ks"],"edges":[],"kind":"step"},{"title":"КС установява","text":"При оставка или трайна невъзможност мандатът се прекратява, когато КС установи обстоятелствата.","ref":"чл. 97, ал. 2","nodes":["ks","prez"],"edges":[],"kind":"step"},{"title":"Може ли вицепрезидентът?","text":"Вицепрезидентът встъпва в длъжността президент, ако може.","ref":"чл. 97, ал. 3","nodes":["vp"],"edges":[],"kind":"decision","next":[{"to":3,"label":"да"},{"to":4,"label":"не"}]},{"title":"Вицепрезидентът става президент","text":"Встъпва до края на мандата; поста вицепрезидент остава незает.","ref":"чл. 97, ал. 3","nodes":["vp","prez"],"edges":["vp_prez"],"kind":"end"},{"title":"Председателят на НС изпълнява функциите","text":"До избор на нов президент и вицепрезидент; изборите са в двумесечен срок.","ref":"чл. 97, ал. 4; чл. 84, т. 4","nodes":["chair","ns","narod"],"edges":["chair_prez"],"kind":"end","side":true}]},{"id":"pcontrol","title":"Парламентарен контрол","steps":[{"title":"Каква форма?","text":"Народните представители контролират правителството с въпроси и питания, изслушвания в комисии и временни комисии.","ref":"чл. 62, ал. 1","nodes":["ns","ms"],"edges":["ns_ms_ctrl"],"kind":"decision","next":[{"to":1,"label":"въпрос"},{"to":3,"label":"изслушване"},{"to":4,"label":"анкета"}]},{"title":"Въпрос или питане","text":"Всеки депутат може да отправи въпрос или питане до МС или министър; те са длъжни да отговорят.","ref":"чл. 90, ал. 1","nodes":["ns","ms"],"edges":["ns_ms_ctrl"],"kind":"step","next":[{"to":2,"label":"1/5"}]},{"title":"Разисквания и решение","text":"По питане, при искане на 1/5 от депутатите, има разисквания и НС приема решение.","ref":"чл. 90, ал. 2","nodes":["ns"],"edges":[],"kind":"end","side":true},{"title":"Изслушване в комисия","text":"Постоянните комисии упражняват контрол от името на НС; министрите са длъжни да се явят при поискване.","ref":"чл. 79, ал. 2; чл. 80","nodes":["cmte","ms"],"edges":["cmte_ms"],"kind":"end"},{"title":"Временна (анкетна) комисия","text":"НС избира временна комисия за проучване. Докладът може да доведе до вот на недоверие или сигнал до прокуратурата.","ref":"чл. 79, ал. 3","law":"Правилник за организацията и дейността на НС","nodes":["cmte","ns","pg"],"edges":["ns_cmte"],"kind":"end"}]},{"id":"appeal","title":"Обжалване на административен акт","steps":[{"title":"Административен акт","text":"Решение, разрешение, отказ или санкция от министър, агенция, кмет или областен управител.","law":"Административнопроцесуален кодекс","nodes":["ms","kmet","oblast"],"edges":[],"kind":"step"},{"title":"Обжалване пред горния орган","text":"По избор, а в някои случаи задължително, актът първо се обжалва пред по-горестоящия административен орган.","law":"Административнопроцесуален кодекс","nodes":["ms","oblast"],"edges":[],"kind":"step"},{"title":"Административен съд","text":"Жалба обикновено в 14-дневен срок. Актовете на МС и на министрите се обжалват направо пред ВАС.","ref":"чл. 120; чл. 125, ал. 2","law":"Административнопроцесуален кодекс","nodes":["courts","vas"],"edges":["courts_kmet"],"kind":"step","next":[{"to":3},{"to":4,"label":"закон"}]},{"title":"Касация","text":"Решението се обжалва с касационна жалба пред ВАС или, за определени по закон дела, пред тричленен състав на административния съд. Решението е окончателно.","ref":"чл. 125, ал. 1","law":"Административнопроцесуален кодекс","nodes":["vas","courts"],"edges":[],"kind":"end"},{"title":"Сезиране на КС или Съда на ЕС","text":"Ако законът противоречи на Конституцията, съдът спира делото и сезира КС. При въпрос за правото на ЕС може да попита Съда на ЕС.","ref":"чл. 150, ал. 2","law":"Договор за функционирането на ЕС","nodes":["ks","cjeu","courts"],"edges":["courts_ks_ref","courts_cjeu"],"kind":"end","side":true}]},{"id":"eulaw","title":"Право на ЕС: директива и преюдициално запитване","steps":[{"title":"ЕК предлага","text":"Европейската комисия има законодателната инициатива в ЕС.","law":"Договор за функционирането на ЕС","nodes":["ec"],"edges":[],"kind":"step"},{"title":"ЕП и Съветът приемат","text":"Обикновена законодателна процедура. В Съвета на ЕС България гласува чрез своя министър.","law":"Договор за функционирането на ЕС","nodes":["ep","cou","ms"],"edges":["ms_cou","ep_ec"],"kind":"step"},{"title":"Транспониране","text":"МС внася законопроект, НС го приема в срока, определен в директивата.","ref":"чл. 87, ал. 1; чл. 84, т. 1","nodes":["ms","ns"],"edges":["ms_ns_bill"],"kind":"step"},{"title":"Навреме ли е?","text":"Комисията проверява дали директивата е въведена точно и навреме.","law":"Договор за функционирането на ЕС","nodes":["ec"],"edges":["ec_ms"],"kind":"decision","next":[{"to":5,"label":"да"},{"to":4,"label":"не"}]},{"title":"Процедура за нарушение","text":"ЕК открива процедура и може да сезира Съда на ЕС, който може да наложи финансови санкции.","law":"Договор за функционирането на ЕС","nodes":["ec","cjeu"],"edges":["ec_ms"],"kind":"step","next":[{"to":5}],"side":true},{"title":"Прилагане от съдилищата","text":"Съдилищата прилагат правото на ЕС с предимство. При неяснота питат Съда на ЕС (преюдициално запитване); отговорът е задължителен.","ref":"чл. 5, ал. 4","law":"Договор за функционирането на ЕС","nodes":["courts","vks","cjeu"],"edges":["courts_cjeu","vks_cjeu"],"kind":"end"}]},{"id":"loan","title":"Държавен заем","steps":[{"title":"Лимит в бюджета","text":"Законът за държавния бюджет определя максималния размер на новия дълг за годината.","ref":"чл. 84, т. 2","law":"Закон за държавния дълг","nodes":["ns","min_fin"],"edges":[],"kind":"step"},{"title":"Договаряне","text":"Министърът на финансите договаря заема или емитира ценни книжа от името на МС.","law":"Закон за държавния дълг","nodes":["min_fin","ms"],"edges":[],"kind":"step"},{"title":"Какъв дълг?","text":"Договор за заем (напр. с международна институция) или държавни ценни книжа на пазара.","law":"Закон за държавния дълг","nodes":["ms"],"edges":[],"kind":"decision","next":[{"to":3,"label":"договор"},{"to":4,"label":"ДЦК"}]},{"title":"Съгласие на НС","text":"НС дава съгласие за договорите за държавни заеми; договорите с финансови задължения се ратифицират със закон.","ref":"чл. 84, т. 9; чл. 85, ал. 1","nodes":["ns"],"edges":[],"kind":"step"},{"title":"Обслужване и одит","text":"Дългът се изплаща от бюджета; Сметната палата одитира.","ref":"чл. 91, ал. 1","law":"Закон за държавния дълг","nodes":["min_fin","smetna"],"edges":["smetna_ms"],"kind":"end"}]},{"id":"disaster","title":"Бедствено положение и извънредна епидемична обстановка","steps":[{"title":"Кризисна ситуация","text":"Природно бедствие, авария, епидемия или военна заплаха.","nodes":["ms","kmet","oblast"],"edges":[],"kind":"step"},{"title":"Какъв режим?","text":"Режимите по закон (бедствено положение, епидемична обстановка) са различни от извънредното положение по Конституцията, което ограничава повече права.","nodes":["ms"],"edges":[],"kind":"decision","next":[{"to":2,"label":"бедствие"},{"to":3,"label":"болест"},{"to":4,"label":"война"}]},{"title":"Бедствено положение","text":"Обявява се от кмета, областния управител или МС според обхвата. Позволява ограничения и мобилизиране на ресурси.","law":"Закон за защита при бедствия","nodes":["kmet","oblast","ms"],"edges":[],"kind":"end"},{"title":"Извънредна епидемична обстановка","text":"Обявява се от МС по предложение на министъра на здравеопазването. Мерките са със заповеди на министъра и подлежат на съдебен контрол.","law":"Закон за здравето","nodes":["ms","min_mz","vas"],"edges":[],"kind":"end"},{"title":"Извънредно положение","text":"Обявява се от НС (или от президента, ако НС не заседава). Виж сценария „Война или извънредно положение“.","ref":"чл. 84, т. 12; чл. 100, ал. 5","nodes":["ns","prez"],"edges":[],"kind":"end","side":true}]},{"id":"byel","title":"Частични и предсрочни избори","steps":[{"title":"Чий мандат се освобождава?","text":"Различните мандати се попълват по различен начин.","nodes":["cik"],"edges":[],"kind":"decision","next":[{"to":1,"label":"депутат"},{"to":2,"label":"кмет"},{"to":3,"label":"президент"},{"to":4,"label":"НС"}]},{"title":"Депутат","text":"Няма частични избори: ЦИК обявява за избран следващия в същата листа.","law":"Изборен кодекс","nodes":["cik","ns"],"edges":["cik_ns"],"kind":"end"},{"title":"Кмет","text":"ЦИК насрочва частични избори, ако до края на мандата остава повече от година; иначе общинският съвет избира временно изпълняващ длъжността.","law":"Изборен кодекс; Закон за местното самоуправление и местната администрация","nodes":["cik","kmet","obs"],"edges":["cik_kmet"],"kind":"end"},{"title":"Президент и вицепрезидент","text":"Ако вицепрезидентът не може да встъпи, председателят на НС изпълнява функциите и в два месеца се провеждат избори.","ref":"чл. 97, ал. 4; чл. 84, т. 4","nodes":["chair","narod","cik"],"edges":["v_prez"],"kind":"end"},{"title":"Предсрочни избори за НС","text":"Президентът разпуска НС и насрочва избори в два месеца, ако не е съставено правителство. В последните 3 месеца от мандата си не може.","ref":"чл. 99, ал. 5; чл. 99, ал. 7","nodes":["prez","ns","cik"],"edges":["prez_ns_diss","prez_ns_call"],"kind":"end"}]}],"majorities":[{"n":48,"label":"1/5","what":"Вот на недоверие; сезиране на КС; разисквания по питане","ref":"чл. 89, ал. 1; чл. 150, ал. 1; чл. 90, ал. 2"},{"n":60,"label":"1/4","what":"Обвинение срещу президента; инициатива за изменение на Конституцията","ref":"чл. 103, ал. 2; чл. 154, ал. 1"},{"n":120,"label":"1/2","what":"Инициатива за Велико НС (не по-малко от половината)","ref":"чл. 159, ал. 1"},{"n":121,"label":"1/2 + 1","what":"Кворум; преодоляване на вето; вот на недоверие","ref":"чл. 81, ал. 1; чл. 101, ал. 2; чл. 89, ал. 1"},{"n":160,"label":"2/3","what":"Членове на ВСС и Инспектората; избори за ВНС; изменение на Конституцията при повторно гласуване","ref":"чл. 130, ал. 3; чл. 132а, ал. 2; чл. 160, ал. 1; чл. 155, ал. 2"},{"n":161,"label":"> 2/3","what":"Поддържане на обвинението срещу президента","ref":"чл. 103, ал. 2"},{"n":180,"label":"3/4","what":"Изменение на Конституцията от обикновено НС","ref":"чл. 155, ал. 1"}],"zones":[{"label":"Избори","x":220,"y":10,"w":760,"h":70,"color":"#1d1d1f"},{"label":"Законодателна власт","x":15,"y":95,"w":390,"h":850,"color":"#0b4f8a"},{"label":"Изпълнителна власт","x":420,"y":95,"w":480,"h":850,"color":"#b45309"},{"label":"Съдебна власт","x":915,"y":95,"w":370,"h":850,"color":"#5b3f99"},{"label":"Конституционен контрол (извън трите власти)","x":420,"y":960,"w":480,"h":80,"color":"#0f766e"},{"label":"Местно самоуправление: отделен слой, извън трите държавни власти","x":15,"y":1055,"w":1270,"h":110,"color":"#7a4a2a","layer":true},{"label":"Европейски съюз: външен за държавата, но с обвързващо право","x":15,"y":1180,"w":1270,"h":110,"color":"#1f4e9c","external":true}],"groups":[{"id":"g_ns","label":"Народни събрания","x":40,"y":120,"w":340,"h":265,"members":["ns","chair","vns","cmte"]},{"id":"g_ind","label":"Независими органи, избирани от НС","x":30,"y":400,"w":360,"h":435,"members":["bnb","smetna","ombuds","sem","kevr","kzk","kfn","kzld","kpk","konpi","kdos","bkrs","kzd","krs"]},{"id":"g_media","label":"Обществени медии","x":30,"y":850,"w":360,"h":80,"members":["bnt","bnr","bta"],"row":true},{"id":"g_prez","label":"Президентство","x":440,"y":120,"w":440,"h":140,"members":["prez","vp","nso","ksns"]},{"id":"g_sec","label":"Служби за сигурност и разузнаване","x":440,"y":270,"w":440,"h":70,"members":["dans","dar","vr"]},{"id":"g_ms","label":"Министерски съвет и 18 министерства","x":440,"y":366,"w":440,"h":296,"members":["ms","min_fin","min_mvr","min_def","min_mfa","minjust","min_mlsp","min_mon","min_mz","min_mi","min_mitd","min_mrrb","min_me","min_mtc","min_mzh","min_moew","min_mk","min_mt","min_mms"]},{"id":"g_terr","label":"Държавна власт по места","x":440,"y":680,"w":440,"h":70,"members":["oblast"]},{"id":"g_soc","label":"Обществено осигуряване","x":440,"y":760,"w":440,"h":80,"members":["noi","nzok"]},{"id":"g_msx","label":"Консултации и класифицирана информация","x":440,"y":850,"w":440,"h":80,"members":["dksi","nsts","iss"],"row":true},{"id":"g_vss","label":"Съдебен съвет","x":940,"y":120,"w":320,"h":142,"members":["vss","insp"]},{"id":"g_courts","label":"Съдилища","x":940,"y":289,"w":320,"h":208,"members":["vks","vas","courts"]},{"id":"g_pg","label":"Прокуратура","x":940,"y":524,"w":320,"h":140,"members":["pg","nsls"]},{"id":"g_bar","label":"Адвокатура (не е държавен орган)","x":940,"y":680,"w":320,"h":70,"members":["bar"]},{"id":"g_eu","label":"Институции на ЕС","x":30,"y":1205,"w":1240,"h":72,"members":["ep","euco","cou","ec","cjeu","ecb","eppo"],"row":true},{"id":"g_local","label":"Община","x":230,"y":1075,"w":860,"h":80,"members":["obs","kmet","rkmet"],"row":true}]},"const":{"source":{"title":"Конституция на Република България","version":"Консолидиран текст към ДВ, бр. 66 от 6.08.2024 г. (Решение № 13 на КС от 26.07.2024 г.)","official":"https://www.parliament.bg/bg/const","consolidated":"https://dryanovo-rs.justice.bg/upload/140163/KONSTITUCIQ_na_Republika_Bylgariq.pdf","english":"https://www.cik.bg/upload/272335/1.1+CONSTITUTION_of_the_Republic_of_Bulgaria.pdf","note":"„Текст“ е дословен цитат от консолидирания текст (без бележките за изменения). „Резюме“ е преразказ по официалния превод там, където дословният текст не е вграден.","lex":"https://lex.bg/laws/ldoc/521957377"},"chapters":{"1":"Глава първа. Основни начала","3":"Глава трета. Народно събрание","4":"Глава четвърта. Президент на републиката","5":"Глава пета. Министерски съвет","6":"Глава шеста. Съдебна власт","7":"Глава седма. Местно самоуправление и местна администрация","8":"Глава осма. Конституционен съд","9":"Глава девета. Изменение на Конституцията. Приемане на нова Конституция"},"articles":{"4":{"ch":"1","verbatim":true,"text":"(1) Република България е правова държава. Тя се управлява според Конституцията и законите на страната.\n(2) Република България гарантира живота, достойнството и правата на личността и създава условия за свободно развитие на човека и на гражданското общество.\n(3) Република България участва в изграждането и развитието на Европейския съюз."},"5":{"ch":"1","verbatim":false,"text":"(4) Международните договори, ратифицирани по конституционен ред, обнародвани и влезли в сила за Република България, са част от вътрешното право на страната. Те имат предимство пред тези норми на вътрешното законодателство, които им противоречат.","note":"Показана е само ал. 4."},"62":{"ch":"3","verbatim":true,"text":"(1) Народното събрание осъществява законодателната власт и упражнява парламентарен контрол.\n(2) Народното събрание има самостоятелен бюджет."},"63":{"ch":"3","verbatim":true,"text":"Народното събрание се състои от 240 народни представители."},"64":{"ch":"3","verbatim":true,"text":"(1) Народното събрание се избира за срок от четири години.\n(2) В случай на война, военно или друго извънредно положение, настъпили по време на мандата на Народното събрание, срокът на неговите пълномощия се продължава до отпадането на тези обстоятелства.\n(3) Избори за ново Народно събрание се произвеждат не по-късно от един месец преди изтичане на срока на пълномощията на действащото Народно събрание.\n(4) С полагането на клетвата на новоизбраните народни представители се прекратяват пълномощията на предишното Народно събрание."},"65":{"ch":"3","verbatim":false,"text":"Народен представител може да бъде български гражданин, навършил 21 години, който не е поставен под запрещение и не изтърпява наказание лишаване от свобода. От 2023 г. и лица с двойно гражданство, ако са живели в страната последните 18 месеца. Държавните служители, регистрирани като кандидати, прекъсват работата си."},"70":{"ch":"3","verbatim":false,"text":"Народните представители не могат да бъдат задържани и срещу тях не може да бъде възбудено наказателно преследване освен за тежко престъпление и с разрешение на Народното събрание (а когато то не заседава, на председателя). Разрешение не се иска при заварено тежко престъпление или когато представителят е дал писмено съгласие."},"77":{"ch":"3","verbatim":true,"text":"(1) Председателят на Народното събрание:\n1. представлява Народното събрание;\n2. предлага проект за дневен ред на заседанията;\n3. открива, ръководи и закрива заседанията на Народното събрание и осигурява реда при провеждането им;\n4. удостоверява с подписа си съдържанието на приетите от Народното събрание актове;\n5. обнародва решенията, декларациите и обръщенията, приети от Народното събрание;\n6. организира международните връзки на Народното събрание.\n(2) Заместник-председателите на Народното събрание подпомагат председателя и осъществяват възложените им от него дейности."},"79":{"ch":"3","verbatim":true,"text":"(1) Народното събрание избира от своя състав постоянни и временни комисии.\n(2) Постоянните комисии подпомагат дейността на Народното събрание и упражняват от негово име парламентарен контрол.\n(3) Временни комисии се избират за проучвания и анкети."},"80":{"ch":"3","verbatim":true,"text":"Длъжностните лица и гражданите, когато бъдат поканени, са длъжни да се явяват пред парламентарните комисии и да им предоставят исканите от тях сведения и документи."},"81":{"ch":"3","verbatim":true,"text":"(1) Народното събрание открива заседанията си и приема своите актове, когато присъстват повече от половината народни представители.\n(2) Народното събрание приема законите и другите актове с мнозинство повече от половината от присъстващите народни представители, освен когато Конституцията изисква друго мнозинство.\n(3) Гласуването е лично и явно, освен когато Конституцията предвижда или Народното събрание реши то да бъде тайно."},"82":{"ch":"3","verbatim":true,"text":"Заседанията на Народното събрание са открити. По изключение Народното събрание може да реши отделни заседания да бъдат закрити."},"83":{"ch":"3","verbatim":true,"text":"(1) Членовете на Министерския съвет могат да участват в заседанията на Народното събрание и на парламентарните комисии. По тяхно искане те се изслушват с предимство.\n(2) Народното събрание и парламентарните комисии могат да задължават министрите да се явяват на техни заседания и да отговарят на поставени въпроси."},"84":{"ch":"3","verbatim":true,"text":"Народното събрание:\n1. приема, изменя, допълва и отменя законите;\n2. приема държавния бюджет и отчета за изпълнението му;\n3. установява данъците и определя размера на държавните данъци;\n4. насрочва избори за президент на републиката;\n5. приема решение за произвеждане на национален референдум;\n6. избира и освобождава министър-председателя и по негово предложение – Министерския съвет; извършва промени в правителството по предложение на министър-председателя;\n7. създава, преобразува и закрива министерства по предложение на министър-председателя;\n8. избира и освобождава ръководителите на Българската народна банка и на други институции, определени със закон;\n9. дава съгласие за сключване на договори за държавни заеми;\n10. решава въпросите за обявяване на война и за сключване на мир;\n11. разрешава изпращането и използването на български въоръжени сили извън страната, както и пребиваването на чужди войски на територията на страната или преминаването им през нея;\n12. обявява военно или друго извънредно положение върху цялата територия на страната или върху част от нея по предложение на президента или на Министерския съвет;\n13. дава амнистия;\n14. учредява ордени и медали;\n15. определя официалните празници;\n16. изслушва и приема годишните доклади на Върховния касационен съд, на Върховния административен съд и на главния прокурор, внесени от Висшия съдебен съвет, за прилагането на закона и за дейността на съдилищата, прокуратурата и разследващите органи. Народното събрание може да изслушва и приема и други доклади на главния прокурор за дейността на прокуратурата по прилагането на закона, противодействието на престъпността и реализирането на наказателната политика;\n17. изслушва и приема доклади за дейността на органи, които изцяло или частично се избират от Народното събрание, когато това е предвидено в закон."},"85":{"ch":"3","verbatim":true,"text":"(1) Народното събрание ратифицира и денонсира със закон международните договори, които:\n1. имат политически или военен характер;\n2. се отнасят до участието на Република България в международни организации;\n3. предвиждат коригиране на границата на Република България;\n4. съдържат финансови задължения за държавата;\n5. предвиждат участие на държавата в арбитражно или съдебно уреждане на международни спорове;\n6. се отнасят до основните права на човека;\n7. се отнасят до действието на закона или изискват мерки от законодателен характер за тяхното изпълнение;\n8. изрично предвиждат ратификация;\n9. предоставят на Европейския съюз правомощия, произтичащи от тази Конституция.\n(2) Законът за ратифициране на международен договор по ал. 1, т. 9 се приема с мнозинство две трети от всички народни представители.\n(3) Ратифицираните от Народното събрание договори могат да бъдат изменяни или денонсирани само по реда, посочен в самите договори, или в съответствие с общопризнатите норми на международното право.\n(4) Сключването на международни договори, които изискват изменения в Конституцията, трябва да бъде предшествано от приемането на тези изменения."},"86":{"ch":"3","verbatim":false,"text":"Народното събрание приема закони, решения, декларации и обръщения. Законите и решенията му са задължителни за всички държавни органи, организации и граждани."},"87":{"ch":"3","verbatim":true,"text":"(1) Право на законодателна инициатива имат всеки народен представител и Министерският съвет.\n(2) Законопроектът за държавния бюджет се изготвя и внася от Министерския съвет."},"88":{"ch":"3","verbatim":true,"text":"(1) Законите се обсъждат и приемат с две гласувания, които се извършват на отделни заседания. По изключение Народното събрание може да реши двете гласувания да се извършат в едно заседание.\n(2) Другите актове на Народното събрание се приемат с едно гласуване.\n(3) Приетите актове се обнародват в „Държавен вестник“ не по-късно от 15 дни след приемането им."},"89":{"ch":"3","verbatim":true,"text":"(1) Една пета от народните представители може да предложи на Народното събрание да гласува недоверие на Министерския съвет. Предложението е прието, когато за него са гласували повече от половината от всички народни представители.\n(2) Когато Народното събрание гласува недоверие на министър-председателя или на Министерския съвет, министър-председателят подава оставката на правителството.\n(3) Когато Народното събрание отхвърли предложението за гласуване на недоверие на Министерския съвет, ново предложение за недоверие на същото основание не може да бъде направено в следващите шест месеца."},"90":{"ch":"3","verbatim":true,"text":"(1) Народните представители имат право на въпроси и на питания до Министерския съвет или до отделни министри, които са длъжни да отговарят.\n(2) По предложение на една пета от народните представители по питането стават разисквания и се приема решение."},"91":{"ch":"3","verbatim":true,"text":"(1) Народното събрание избира Сметна палата, която осъществява контрол за изпълнението на бюджета.\n(2) Организацията, правомощията и редът за дейност на Сметната палата се уреждат със закон."},"91а":{"ch":"3","verbatim":true,"text":"(1) Народното събрание избира омбудсман, който се застъпва за правата и свободите на гражданите.\n(2) Правомощията и дейността на омбудсмана се уреждат със закон."},"92":{"ch":"4","verbatim":true,"text":"(1) Президентът е държавен глава. Той олицетворява единството на нацията и представлява Република България в международните отношения.\n(2) Президентът се подпомага в своята дейност от вицепрезидент."},"93":{"ch":"4","verbatim":true,"text":"(1) Президентът се избира пряко от избирателите за срок от пет години по ред, определен със закон.\n(2) За президент може да бъде избиран български гражданин по рождение, навършил 40 години, който няма друго гражданство, не е поставен под запрещение, не изтърпява наказание лишаване от свобода и е живял последните пет години в страната.\n(3) Избран е кандидатът, получил повече от половината действителни гласове, ако в гласуването са участвали повече от половината избиратели.\n(4) Ако никой от кандидатите не е избран, в седемдневен срок се произвежда нов избор, в който участват двамата кандидати, получили най-много гласове. Избран е кандидатът, получил повече гласове.\n(5) Изборът за нов президент се произвежда не по-рано от три месеца и не по-късно от два месеца преди изтичане на срока на пълномощията на действащия президент.\n(6) Споровете относно законността на избора за президент се решават от Конституционния съд в едномесечен срок след изборите."},"94":{"ch":"4","verbatim":true,"text":"Вицепрезидентът се избира едновременно и в една листа с президента при условията и по реда за избиране на президент."},"95":{"ch":"4","verbatim":true,"text":"(1) Президентът и вицепрезидентът могат да бъдат преизбрани на същата длъжност само за още един мандат.\n(2) Президентът и вицепрезидентът не могат да бъдат народни представители, да изпълняват други държавни, обществени и стопански дейности и да участвуват в ръководството на политически партии."},"97":{"ch":"4","verbatim":true,"text":"(1) Пълномощията на президента и на вицепрезидента се прекратяват предсрочно при:\n1. подаване на оставка пред Конституционния съд;\n2. трайна невъзможност да изпълняват правомощията си поради тежко заболяване;\n3. при условията на чл. 103;\n4. смърт.\n(2) В случаите на т. 1 и 2 пълномощията на президента и вицепрезидента се прекратяват с установяване от Конституционния съд на посочените в тях обстоятелства.\n(3) В случаите на ал. 1 вицепрезидентът встъпва в длъжността президент до края на мандата.\n(4) При невъзможност вицепрезидентът да встъпи в длъжност правомощията на президента се изпълняват от председателя на Народното събрание до избирането на президент и вицепрезидент. В този случай в двумесечен срок се произвеждат избори за президент и вицепрезидент."},"98":{"ch":"4","verbatim":true,"text":"Президентът на републиката:\n1. насрочва избори за Народно събрание и органи на местно самоуправление и определя датата за произвеждане на национален референдум, когато за това има решение на Народното събрание;\n2. отправя обръщения към народа и Народното събрание;\n3. сключва международни договори в случаите, определени със закон;\n4. обнародва законите;\n5. утвърждава промени на границите и центровете на административно-териториалните единици по предложение на Министерския съвет;\n6. назначава и освобождава от длъжност ръководителите на дипломатическите представителства и постоянните представители на Република България при международни организации по предложение на Министерския съвет и приема акредитивните и отзователните писма на чуждестранните дипломатически представители в страната;\n7. назначава и освобождава от длъжност и други държавни служители, определени със закон;\n8. награждава с ордени и медали;\n9. дава и възстановява българско гражданство и освобождава и лишава от него;\n10. предоставя убежище;\n11. упражнява право на помилване;\n12. опрощава несъбираеми държавни вземания;\n13. наименува обекти с национално значение и населени места;\n14. информира Народното събрание по основни въпроси в кръга на своите правомощия."},"99":{"ch":"4","verbatim":true,"text":"(1) Президентът след консултации с парламентарните групи възлага на кандидат за министър-председател, посочен от най-голямата по численост парламентарна група, да състави правителство.\n(2) Когато в 7-дневен срок кандидатът за министър-председател не успее да предложи състав на Министерския съвет, президентът възлага това на посочен от втората по численост парламентарна група кандидат за министър-председател.\n(3) Ако и в този случай не бъде предложен състав на Министерския съвет, президентът в срока по предходната алинея възлага на някоя следваща парламентарна група да посочи кандидат за министър-председател.\n(4) Когато проучвателният мандат е приключил успешно, президентът предлага на Народното събрание да избере кандидата за министър-председател.\n(5) Ако не се постигне съгласие за образуване на правителство, президентът, след консултации с парламентарните групи и по предложение на кандидата за служебен министър-председател, назначава служебно правителство и насрочва нови избори в двумесечен срок. За служебен министър-председател се назначава измежду председателя на Народното събрание, управителя или подуправител на Българската народна банка, председателя или заместник-председател на Сметната палата и омбудсмана или негов заместник.\n(6) Редът за съставяне на правителство по предходните алинеи се прилага и в случаите на чл. 111, ал. 1.\n(7) В случаите на ал. 5 и 6 президентът не може да разпуска Народното събрание през последните три месеца от своя мандат. Ако в този срок парламентът не може да състави правителство, президентът назначава служебно правителство."},"100":{"ch":"4","verbatim":true,"text":"(1) Президентът е върховен главнокомандващ на въоръжените сили на Република България.\n(2) Президентът назначава и освобождава висшия команден състав на въоръжените сили и удостоява с висши военни звания по предложение на Министерския съвет.\n(3) Президентът възглавява Консултативния съвет за национална сигурност, чийто статут се определя със закон.\n(4) Президентът обявява обща или частична мобилизация по предложение на Министерския съвет в съответствие със закона.\n(5) Президентът обявява положение на война при въоръжено нападение срещу страната или при необходимост от неотложно изпълнение на международни задължения, военно или друго извънредно положение, когато Народното събрание не заседава. В тези случаи то се свиква незабавно, за да се произнесе по решението."},"101":{"ch":"4","verbatim":true,"text":"(1) В срока по чл. 88, ал. 3 президентът може мотивирано да върне закона в Народното събрание за ново обсъждане, което не може да му бъде отказано.\n(2) Народното събрание приема повторно закона с мнозинство повече от п
