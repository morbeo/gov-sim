<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Политико: държавно устройство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea;
  --panel: #fffdf8;
  --ink: #1d1d1f;
  --muted: #6b6760;
  --line: #d9d3c7;
  --accent: #0b4f8a;
  --hi: #fff4d6;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
h1 { margin: 0; font-size: 20px; }
header p { margin: 0; color: var(--muted); flex: 1 1 320px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 52px); }
#left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; user-select: none; }
.chip.off { opacity: .4; text-decoration: line-through; }
.chip svg { flex: none; }
.bar .sp { flex: 1; }
.clegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; width: 100%; justify-content: flex-end; }
.clegend span { display: inline-flex; align-items: center; gap: 5px; }
.clegend i { width: 12px; height: 12px; border: 2.5px solid; border-radius: 3px; background: #fff; }
.fchart { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 118px; column-gap: 30px; row-gap: 24px; align-items: start; padding: 6px 0 6px 46px; margin: 10px 0; }
.fchart svg.fl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.fbox { background: #fff; border: 1.5px solid #8c877d; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; line-height: 1.3; cursor: pointer; position: relative; z-index: 1; }
.fbox:hover { border-color: var(--ink); }
.fbox.k-decision { background: #fff8e6; border-color: #c98a1b; border-radius: 18px; text-align: center; }
.fbox.k-end { background: #eef6ef; border-color: #2e6b3a; border-width: 2.5px; }
.fbox.side { font-size: 11.5px; }
.fbox.on { box-shadow: 0 0 0 3px #0b4f8a; }
.fbox .n { font-size: 10.5px; color: var(--muted); margin-right: 4px; }
.flegend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); }
.flegend span { display: inline-flex; gap: 5px; align-items: center; }
.flegend i { width: 18px; height: 11px; border: 1.5px solid; display: inline-block; }
a.site { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.site:hover { text-decoration: underline; }
#stage { position: relative; flex: 1; min-height: 0; overflow: auto; }
#graph { width: 100%; height: 100%; min-width: 860px; min-height: 560px; display: block; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: none; z-index: 5; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; background: none; padding: 8px 4px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding: 14px 16px 28px; overflow: auto; flex: 1; display: none; }
.pane.on { display: block; }
h2 { font-size: 17px; margin: 0 0 4px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
button, input, select { font: inherit; color: var(--ink); }
button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
input[type=search], select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
input[type=search] { width: 100%; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; vertical-align: 1px; }
dl { margin: 8px 0 0; display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; }
dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
dd { margin: 0; }
ul.pw { margin: 0; padding: 0; list-style: none; }
ul.pw li { padding: 6px 0; border-top: 1px solid var(--line); }
.refs { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 2px; }
a.art { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #ece6f6; color: #3d2a6e; text-decoration: none; white-space: nowrap; cursor: pointer; }
a.art:hover { background: #ddd2f0; }
a.ext { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.ext:hover { text-decoration: underline; }
.law { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #eee9df; color: #5a554c; white-space: nowrap; }
.conn { padding: 5px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
.conn svg { flex: none; margin-top: 6px; }
.who { font-weight: 600; cursor: pointer; } .who:hover { text-decoration: underline; }
.legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; cursor: pointer; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; flex: none; }
.node { cursor: pointer; }
.node rect.box { stroke-width: 1.6; }
.node .t { font-size: 12.5px; font-weight: 700; fill: var(--ink); pointer-events: none; }
.node .mt.two { font-size: 9.6px; }
.node .mt { font-size: 11px; font-weight: 600; fill: var(--ink); pointer-events: none; }
.node .cnt { fill: #f3e6d6; }
.node .cntt { font-size: 11px; font-weight: 700; fill: #8a4a06; pointer-events: none; }
.zone { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.glabel { font-size: 10.5px; fill: var(--muted); font-weight: 600; cursor: pointer; }
.glabel:hover { fill: var(--ink); text-decoration: underline; }
.group.dim { opacity: .35; }
.unit { padding: 3px 0; border-top: 1px dotted var(--line); font-size: 12.5px; display: flex; gap: 8px; justify-content: space-between; }
.node .s { font-size: 10px; fill: var(--muted); pointer-events: none; }
.node.sel rect.box { stroke-width: 3.2; }
.edge { fill: none; opacity: .55; }
.edge.on { opacity: 1; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12px; cursor: pointer; }
.dim { opacity: .1; }
.flow { animation: flow 1.1s linear infinite; stroke-dasharray: 9 5 !important; }
@keyframes flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
.scnpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.scn button.pick { font-size: 12.5px; }
.scn button.pick.on { border-color: var(--accent); background: #eef4fb; }
.step { background: var(--hi); border: 1px solid #e6c873; border-radius: 6px; padding: 10px; margin: 8px 0; }
.stepnav { display: flex; gap: 6px; align-items: center; }
.stepnav .muted { flex: 1; text-align: center; }
.term { display: grid; grid-template-columns: 150px 1fr; gap: 2px 8px; align-items: center; margin: 3px 0; font-size: 12.5px; }
.term .nm { cursor: pointer; text-align: right; } .term .nm:hover { text-decoration: underline; }
.term .tr { position: relative; height: 18px; background: #f0ece3; border-radius: 3px; }
.term .tb { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.term .tl { position: absolute; left: 6px; top: 0; font-size: 11px; line-height: 18px; color: #fff; white-space: nowrap; font-weight: 600; }
.pubrow { padding: 7px 0; border-top: 1px solid var(--line); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.maj { padding: 6px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
.maj b { font-size: 18px; }
.article { border-top: 1px solid var(--line); padding: 8px 0; }
.article.hi { background: var(--hi); margin: 0 -16px; padding: 8px 16px; }
.article .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.article .hd b { cursor: pointer; } .article .hd b:hover { text-decoration: underline; }
.article .tx { white-space: pre-wrap; font-size: 12.5px; margin: 4px 0; }
.article .cited { font-size: 12px; color: var(--muted); }
.chap { font-weight: 700; margin: 14px 0 4px; font-size: 13px; color: #3d2a6e; }
.note { font-size: 12px; color: #7a4a00; }
.src { font-size: 12px; background: #f5f1e8; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #stage { height: 64vh; flex: none; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .pane { max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>Държавно устройство на България</h1>
  <p>Кой кого избира, кой може да спре, свали или провери другия. Всяко правомощие е с линк към члена от Конституцията.</p>
</header>
<main>
  <div id="left">

  <aside>
    <div class="tabs" role="tablist">

    <div class="pane" id="p-pub"></div>
    <div class="pane" id="p-maj"></div>
    <div class="pane" id="p-const"></div>
  </aside>
</main>

, ВАС, главният прокурор, омбудсманът и всеки съд по конкретно дело могат да сезират КС.","ref":"чл. 150","nodes":["ks","ns","prez","ms","vks","vas","pg","ombuds","courts"],"edges":["ns_ks_ref","prez_ks_ref","ms_ks_ref","vks_ks_ref","vas_ks_ref","pg_ks_ref","ombuds_ks_ref","courts_ks_ref"],"kind":"decision","next":[{"to":7,"label":"да"},{"to":9,"label":"не"}]},{"title":"КС: противоконституционен ли е? (7 от 12)","text":"КС решава с над половината от всички съдии.","ref":"чл. 151, ал. 1","nodes":["ks","ns"],"edges":["ks_ns"],"kind":"decision","next":[{"to":8,"label":"да"},{"to":9,"label":"не"}]},{"title":"Законът не се прилага","text":"Обявеният за противоконституционен закон не се прилага от влизането в сила на решението, 3 дни след обнародването му.","ref":"чл. 151, ал. 2","nodes":["ks"],"edges":[],"kind":"end","next":[],"side":true},{"title":"Законът е в сила","text":"Законът се прилага.","ref":"чл. 86","nodes":["ns"],"edges":[],"kind":"end","next":[]}]},{"id":"gov","title":"Съставяне на правителство","steps":[{"title":"Избори за НС","text":"Избирателите избират ново НС. Старото правителство подава оставка пред него и остава до избора на ново.","ref":"чл. 64; чл. 111, ал. 2; чл. 111, ал. 3","nodes":["narod","ns","ms","cik"],"edges":["v_ns","cik_ns"],"kind":"step"},{"title":"1-ви мандат: най-голямата група","text":"Президентът след консултации възлага мандат на кандидата на най-голямата група. Срокът е 7 дни.","ref":"чл. 99, ал. 1","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"decision","next":[{"to":4,"label":"успех"},{"to":2,"label":"провал"}]},{"title":"2-ри мандат: втората група","text":"Мандатът отива при кандидата на втората по численост група.","ref":"чл. 99, ал. 2","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"decision","next":[{"to":4,"label":"успех"},{"to":3,"label":"провал"}]},{"title":"3-ти мандат: група по избор на президента","text":"Президентът възлага на някоя следваща група да посочи кандидат.","ref":"чл. 99, ал. 3","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"decision","next":[{"to":4,"label":"успех"},{"to":5,"label":"провал"}]},{"title":"НС избира премиер и министри","text":"НС избира министър-председателя и по негово предложение министрите.","ref":"чл. 99, ал. 4; чл. 84, т. 6","nodes":["ns","ms"],"edges":["ns_ms"],"kind":"end","next":[],"side":true},{"title":"Служебно правителство","text":"Президентът назначава служебен кабинет. Служебният премиер е само от списък: председателят на НС, управителят или подуправител на БНБ, председателят или заместник на Сметната палата, омбудсманът или заместникът му.","ref":"чл. 99, ал. 5","nodes":["prez","ms","chair","bnb","smetna","ombuds"],"edges":["prez_ms_caretaker","chair_ms","bnb_ms","smetna_ms_pool","ombuds_ms"],"kind":"step"},{"title":"Разпускане на НС и нови избори","text":"Президентът разпуска НС и насрочва избори до 2 месеца. В последните 3 месеца от мандата си не може да разпусне НС.","ref":"чл. 99, ал. 5; чл. 99, ал. 7","nodes":["prez","ns","narod"],"edges":["prez_ns_diss","prez_ns_call"],"kind":"step","next":[{"to":0,"label":"отначало"}]}]},{"id":"noconf","title":"Сваляне на правителството","steps":[{"title":"Предложение за недоверие (48 НП)","text":"Една пета от народните представители внасят предложение за вот на недоверие.","ref":"чл. 89, ал. 1","nodes":["ns","ms"],"edges":["ns_ms_nc"],"kind":"step"},{"title":"Гласуват ли „за“ поне 121?","text":"Вотът е приет, ако „за“ гласуват над половината от всички народни представители.","ref":"чл. 89, ал. 1","nodes":["ns","ms"],"edges":["ns_ms_nc"],"kind":"decision","next":[{"to":3,"label":"да"},{"to":2,"label":"не"}]},{"title":"Правителството остава","text":"Ново предложение на същото основание не може да се внесе 6 месеца.","ref":"чл. 89, ал. 3","nodes":["ms"],"edges":[],"kind":"end","next":[],"side":true},{"title":"Оставка на правителството","text":"Министър-председателят подава оставката на правителството, което работи до избора на ново.","ref":"чл. 89, ал. 2; чл. 111, ал. 3","nodes":["ms"],"edges":[],"kind":"step"},{"title":"Отново трите мандата","text":"Тече процедурата за съставяне на правителство (виж сценария „Съставяне на правителство“).","ref":"чл. 99, ал. 6; чл. 111, ал. 1","nodes":["prez","ms"],"edges":["prez_ms_mandate"],"kind":"end","next":[]}]},{"id":"imp","title":"Импийчмънт на президента","steps":[{"title":"Държавна измяна или нарушение на Конституцията","text":"Президентът отговаря само за тези две деяния.","ref":"чл. 103, ал. 1","nodes":["prez"],"edges":[],"kind":"step"},{"title":"Предложение от поне 60 НП (1/4)","text":"Обвинението се внася от поне една четвърт от народните представители.","ref":"чл. 103, ал. 2","nodes":["ns","prez"],"edges":["ns_prez_imp"],"kind":"step"},{"title":"Подкрепят ли го над 2/3 (161+)?","text":"НС поддържа обвинението, ако повече от две трети гласуват „за“.","ref":"чл. 103, ал. 2","nodes":["ns","prez"],"edges":["ns_prez_imp"],"kind":"decision","next":[{"to":3,"label":"да"},{"to":7,"label":"не"}]},{"title":"КС разглежда делото до 1 месец","text":"Конституционният съд разглежда обвинението в едномесечен срок.","ref":"чл. 103, ал. 3; чл. 149, ал. 1","nodes":["ks","prez"],"edges":["ks_prez_imp"],"kind":"decision","next":[{"to":4,"label":"виновен"},{"to":7,"label":"не"}]},{"title":"Пълномощията се прекратяват","text":"Президентът губи поста.","ref":"чл. 103, ал. 3; чл. 97, ал. 1","nodes":["ks","prez"],"edges":["ks_prez_imp"],"kind":"decision","next":[{"to":5,"label":"има ВП"},{"to":6,"label":"няма ВП"}]},{"title":"Вицепрезидентът става президент","text":"Вицепрезидентът встъпва до края на мандата.","ref":"чл. 97, ал. 3","nodes":["vp","prez"],"edges":["vp_prez"],"kind":"end","next":[]},{"title":"Ако и ВП не може: председателят на НС","text":"Функциите поема председателят на НС, а в 2 месеца се произвеждат избори.","ref":"чл. 97, ал. 4","nodes":["chair","prez"],"edges":["chair_prez"],"kind":"end","next":[],"side":true},{"title":"Президентът остава","text":"Обвинението отпада.","ref":"чл. 103","nodes":["prez"],"edges":[],"kind":"end","next":[],"side":true}]},{"id":"pg","title":"Избор на главен прокурор","steps":[{"title":"ВСС: 25 членове","text":"3 по право, 11 избрани от НС с 2/3 и 11 от магистратите.","ref":"чл. 130, ал. 1; чл. 130, ал. 3","nodes":["vss","ns","courts","pg"],"edges":["ns_vss","courts_vss","pg_vss"],"kind":"step"},{"title":"Пленумът на ВСС предлага кандидат","text":"Пленумът прави предложение до президента.","ref":"чл. 130а, ал. 2","nodes":["vss","prez"],"edges":["vss_prez"],"kind":"step"},{"title":"Президентът приема ли?","text":"Президентът може да откаже веднъж.","ref":"чл. 129, ал. 2","nodes":["prez","vss"],"edges":["vss_prez"],"kind":"decision","next":[{"to":4,"label":"да"},{"to":3,"label":"отказ"}]},{"title":"Повторно предложение","text":"При повторно предложение президентът не може да откаже.","ref":"чл. 129, ал. 2","nodes":["vss","prez"],"edges":["vss_prez"],"kind":"step","next":[{"to":4,"label":"задължително"}],"side":true},{"title":"Указ: главен прокурор за 7 години","text":"Без право на повторно избиране.","ref":"чл. 129, ал. 2","nodes":["prez","pg"],"edges":["prez_pg"],"kind":"step"},{"title":"Освобождаване","text":"По същия ред и само на основанията от чл. 129, ал. 3 (напр. тежко нарушение).","ref":"чл. 129, ал. 2; чл. 129, ал. 3","nodes":["vss","prez","pg"],"edges":["vss_prez","prez_pg"],"kind":"end","next":[]}]},{"id":"const","title":"Промяна на Конституцията","steps":[{"title":"Засяга ли въпрос на ВНС?","text":"Нова Конституция, промяна на територията или на формата на управление, чл. 5, ал. 2 и 4, чл. 57, ал. 1 и 3 и глава девета се решават само от Велико НС.","ref":"чл. 158; чл. 153","nodes":["ns","vns"],"edges":[],"kind":"decision","next":[{"to":5,"label":"да"},{"to":1,"label":"не"}]},{"title":"Инициатива: 60 НП или президентът","text":"Инициатива имат 1/4 от народните представители и президентът. НС разглежда предложението след 1 до 3 месеца.","ref":"чл. 154","nodes":["ns","prez"],"edges":[],"kind":"step"},{"title":"Има ли 3/4 (180) на три гласувания?","text":"Обикновеното НС приема изменението с 3/4 на три гласувания в различни дни.","ref":"чл. 155, ал. 1","nodes":["ns"],"edges":[],"kind":"decision","next":[{"to":4,"label":"да"},{"to":3,"label":"2/3–3/4"}]},{"title":"След 2–5 месеца стига 2/3 (160)","text":"Ново обсъждане и гласуване с мнозинство 2/3 от всички.","ref":"чл. 155, ал. 2","nodes":["ns"],"edges":[],"kind":"step","next":[{"to":4,"label":"приет"}],"side":true},{"title":"Председателят на НС обнародва до 7 дни","text":"Законът за изменение се подписва и обнародва от председателя на НС.","ref":"чл. 156","nodes":["chair"],"edges":[],"kind":"end","next":[]},{"title":"Инициатива: 120 НП или президентът","text":"Поне половината народни представители или президентът.","ref":"чл. 159, ал. 1","nodes":["ns","prez"],"edges":[],"kind":"step"},{"title":"НС решава с 2/3 (160) избори за ВНС","text":"Президентът ги насрочва до 3 месеца; с изборите правомощията на НС се прекратяват.","ref":"чл. 160","nodes":["ns","prez","narod"],"edges":["ns_vns","prez_vns"],"kind":"step"},{"title":"ВНС (400 НП) решава с 2/3 на три гласувания","text":"Председателят на ВНС обнародва актовете до 7 дни.","ref":"чл. 157; чл. 161; чл. 163","nodes":["vns","narod"],"edges":["v_vns"],"kind":"end","next":[]}]}],"majorities":[{"n":48,"label":"1/5","what":"Вот на недоверие; сезиране на КС; разисквания по питане","ref":"чл. 89, ал. 1; чл. 150, ал. 1; чл. 90, ал. 2"},{"n":60,"label":"1/4","what":"Обвинение срещу президента; инициатива за изменение на Конституцията","ref":"чл. 103, ал. 2; чл. 154, ал. 1"},{"n":120,"label":"1/2","what":"Инициатива за Велико НС (не по-малко от половината)","ref":"чл. 159, ал. 1"},{"n":121,"label":"1/2 + 1","what":"Кворум; преодоляване на вето; вот на недоверие","ref":"чл. 81, ал. 1; чл. 101, ал. 2; чл. 89, ал. 1"},{"n":160,"label":"2/3","what":"Членове на ВСС и Инспектората; избори за ВНС; изменение на Конституцията при повторно гласуване","ref":"чл. 130, ал. 3; чл. 132а, ал. 2; чл. 160, ал. 1; чл. 155, ал. 2"},{"n":161,"label":"> 2/3","what":"Поддържане на обвинението срещу президента","ref":"чл. 103, ал. 2"},{"n":180,"label":"3/4","what":"Изменение на Конституцията от обикновено НС","ref":"чл. 155, ал. 1"}],"zones":[{"label":"Избори","x":220,"y":10,"w":760,"h":70,"color":"#1d1d1f"},{"label":"Законодателна власт","x":15,"y":95,"w":390,"h":660,"color":"#0b4f8a"},{"label":"Изпълнителна власт","x":420,"y":95,"w":480,"h":660,"color":"#b45309"},{"label":"Съдебна власт","x":915,"y":95,"w":370,"h":660,"color":"#5b3f99"},{"label":"Конституционен контрол (извън трите власти)","x":420,"y":758,"w":480,"h":88,"color":"#0f766e"}],"groups":[{"id":"g_ns","label":"Народни събрания","x":40,"y":120,"w":340,"h":200,"members":["ns","chair","vns"]},{"id":"g_ind","label":"Независими органи, избирани от НС","x":40,"y":354,"w":340,"h":265,"members":["bnb","smetna","ombuds","sem"]},{"id":"g_prez","label":"Президентство","x":440,"y":120,"w":440,"h":78,"members":["prez","vp"]},{"id":"g_ms","label":"Министерски съвет и 18 министерства","x":440,"y":222,"w":440,"h":300,"members":["ms","min_fin","min_mvr","min_def","min_mfa","minjust","min_mlsp","min_mon","min_mz","min_mi","min_mitd","min_mrrb","min_me","min_mtc","min_mzh","min_moew","min_mk","min_mt","min_mms"]},{"id":"g_terr","label":"Държавна и местна власт по места","x":440,"y":566,"w":440,"h":170,"members":["oblast","local"]},{"id":"g_vss","label":"Съдебен съвет","x":940,"y":120,"w":320,"h":142,"members":["vss","insp"]},{"id":"g_courts","label":"Съдилища","x":940,"y":289,"w":320,"h":208,"members":["vks","vas","courts"]},{"id":"g_pg","label":"Прокуратура","x":940,"y":524,"w":320,"h":70,"members":["pg"]}]},"const":{"source":{"title":"Конституция на Република България","version":"Консолидиран текст към ДВ, бр. 66 от 6.08.2024 г. (Решение № 13 на КС от 26.07.2024 г.)","official":"https://www.parliament.bg/bg/const","consolidated":"https://dryanovo-rs.justice.bg/upload/140163/KONSTITUCIQ_na_Republika_Bylgariq.pdf","english":"https://www.cik.bg/upload/272335/1.1+CONSTITUTION_of_the_Republic_of_Bulgaria.pdf","note":"„Текст“ е дословен цитат от консолидирания текст (без бележките за изменения). „Резюме“ е преразказ по официалния превод там, където дословният текст не е вграден."},"chapters":{"3":"Глава трета. Народно събрание","4":"Глава четвърта. Президент на републиката","5":"Глава пета. Министерски съвет","6":"Глава шеста. Съдебна власт","7":"Глава седма. Местно самоуправление и местна администрация","8":"Глава осма. Конституционен съд","9":"Глава девета. Изменение на Конституцията. Приемане на нова Конституция"},"articles":{"62":{"ch":"3","verbatim":true,"text":"(1) Народното събрание осъществява законодателната власт и упражнява парламентарен контрол.\n(2) Народното събрание има самостоятелен бюджет."},"63":{"ch":"3","verbatim":true,"text":"Народното събрание се състои от 240 народни представители."},"64":{"ch":"3","verbatim":true,"text":"(1) Народното събрание се избира за срок от четири години.\n(2) В случай на война, военно или друго извънредно положение, настъпили по време на мандата на Народното събрание, срокът на неговите пълномощия се продължава до отпадането на тези обстоятелства.\n(3) Избори за ново Народно събрание се произвеждат не по-късно от един месец преди изтичане на срока на пълномощията на действащото Народно събрание.\n(4) С полагането на клетвата на новоизбраните народни представители се прекратяват пълномощията на предишното Народно събрание."},"65":{"ch":"3","verbatim":false,"text":"Народен представител може да бъде български гражданин, навършил 21 години, който не е поставен под запрещение и не изтърпява наказание лишаване от свобода. От 2023 г. и лица с двойно гражданство, ако са живели в страната последните 18 месеца. Държавните служители, регистрирани като кандидати, прекъсват работата си."},"70":{"ch":"3","verbatim":false,"text":"Народните представители не могат да бъдат задържани и срещу тях не може да бъде възбудено наказателно преследване освен за тежко престъпление и с разрешение на Народното събрание (а когато то не заседава, на председателя). Разрешение не се иска при заварено тежко престъпление или когато представителят е дал писмено съгласие."},"77":{"ch":"3","verbatim":true,"text":"(1) Председателят на Народното събрание:\n1. представлява Народното събрание;\n2. предлага проект за дневен ред на заседанията;\n3. открива, ръководи и закрива заседанията на Народното събрание и осигурява реда при провеждането им;\n4. удостоверява с подписа си съдържанието на приетите от Народното събрание актове;\n5. обнародва решенията, декларациите и обръщенията, приети от Народното събрание;\n6. организира международните връзки на Народното събрание.\n(2) Заместник-председателите на Народното събрание подпомагат председателя и осъществяват възложените им от него дейности."},"81":{"ch":"3","verbatim":true,"text":"(1) Народното събрание открива заседанията си и приема своите актове, когато присъстват повече от половината народни представители.\n(2) Народното събрание приема законите и другите актове с мнозинство повече от половината от присъстващите народни представители, освен когато Конституцията изисква друго мнозинство.\n(3) Гласуването е лично и явно, освен когато Конституцията предвижда или Народното събрание реши то да бъде тайно."},"82":{"ch":"3","verbatim":true,"text":"Заседанията на Народното събрание са открити. По изключение Народното събрание може да реши отделни заседания да бъдат закрити."},"83":{"ch":"3","verbatim":true,"text":"(1) Членовете на Министерския съвет могат да участват в заседанията на Народното събрание и на парламентарните комисии. По тяхно искане те се изслушват с предимство.\n(2) Народното събрание и парламентарните комисии могат да задължават министрите да се явяват на техни заседания и да отговарят на поставени въпроси."},"84":{"ch":"3","verbatim":true,"text":"Народното събрание:\n1. приема, изменя, допълва и отменя законите;\n2. приема държавния бюджет и отчета за изпълнението му;\n3. установява данъците и определя размера на държавните данъци;\n4. насрочва избори за президент на републиката;\n5. приема решение за произвеждане на национален референдум;\n6. избира и освобождава министър-председателя и по негово предложение – Министерския съвет; извършва промени в правителството по предложение на министър-председателя;\n7. създава, преобразува и закрива министерства по предложение на министър-председателя;\n8. избира и освобождава ръководителите на Българската народна банка и на други институции, определени със закон;\n9. дава съгласие за сключване на договори за държавни заеми;\n10. решава въпросите за обявяване на война и за сключване на мир;\n11. разрешава изпращането и използването на български въоръжени сили извън страната, както и пребиваването на чужди войски на територията на страната или преминаването им през нея;\n12. обявява военно или друго извънредно положение върху цялата територия на страната или върху част от нея по предложение на президента или на Министерския съвет;\n13. дава амнистия;\n14. учредява ордени и медали;\n15. определя официалните празници;\n16. изслушва и приема годишните доклади на Върховния касационен съд, на Върховния административен съд и на главния прокурор, внесени от Висшия съдебен съвет, за прилагането на закона и за дейността на съдилищата, прокуратурата и разследващите органи. Народното събрание може да изслушва и приема и други доклади на главния прокурор за дейността на прокуратурата по прилагането на закона, противодействието на престъпността и реализирането на наказателната политика;\n17. изслушва и приема доклади за дейността на органи, които изцяло или частично се избират от Народното събрание, когато това е предвидено в закон."},"86":{"ch":"3","verbatim":false,"text":"Народното събрание приема закони, решения, декларации и обръщения. Законите и решенията му са задължителни за всички държавни органи, организации и граждани."},"87":{"ch":"3","verbatim":true,"text":"(1) Право на законодателна инициатива имат всеки народен представител и Министерският съвет.\n(2) Законопроектът за държавния бюджет се изготвя и внася от Министерския съвет."},"88":{"ch":"3","verbatim":true,"text":"(1) Законите се обсъждат и приемат с две гласувания, които се извършват на отделни заседания. По изключение Народното събрание може да реши двете гласувания да се извършат в едно заседание.\n(2) Другите актове на Народното събрание се приемат с едно гласуване.\n(3) Приетите актове се обнародват в „Държавен вестник“ не по-късно от 15 дни след приемането им."},"89":{"ch":"3","verbatim":true,"text":"(1) Една пета от народните представители може да предложи на Народното събрание да гласува недоверие на Министерския съвет. Предложението е прието, когато за него са гласували повече от половината от всички народни представители.\n(2) Когато Народното събрание гласува недоверие на министър-председателя или на Министерския съвет, министър-председателят подава оставката на правителството.\n(3) Когато Народното събрание отхвърли предложението за гласуване на недоверие на Министерския съвет, ново предложение за недоверие на същото основание не може да бъде направено в следващите шест месеца."},"90":{"ch":"3","verbatim":true,"text":"(1) Народните представители имат право на въпроси и на питания до Министерския съвет или до отделни министри, които са длъжни да отговарят.\n(2) По предложение на една пета от народните представители по питането стават разисквания и се приема решение."},"91":{"ch":"3","verbatim":true,"text":"(1) Народното събрание избира Сметна палата, която осъществява контрол за изпълнението на бюджета.\n(2) Организацията, правомощията и редът за дейност на Сметната палата се уреждат със закон."},"91а":{"ch":"3","verbatim":true,"text":"(1) Народното събрание избира омбудсман, който се застъпва за правата и свободите на гражданите.\n(2) Правомощията и дейността на омбудсмана се уреждат със закон."},"92":{"ch":"4","verbatim":true,"text":"(1) Президентът е държавен глава. Той олицетворява единството на нацията и представлява Република България в международните отношения.\n(2) Президентът се подпомага в своята дейност от вицепрезидент."},"93":{"ch":"4","verbatim":true,"text":"(1) Президентът се избира пряко от избирателите за срок от пет години по ред, определен със закон.\n(2) За президент може да бъде избиран български гражданин по рождение, навършил 40 години, който няма друго гражданство, не е поставен под запрещение, не изтърпява наказание лишаване от свобода и е живял последните пет години в страната.\n(3) Избран е кандидатът, получил повече от половината действителни гласове, ако в гласуването са участвали повече от половината избиратели.\n(4) Ако никой от кандидатите не е избран, в седемдневен срок се произвежда нов избор, в който участват двамата кандидати, получили най-много гласове. Избран е кандидатът, получил повече гласове.\n(5) Изборът за нов президент се произвежда не по-рано от три месеца и не по-късно от два месеца преди изтичане на срока на пълномощията на действащия президент.\n(6) Споровете относно законността на избора за президент се решават от Конституционния съд в едномесечен срок след изборите."},"94":{"ch":"4","verbatim":true,"text":"Вицепрезидентът се избира едновременно и в една листа с президента при условията и по реда за избиране на президент."},"95":{"ch":"4","verbatim":true,"text":"(1) Президентът и вицепрезидентът могат да бъдат преизбрани на същата длъжност само за още един мандат.\n(2) Президентът и вицепрезидентът не могат да бъдат народни представители, да изпълняват други държавни, обществени и стопански дейности и да участвуват в ръководството на политически партии."},"97":{"ch":"4","verbatim":true,"text":"(1) Пълномощията на президента и на вицепрезидента се прекратяват предсрочно при:\n1. подаване на оставка пред Конституционния съд;\n2. трайна невъзможност да изпълняват правомощията си поради тежко заболяване;\n3. при условията на чл. 103;\n4. смърт.\n(2) В случаите на т. 1 и 2 пълномощията на президента и вицепрезидента се прекратяват с установяване от Конституционния съд на посочените в тях обстоятелства.\n(3) В случаите на ал. 1 вицепрезидентът встъпва в длъжността президент до края на мандата.\n(4) При невъзможност вицепрезидентът да встъпи в длъжност правомощията на президента се изпълняват от председателя на Народното събрание до избирането на президент и вицепрезидент. В този случай в двумесечен срок се произвеждат избори за президент и вицепрезидент."},"98":{"ch":"4","verbatim":true,"text":"Президентът на републиката:\n1. насрочва избори за Народно събрание и органи на местно самоуправление и определя датата за произвеждане на национален референдум, когато за това има решение на Народното събрание;\n2. отправя обръщения към народа и Народното събрание;\n3. сключва международни договори в случаите, определени със закон;\n4. обнародва законите;\n5. утвърждава промени на границите и центровете на административно-териториалните единици по предложение на Министерския съвет;\n6. назначава и освобождава от длъжност ръководителите на дипломатическите представителства и постоянните представители на Република България при международни организации по предложение на Министерския съвет и приема акредитивните и отзователните писма на чуждестранните дипломатически представители в страната;\n7. назначава и освобождава от длъжност и други държавни служители, определени със закон;\n8. награждава с ордени и медали;\n9. дава и възстановява българско гражданство и освобождава и лишава от него;\n10. предоставя убежище;\n11. упражнява право на помилване;\n12. опрощава несъбираеми държавни вземания;\n13. наименува обекти с национално значение и населени места;\n14. информира Народното събрание по основни въпроси в кръга на своите правомощия."},"99":{"ch":"4","verbatim":true,"text":"(1) Президентът след консултации с парламентарните групи възлага на кандидат за министър-председател, посочен от най-голямата по численост парламентарна група, да състави правителство.\n(2) Когато в 7-дневен срок кандидатът за министър-председател не успее да предложи състав на Министерския съвет, президентът възлага това на посочен от втората по численост парламентарна група кандидат за министър-председател.\n(3) Ако и в този случай не бъде предложен състав на Министерския съвет, президентът в срока по предходната алинея възлага на някоя следваща парламентарна група да посочи кандидат за министър-председател.\n(4) Когато проучвателният мандат е приключил успешно, президентът предлага на Народното събрание да избере кандидата за министър-председател.\n(5) Ако не се постигне съгласие за образуване на правителство, президентът, след консултации с парламентарните групи и по предложение на кандидата за служебен министър-председател, назначава служебно правителство и насрочва нови избори в двумесечен срок. За служебен министър-председател се назначава измежду председателя на Народното събрание, управителя или подуправител на Българската народна банка, председателя или заместник-председател на Сметната палата и омбудсмана или негов заместник.\n(6) Редът за съставяне на правителство по предходните алинеи се прилага и в случаите на чл. 111, ал. 1.\n(7) В случаите на ал. 5 и 6 президентът не може да разпуска Народното събрание през последните три месеца от своя мандат. Ако в този срок парламентът не може да състави правителство, президентът назначава служебно правителство."},"100":{"ch":"4","verbatim":true,"text":"(1) Президентът е върховен главнокомандващ на въоръжените сили на Република България.\n(2) Президентът назначава и освобождава висшия команден състав на въоръжените сили и удостоява с висши военни звания по предложение на Министерския съвет.\n(3) Президентът възглавява Консултативния съвет за национална сигурност, чийто статут се определя със закон.\n(4) Президентът обявява обща или частична мобилизация по предложение на Министерския съвет в съответствие със закона.\n(5) Президентът обявява положение на война при въоръжено нападение срещу страната или при необходимост от неотложно изпълнение на международни задължения, военно или друго извънредно положение, когато Народното събрание не заседава. В тези случаи то се свиква незабавно, за да се произнесе по решението."},"101":{"ch":"4","verbatim":true,"text":"(1) В срока по чл. 88, ал. 3 президентът може мотивирано да върне закона в Народното събрание за ново обсъждане, което не може да му бъде отказано.\n(2) Народното събрание приема повторно закона с мнозинство повече от половината от всички народни представители.\n(3) Повторно приетият от Народното събрание закон се обнародва от президента в 7-дневен срок от получаването му."},"102":{"ch":"4","verbatim":true,"text":"(1) В изпълнение на своите правомощия президентът издава укази, отправя обръщения и послания.\n(2) Указите се приподписват от министър-председателя или от съответния министър.\n(3) Не подлежат на приподписване указите, с които президентът:\n1. назначава служебно правителство;\n2. възлага проучвателен мандат за образуване на правителство;\n3. (отм.);\n4. връща закон, гласуван от Народното събрание, за повторно обсъждане;\n5. определя организацията и реда на дейност на службите към Президентството и назначава персонала;\n6. насрочва избори и референдум;\n7. обнародва законите."},"103":{"ch":"4","verbatim":true,"text":"(1) Президентът и вицепрезидентът не носят отговорност за действията, извършени при изпълнение на своите функции, с изключение на държавна измяна и нарушение на Конституцията.\n(2) Обвинението се повдига по предложение най-малко на една четвърт от народните представители и се поддържа от Народното събрание, ако повече от две трети от народните представители са гласували за това.\n(3) Конституционният съд разглежда обвинението срещу президента или вицепрезидента в едномесечен срок от внасянето на обвинението. Ако бъде установено, че президентът или вицепрезидентът са извършили държавна измяна или са нарушили Конституцията, пълномощията им се прекратяват.\n(4) Президентът и вицепрезидентът не могат да бъдат задържани и срещу тях не може да бъде възбудено наказателно преследване."},"104":{"ch":"4","verbatim":true,"text":"Президентът може да възлага на вицепрезидента правомощията си по чл. 98, т. 7, 9, 10 и 11."},"105":{"ch":"5","verbatim":true,"text":"(1) Министерският съвет ръководи и осъществява вътрешната и външната политика на страната в съответствие с Конституцията и законите.\n(2) Министерският съвет осигурява обществения ред и националната сигурност и осъществява общото ръководство на държавната администрация и на Въоръжените сили.\n(3) Министерският съвет информира Народното събрание по въпроси, отнасящи се до задълженията, произтичащи за Република България от нейното членство в Европейския съюз.\n(4) Когато участва в разработването и приемането на актове на Европейския съюз, Министерският съвет информира предварително Народното събрание и дава отчет за своите действия."},"106":{"ch":"5","verbatim":true,"text":"Министерският съвет ръководи изпълнението на държавния бюджет; организира стопанисването на държавното имущество; сключва, утвърждава и денонсира международни договори в случаите, предвидени в закона."},"107":{"ch":"5","verbatim":true,"text":"Министерският съвет отменя незаконосъобразните или неправилните актове на министрите."},"108":{"ch":"5","verbatim":true,"text":"(1) Министерският съвет се състои от министър-председател, заместник министър-председатели и министри.\n(2) Министър-председателят ръководи и координира общата политика на правителството и носи отговорност за нея. Той назначава и освобождава от длъжност заместник-министрите.\n(3) Министрите ръководят отделни министерства освен ако Народното събрание реши друго. Те носят отговорност за своите действия."},"111":{"ch":"5","verbatim":true,"text":"(1) Правомощията на Министерския съвет се прекратяват:\n1. с гласуване на недоверие на Министерския съвет или на министър-председателя;\n2. с приемане на оставката на Министерския съвет или на министър-председателя;\n3. при смърт на министър-председателя.\n(2) Министерският съвет подава оставка пред новоизбраното Народно събрание.\n(3) В случаите по предходните алинеи Министерският съвет изпълнява функциите си до избирането на нов Министерски съвет."},"112":{"ch":"5","verbatim":true,"text":"(1) Министерският съвет може да поиска Народното събрание да му гласува доверие по цялостната политика, по програмата или по конкретен повод. Решението се приема с мнозинство повече от половината от присъстващите народни представители.\n(2) Когато Министерският съвет не получи исканото доверие, министър-председателят подава оставката на правителството."},"114":{"ch":"5","verbatim":true,"text":"Въз основа и в изпълнение на законите Министерският съвет приема постановления, разпореждания и решения. С постановления Министерският съвет приема и правилници и наредби."},"117":{"ch":"6","verbatim":true,"text":"(1) Съдебната власт защитава правата и законните интереси на гражданите, юридическите лица и държавата.\n(2) Съдебната власт е независима и неин основен носител е съдът. Прокуратурата и следствените органи са в системата на съдебната власт. При осъществяване на своите функции съдиите, съдебните заседатели, прокурорите и следователите се подчиняват само на закона.\n(3) Съдебната власт има самостоятелен бюджет."},"120":{"ch":"6","verbatim":true,"text":"(1) Съдилищата осъществяват контрол за законност на актове и действия на административните органи.\n(2) Гражданите и юридическите лица могат да обжалват всички административни актове, които ги засягат освен изрично посочените със закон."},"121":{"ch":"6","verbatim":true,"text":"(1) Съдилищата осигуряват равенство и условия за състезателност на страните в съдебния процес.\n(2) Производството по делата осигурява установяването на истината.\n(3) Разглеждането на делата във всички съдилища е публично, освен когато законът предвижда друго.\n(4) Актовете на правораздаването се мотивират."},"124":{"ch":"6","verbatim":true,"text":"Върховният касационен съд осъществява върховен съдебен надзор за точно и еднакво прилагане на законите от всички съдилища."},"125":{"ch":"6","verbatim":true,"text":"(1) Върховният административен съд осъществява върховен съдебен надзор за точното и еднакво прилагане на законите в административното правораздаване.\n(2) Върховният административен съд се произнася по спорове за законността на актовете на Министерския съвет и на министрите, както и на други актове, посочени в закона."},"126":{"ch":"6","verbatim":true,"text":"(1) Структурата на прокуратурата е в съответствие с тази на съдилищата, които разглеждат наказателни дела.\n(2) Главният прокурор осъществява надзор за законност и методическо ръководство върху дейността на всички прокурори.\n(3) Обявена за противоконституционна с Решение № 13 на КС от 2024 г.","note":"Ал. 3 (нова от 2023 г.) е обявена за противоконституционна."},"127":{"ch":"6","verbatim":true,"text":"Прокуратурата следи за спазване на законността, като:\n1. ръководи разследването и упражнява надзор за законосъобразното му провеждане;\n2. може да извършва разследване;\n3. привлича към отговорност лицата, които са извършили престъпления, и поддържа обвинението по наказателни дела от общ характер;\n4. упражнява надзор при изпълнение на наказателните и други принудителни мерки;\n5. предприема действия за оспорване на незаконосъобразни актове пред съда в случаите, предвидени в закон;\n6. освен по наказателните дела от общ характер, в предвидените със закон случаи участва и в други дела в защита на значим обществен интерес или в интерес на лица, които се нуждаят от специална закрила."},"129":{"ch":"6","verbatim":true,"text":"(1) Съдиите, прокурорите и следователите се назначават, повишават, понижават, преместват и освобождават от длъжност от съдийската, съответно прокурорската колегия на Висшия съдебен съвет.\n(2) Председателят на Върховния касационен съд, председателят на Върховния административен съд и главният прокурор се назначават и освобождават от президента на републиката по предложение на пленума на Висшия съдебен съвет за срок от седем години без право на повторно избиране. Президентът не може да откаже назначаването или освобождаването при повторно направено предложение.\n(3) С навършване на петгодишен стаж като съдия, прокурор или следовател и след атестиране, с решение на съдийската, съответно прокурорската колегия на Висшия съдебен съвет, съдиите, прокурорите и следователите стават несменяеми. Те, включително лицата по ал. 2, се освобождават от длъжност само при: 1. навършване на 65-годишна възраст; 2. подаване на оставка; 3. влизане в сила на присъда, с която е наложено наказание лишаване от свобода за умишлено престъпление; 4. трайна фактическа невъзможност да изпълняват задълженията си за повече от една година; 5. тежко нарушение или системно неизпълнение на служебните задължения, както и действия, които накърняват престижа на съдебната власт.","note":"Показани са ал. 1–3. Ал. 4 е обявена за противоконституционна с Решение № 7 на КС от 2006 г."},"130":{"ch":"6","verbatim":true,"text":"(1) Висшият съдебен съвет се състои от 25 членове. Председателят на Върховния касационен съд, председателят на Върховния административен съд и главният прокурор са по право негови членове.\n(2) За членове на Висшия съдебен съвет, които не са негови членове по право, се избират юристи с високи професионални и нравствени качества, които имат най-малко петнадесетгодишен юридически стаж.\n(3) Единадесет от членовете на Висшия съдебен съвет се избират от Народното събрание с мнозинство две трети от народните представители и единадесет – от органите на съдебната власт. Членовете на Висшия съдебен съвет се избират при условията на чл. 130а, ал. 3 и 4 и по ред, определен със закон.\n(4) Мандатът на изборните членове на Висшия съдебен съвет е пет години. Те не могат да бъдат преизбирани веднага след изтичане на този срок.\n…\n(8) Мандатът на изборен член на Висшия съдебен съвет се прекратява при: 1. подаване на оставка; 2. влязъл в сила съдебен акт за извършено престъпление; 3. трайна фактическа невъзможност да изпълнява задълженията си за повече от една година; 4. дисциплинарно освобождаване от длъжност или лишаване от право да упражнява юридическа професия или дейност.\n(9) При прекратяване на мандата на изборен член на Висшия съдебен съвет на негово място се избира друг от съответната квота, който довършва мандата."},"130а":{"ch":"6","verbatim":true,"text":"(1) Висшият съдебен съвет осъществява правомощията си чрез пленум, съдийска и прокурорска колегия.\n(2) Пленумът се състои от всички членове на Висшия съдебен съвет. Пленумът на Висшия съдебен съвет: 1. приема проекта на бюджета на съдебната власт; 2. приема решение за прекратяване на мандата на изборен член на Висшия съдебен съвет при условията на чл. 130, ал. 8; 3. организира квалификацията на съдиите, прокурорите и следователите; 4. решава общи за съдебната власт организационни въпроси; 5. изслушва и приема годишните доклади по чл. 84, т. 16; 6. управлява недвижимите имоти на съдебната власт; 7. прави предложение до президента на републиката за назначаване и освобождаване на председателя на Върховния касационен съд, председателя на Върховния административен съд и главния прокурор; 8. осъществява и други правомощия, определени със закон.\n(3) Съдийската колегия на Висшия съдебен съвет се състои от 14 членове и включва председателите на Върховния касационен съд и на Върховния административен съд, шестима членове, избрани пряко от съдиите, и шестима членове, избрани от Народното събрание.\n(4) Прокурорската колегия на Висшия съдебен съвет се състои от 11 членове и включва главния прокурор, четирима членове, избрани пряко от прокурорите, един член, избран пряко от следователите, и петима членове, избрани от Народното събрание.\n(5) Колегиите в съответствие със своята професионална насоченост: 1. назначават, повишават, преместват и освобождават от длъжност съдиите, прокурорите и следователите; 2. правят периодични атестации на съдиите, прокурорите, следователите и административните ръководители в органите на съдебната власт и решават въпроси за придобиване и възстановяване на несменяемост; 3. налагат дисциплинарните наказания понижаване и освобождаване от длъжност на съдиите, прокурорите, следователите и административните ръководители в органите на съдебната власт; 4. назначават и освобождават административните ръководители в органите на съдебната власт; 5. решават въпроси за организацията на дейността на съответната система от органи на съдебната власт; 6. осъществяват и други правомощия, определени със закон."},"130б":{"ch":"6","verbatim":true,"text":"(1) Заседанията на пленума на Висшия съдебен съвет се председателстват от министъра на правосъдието. Той не участва в гласуването.\n(2) Съдийската колегия на Висшия съдебен съвет се председателства от председателя на Върховния касационен съд. Прокурорската колегия на Висшия съдебен съвет се председателства от главния прокурор. Министърът на правосъдието може да присъства на заседанията, като не участва в гласуването.\n(3) Главният инспектор може да присъства на заседанията на пленума на Висшия съдебен съвет и на заседанията на съдийската и прокурорската колегия на Висшия съдебен съвет, като не участва в гласуването."},"130в":{"ch":"6","verbatim":true,"text":"Министърът на правосъдието:\n1. предлага проект на бюджет на съдебната власт и го внася във Висшия съдебен съвет;\n2. (отм.);\n3. може да прави предложения за назначаване, повишаване, понижаване, преместване и освобождаване от длъжност на съдии, прокурори и следователи;\n4. участва в управлението на съдебното обучение;\n5. (отм.)."},"132а":{"ch":"6","verbatim":true,"text":"(1) Към Висшия съдебен съвет се създава Инспекторат, който се състои от главен инспектор и десет инспектори.\n(2) Главният инспектор се избира от Народното събрание с мнозинство две трети от народните представители за срок от пет години.\n(3) Инспекторите се избират от Народното събрание за срок от четири години по реда на ал. 2.\n(4) Главният инспектор и инспекторите могат да бъдат преизбирани на същата длъжност само за още един мандат.\n(5) Бюджетът на Инспектората се приема от Народното събрание в рамките на бюджета на съдебната власт.\n(6) Инспекторатът проверява дейността на органите на съдебната власт, без да засяга независимостта на съдиите, съдебните заседатели, прокурорите и следователите при осъществяването на техните функции. Инспекторатът извършва проверки за почтеност и конфликт на интереси на съдии, прокурори и следователи, на имуществените им декларации, както и за установяване на действия, които накърняват престижа на съдебната власт, и такива, свързани с нарушаване на независимостта на съдиите, прокурорите и следователите. Главният инспектор и инспекторите при осъществяване на функциите си са независими и се подчиняват само на закона.\n(7) Инспекторатът действа служебно, по инициатива на граждани, юридически лица или държавни органи, включително на съдии, прокурори и следователи.\n(8) Инспекторатът представя годишен доклад за дейността си на Висшия съдебен съвет.\n(9) Инспекторатът отправя сигнали, предложения и доклади до други държавни органи, включително и до компетентните органи на съдебната власт. Инспекторатът предоставя публично информация за дейността си.\n(10) Условията и редът за избиране и освобождаване на главния инспектор и на инспекторите, както и организацията и дейността на Инспектората се уреждат със закон."},"138":{"ch":"7","verbatim":true,"text":"Орган на местното самоуправление в общината е общинският съвет, който се избира от населението на съответната община за срок от четири години по ред, определен със закон."},"139":{"ch":"7","verbatim":true,"text":"(1) Орган на изпълнителната власт в общината е кметът. Той се избира от населението или от общинския съвет за срок от четири години по ред, определен със закон.\n(2) В своята дейност кметът се ръководи от закона, актовете на общинския съвет и решенията на населението."},"143":{"ch":"7","verbatim":false,"text":"(1) Областта се управлява от областен управител, подпомаган от областна администрация. (2) Областният управител се назначава от Министерския съвет. (3) Областният управител осигурява провеждането на държавната политика, отговаря за защитата на националните интереси, на законността и обществения ред и осъществява административен контрол."},"144":{"ch":"7","verbatim":false,"text":"Централните държавни органи и техните представители по места осъществяват контрол за законосъобразност върху актовете на органите на местното самоуправление само когато това е предвидено със закон."},"147":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд се състои от 12 съдии, от които една трета се избират от Народното събрание, една трета се назначават от президента и една трета се избират от общото събрание на съдиите от Върховния касационен съд и Върховния административен съд. (2) Съдиите се избират за девет години и не могат да бъдат преизбирани; съставът се обновява всеки три години от всяка квота по ред, определен със закон. (3) Юристи с високи професионални и нравствени качества и най-малко 15 години юридически стаж. (4) Съдиите избират председател на съда с тайно гласуване за срок от три години. (5) Длъжността е несъвместима с представителен мандат, държавна или обществена длъжност, членство в партия или синдикат, свободна, търговска или друга платена професионална дейност. (6) Съдиите имат имунитета на народните представители."},"148":{"ch":"8","verbatim":false,"text":"Мандатът на конституционен съдия се прекратява при изтичане на срока, оставка, влязла в сила присъда за умишлено престъпление, трайна невъзможност, несъвместимост и смърт. Имунитетът се снема и трайната невъзможност се установява от КС с тайно гласуване и мнозинство две трети от всички съдии."},"149":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд: 1. дава задължителни тълкувания на Конституцията; 2. произнася се по искане за установяване на противоконституционност на законите и на другите актове на Народното събрание, както и на актовете на президента; 3. решава спорове за компетентност между Народното събрание, президента и Министерския съвет, както и между органите на местното самоуправление и централните изпълнителни органи; 4. произнася се за съответствието на сключените международни договори с Конституцията преди ратификацията им, както и за съответствие на законите с общопризнатите норми на международното право и с международните договори; 5. произнася се по спорове за конституционността на политическите партии и сдружения; 6. произнася се по спорове за законността на избора на президент и вицепрезидент; 7. произнася се по спорове за законността на избора на народен представител; 8. произнася се по обвинения, повдигнати от Народното събрание срещу президента и вицепрезидента. (2) Със закон не могат да се създават или отнемат правомощия на Конституционния съд."},"150":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд действа по инициатива на не по-малко от една пета от народните представители, на президента, на Министерския съвет, на Върховния касационен съд, на Върховния административен съд и на главния прокурор; по спорове за компетентност по чл. 149, ал. 1, т. 3 – и на общинските съвети. (2) Всеки съд, по искане на страна по делото или по свой почин, може да сезира Конституционния съд, когато установи несъответствие между приложимия закон и Конституцията. (3) Обявена за противоконституционна с Решение № 13 на КС от 2024 г. (4) Омбудсманът може да сезира съда с искане за установяване на противоконституционност на закон, с който се нарушават права и свободи на гражданите. (5) Висшият адвокатски съвет може да сезира съда на същото основание.","note":"Ал. 2 („всеки съд“) е от изменението от 2023 г. и е в сила; ал. 3 е обявена за противоконституционна."},"151":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд приема решения с мнозинство повече от половината от всички съдии. (2) Решенията се обнародват в „Държавен вестник“ в 15-дневен срок от приемането им и влизат в сила три дни след обнародването; обявеният за противоконституционен акт не се прилага от деня на влизането в сила на решението. (3) Противоконституционността на част от закона не засяга останалата му част."},"153":{"ch":"9","verbatim":false,"text":"Народното събрание може да изменя и допълва всички разпоредби на Конституцията с изключение на тези, които са от компетентност на Великото Народно събрание."},"154":{"ch":"9","verbatim":false,"text":"(1) Право на инициатива за изменение на Конституцията имат една четвърт от народните представители и президентът. (2) Предложението се разглежда от Народното събрание не по-рано от един месец и не по-късно от три месеца от постъпването му."},"155":{"ch":"9","verbatim":false,"text":"(1) Народното събрание приема закон за изменение на Конституцията с мнозинство три четвърти от всички народни представители на три гласувания в различни дни. (2) Когато предложението получи по-малко от три четвърти, но повече от две трети от гласовете, то може да бъде подложено на ново обсъждане не по-рано от два и не по-късно от пет месеца; при новото гласуване се приема с мнозинство две трети от всички народни представители."},"156":{"ch":"9","verbatim":false,"text":"Законът за изменение на Конституцията се подписва и обнародва в „Държавен вестник“ от председателя на Народното събрание в седемдневен срок от приемането му."},"157":{"ch":"9","verbatim":false,"text":"Великото Народно събрание се състои от 400 народни представители, избрани по общия ред."},"158":{"ch":"9","verbatim":false,"text":"Великото Народно събрание: 1. приема нова Конституция; 2. решава въпроса за изменение на територията на Република България и ратифицира международни договори, предвиждащи такова изменение; 3. решава въпросите за промени във формата на държавно устройство и на държавно управление; 4. решава въпросите за изменение на чл. 5, ал. 2 и 4 и на чл. 57, ал. 1 и 3; 5. решава въпросите за изменение и допълнение на глава девета."},"159":{"ch":"9","verbatim":false,"text":"(1) Право на инициатива по чл. 158 имат не по-малко от половината народни представители и президентът. (2) Проектът се обсъжда от Народното събрание не по-рано от два и не по-късно от пет месеца от постъпването му."},"160":{"ch":"9","verbatim":false,"text":"(1) Народното събрание решава да се произведат избори за Велико Народно събрание с мнозинство две трети от всички народни представители. (2) Изборите се насрочват от президента в тримесечен срок. (3) С произвеждането на изборите се прекратяват пълномощията на Народното събрание."},"161":{"ch":"9","verbatim":false,"text":"Великото Народно събрание приема решения по внесения проект с мнозинство две трети от всички народни представители на три гласувания в различни дни."},"162":{"ch":"9","verbatim":false,"text":"(1) Великото Народно събрание решава само въпросите, за които е избрано. (2) При неотложни случаи изпълнява и функциите на обикновено Народно събрание. (3) Пълномощията му се прекратяват след като реши въпросите, за които е избрано; президентът насрочва избори по реда на закона."},"163":{"ch":"9","verbatim":false,"text":"Актовете на Великото Народно събрание се подписват и обнародват от неговия председател в седемдневен срок от приемането им."}}}};
const G = DATA.gov, C = DATA.const;
const NODES = G.nodes, EDGES = G.edges, ET = G.edgeTypes, BR = G.branches, PL = G.publicityLevels;
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const edgeById = Object.fromEntries(EDGES.map(e => [e.id, e]));
const ART_RE = /чл\.\s*(\d+[а-я]?)/g;
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const arts = ref => [...String(ref || '').matchAll(ART_RE)].map(m => m[1]);

const state = { group: null, sel: null, hover: null, scn: null, art: null, hidden: new Set(), color: 'branch', tab: 'info' };

// ---------- links to the Constitution ----------
function officialUrl(key) {
  return C.source.official + '#:~:text=' + encodeURIComponent('Чл. ' + key + '.');
}
function refHtml(ref, law) {
  let h = '';
  if (ref) h += String(ref).split(';').map(p => p.trim()).filter(Boolean).map(p => {
    const k = arts(p)[0];
    return k ? `<a class="art" data-art="${esc(k)}" title="Покажи текста на чл. ${esc(k)}">${esc(p)}</a>` : `<span class="law">${esc(p)}</span>`;
  }).join('');
  if (law) h += `<span class="law" title="Уредено в закон, не в Конституцията">${esc(law)}</span>`;
  return h ? `<span class="refs">${h}</span>` : '';
}

// ---------- citation index ----------
const CITED = {};
function cite(ref, item) { for (const k of arts(ref)) (CITED[k] ||= []).push(item); }
for (const n of NODES) {
  const it = { kind: 'node', id: n.id, label: n.label };
  cite(n.refs, it); cite(n.pub?.ref, it);
  for (const p of n.powers || []) cite(p.ref, it);
}
for (const e of EDGES) cite(e.ref, { kind: 'edge', id: e.id, label: `${byId[e.from].label} → ${byId[e.to].label}` });
for (const s of G.scenarios) for (const st of s.steps) cite(st.ref, { kind: 'scn', id: s.id, label: 'Сценарий: ' + s.title });

function renderScn() {
  const p = $('#p-scn');
  const cur = state.scn && G.scenarios.find(s => s.id === state.scn.id);
  let h = `<p class="small muted">Изберете процедура. Натиснете кутия от схемата на процедурата, за да видите текста и участниците; те светят и на голямата схема. Стрелките ← → минават по първия изход.</p>`;
  h += `<div class="scnpick">${G.scenarios.map(s => `<button class="pick${cur?.id === s.id ? ' on' : ''}" data-scn="${s.id}">${esc(s.title)}</button>`).join('')}</div>`;
  if (cur) {
    // rows: main steps in order; a side step sits on the row of the first step that leads to it
    const rowOf = {}, sideOn = {};
    let row = 0;
    cur.steps.forEach((st, i) => {
      if (st.side) return;
      rowOf[i] = row++;
      for (const nx of stepNext(cur, i)) {
        const t = cur.steps[nx.to];
        if (t?.side && rowOf[nx.to] === undefined && !sideOn[rowOf[i]]) { rowOf[nx.to] = rowOf[i]; sideOn[rowOf[i]] = true; }
      }
    });
    cur.steps.forEach((st, i) => { if (rowOf[i] === undefined) rowOf[i] = row++; });
    h += `<div class="flegend"><span><i style="border-color:#8c877d"></i>действие</span><span><i style="border-color:#c98a1b;background:#fff8e6;border-radius:6px"></i>въпрос / решение</span><span><i style="border-color:#2e6b3a;background:#eef6ef;border-width:2.5px"></i>край</span></div>`;
    h += `<div class="fchart" id="flow">${cur.steps.map((st, i) => `<div class="fbox k-${st.kind}${st.side ? ' side' : ''}${i === state.scn.i ? ' on' : ''}" data-i="${i}" data-row="${rowOf[i]}" style="grid-row:${rowOf[i] + 1};grid-column:${st.side ? 2 : 1}"><span class="n">${i + 1}</span>${esc(st.title)}</div>`).join('')}</div>`;
    const st = cur.steps[state.scn.i];
    h += `<div class="step"><b>${state.scn.i + 1}. ${esc(st.title)}</b><p>${esc(st.text)}</p><p>${refHtml(st.ref)}</p><p class="small">${st.nodes.map(who).join(' · ')}</p>
      ${stepNext(cur, state.scn.i).length ? `<div class="small">Следва: ${stepNext(cur, state.scn.i).map(nx => `<a href="#" class="goto" data-i="${nx.to}">${nx.label ? esc(nx.label) + ' → ' : ''}${esc(cur.steps[nx.to].title)}</a>`).join(' · ')}</div>` : '<div class="small muted">Край на процедурата.</div>'}</div>${articleBlocks(st.ref)}`;
  }
  p.innerHTML = h;
  p.querySelectorAll('[data-scn]').forEach(b => b.addEventListener('click', () => { state.scn = { id: b.dataset.scn, i: 0 }; state.sel = null; renderScn(); paint(); }));
  p.querySelectorAll('.fbox, a.goto').forEach(b => b.addEventListener('click', ev => { ev.preventDefault(); state.scn.i = +b.dataset.i; renderScn(); paint(); }));
  if (cur) requestAnimationFrame(() => drawFlow(cur));
}
function drawFlow(sc) {
  const flow = $('#flow'); if (!flow) return;
  const base = flow.getBoundingClientRect();
  const R = {};
  flow.querySelectorAll('.fbox').forEach(b => { const r = b.getBoundingClientRect(); R[b.dataset.i] = { l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top, cx: (r.left + r.right) / 2 - base.left, cy: (r.top + r.bottom) / 2 - base.top, side: b.classList.contains('side'), row: +b.dataset.row }; });
  const svgf = document.createElementNS(SVGNS, 'svg');
  svgf.setAttribute('class', 'fl'); svgf.setAttribute('width', base.width); svgf.setAttribute('height', base.height);
  svgf.innerHTML = `<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b6760"/></marker></defs>`;
  let lane = 0;
  const path = (d, label, lx, ly, anchor = 'start') => {
    svgf.insertAdjacentHTML('beforeend', `<path d="${d}" fill="none" stroke="#6b6760" stroke-width="1.4" marker-end="url(#fa)"/>`
      + (label ? `<text x="${lx}" y="${ly}" font-size="10.5" fill="#8a4a06" font-weight="600" text-anchor="${anchor}" paint-order="stroke" stroke="#fffdf8" stroke-width="3">${esc(label)}</text>` : ''));
  };
  sc.steps.forEach((st, i) => {
    const a = R[i];
    for (const nx of stepNext(sc, i)) {
      const b = R[nx.to]; if (!b) continue;
      const L = nx.label || '';
      if (!a.side && !b.side && b.row === a.row + 1) {            // straight down
        path(`M${a.cx},${a.b} L${b.cx},${b.t - 1}`, L, a.cx + 5, a.b + 13);
      } else if (!a.side && b.side && b.row === a.row) {                              // across to the side
        const y = Math.min(Math.max(a.cy, b.t + 8), b.b - 8);
        path(`M${a.r},${y} L${b.l - 1},${y}`, L, a.r + 3, y - 4);
      } else if (!a.side && b.side) {                                              // side, lower row
        path(`M${a.r},${a.cy} L${b.cx},${a.cy} L${b.cx},${b.cy < a.cy ? b.b + 1 : b.t - 1}`, L, a.r + 3, a.cy - 4);
      } else if (a.side && !b.side) {                                              // back from the side
        const y = b.t > a.b ? b.cy : b.cy;
        path(`M${a.cx},${a.b} L${a.cx},${y} L${b.r + 1},${y}`, L, a.cx - 4, a.b + 12, 'end');
      } else {                                                                     // jump via the left gutter
        const x = 34 - (lane++ % 3) * 7;
        path(`M${a.l},${a.cy} L${x},${a.cy} L${x},${b.cy} L${b.l - 1},${b.cy}`, L, a.l - 3, a.cy - 4, 'end');
      }
    }
  });
  flow.prepend(svgf);
}
addEventListener('resize', () => { if (state.tab === 'scn' && state.scn) drawFlow(G.scenarios.find(s => s.id === state.scn.id)); });
document.addEventListener('keydown', ev => {
  if (state.tab !== 'scn' || !state.scn || ev.target.closest('input,select')) return;
  const sc = G.scenarios.find(s => s.id === state.scn.id);
  if (ev.key === 'ArrowRight') { const nx = stepNext(sc, state.scn.i)[0]; if (nx) { state.scn.i = nx.to; renderScn(); paint(); } }
  if (ev.key === 'ArrowLeft' && state.scn.i > 0) { state.scn.i--; renderScn(); paint(); }
});

// ---------- terms ----------
function renderTerms() {
  const list = NODES.filter(n => n.termYears).sort((a, b) => b.termYears - a.termYears);
  const max = 10;
  $('#p-terms').innerHTML = `<p class="small muted">Дълъг мандат значи по-малко зависимост от текущото мнозинство. Мандатите, разминаващи се с 4-годишния мандат на НС, позволяват едно мнозинство да „наследи“ органи, избрани от предишно.</p>
    <div class="term"><span></span><span class="small muted" style="display:flex;justify-content:space-between">${[0, 2, 4, 6, 8, 10].map(x => `<span>${x}</span>`).join('')}</span></div>
    ${list.map(n => `<div class="term"><span class="nm who" data-node="${n.id}">${esc(n.label)}</span><span class="tr"><span class="tb" style="width:${n.termYears / max * 100}%;background:${BR[n.branch].color}"></span><span class="tl">${n.termYears} г.</span></span></div>`).join('')}
    <h3>Подробно</h3>
    ${list.concat(NODES.filter(n => !n.termYears && n.term !== '—')).map(n => `<div class="pubrow">${who(n.id)}: ${esc(n.term)}${n.termLaw ? ' <span class="law">по закон</span>' : ''} ${refHtml(n.refs)}</div>`).join('')}`;
}

// ---------- publicity ----------
function renderPub() {
  let h = `<p class="small muted">Колко открито работи всяка институция: дали заседанията са публични и къде се обнародват актовете. „Цвят: по публичност“ оцветява схемата по същия признак.</p>`;
  for (const [lv, l] of Object.entries(PL)) {
    const list = NODES.filter(n => n.pub.level === lv);
    h += `<h3><span class="dot" style="background:${l.color}"></span>${esc(l.label)} (${list.length})</h3>`;
    h += list.map(n => `<div class="pubrow">${who(n.id)}<br><span class="small">${esc(n.pub.text)}</span> ${refHtml(n.pub.ref, n.pub.law)}</div>`).join('');
  }
  $('#p-pub').innerHTML = h;
}

// ---------- majorities ----------
function renderMaj() {
  const w = 380, x = n => 8 + n / 240 * (w - 16);
  let bar = `<svg viewBox="0 0 ${w} 74" width="100%" role="img" aria-label="Мнозинства в 240-местното Народно събрание"><rect x="8" y="30" width="${w - 16}" height="16" rx="3" fill="#e5eef7" stroke="#b9cde2"/>`;
  G.majorities.forEach((m, i) => {
    const up = i % 2 === 0;
    bar += `<line x1="${x(m.n)}" y1="${up ? 22 : 30}" x2="${x(m.n)}" y2="${up ? 46 : 54}" stroke="#0b4f8a" stroke-width="1.5"/><text x="${x(m.n)}" y="${up ? 16 : 68}" text-anchor="middle" font-size="11" font-weight="700" fill="#0b4f8a">${m.n}</text>`;
  });
  bar += `<text x="8" y="68" font-size="10" fill="#6b6760">0</text><text x="${w - 8}" y="68" font-size="10" fill="#6b6760" text-anchor="end">240</text></svg>`;
  $('#p-maj').innerHTML = `<p class="small muted">Праговете в Народното събрание (240 места). „От всички“ значи от 240, независимо колко са в залата.</p>${bar}
    ${G.majorities.map(m => `<div class="maj"><div><b>${m.n}</b><br><span class="small muted">${esc(m.label)}</span></div><div>${esc(m.what)}<br>${refHtml(m.ref)}</div></div>`).join('')}
    <p class="small muted">Обикновените закони се приемат с мнозинство от присъстващите при кворум над половината ${refHtml('чл. 81')}.</p>`;
}

// ---------- constitution ----------
let constQuery = '';
function renderConst(scrollTo) {
  const p = $('#p-const');
  const keys = Object.keys(C.articles).sort((a, b) => parseInt(a) - parseInt(b) || a.localeCompare(b, 'bg'));
  const q = constQuery.trim().toLowerCase();
  let h = `<div class="src">${esc(C.source.title)}, ${esc(C.source.version)}.<br><a class="ext" href="${C.source.official}" target="_blank" rel="noopener">Официален текст (parliament.bg) ↗</a> · <a class="ext" href="${C.source.consolidated}" target="_blank" rel="noopener">консолидиран PDF ↗</a> · <a class="ext" href="${C.source.english}" target="_blank" rel="noopener">English ↗</a><br><span class="muted">${esc(C.source.note)}</span></div>
    <p><input type="search" id="cq" placeholder="Търси в членовете: напр. недоверие, 99, прокурор" value="${esc(constQuery)}"></p>
    <p class="small muted">Изберете член, за да светнат институциите и връзките, които се позовават на него.</p>`;
  let lastCh = null, shown = 0;
  for (const k of keys) {
    const a = C.articles[k];
    if (q && !(('чл. ' + k).includes(q) || k === q || a.text.toLowerCase().includes(q))) continue;
    if (a.ch !== lastCh) { h += `<div class="chap">${esc(C.chapters[a.ch])}</div>`; lastCh = a.ch; }
    const cited = CITED[k] || [];
    const uniq = [...new Map(cited.map(c => [c.kind + c.id, c])).values()];
    h += `<div class="article${state.art === k ? ' hi' : ''}" id="art-${k}"><div class="hd"><b data-pick="${k}">Чл. ${esc(k)}</b><span class="badge muted">${a.verbatim ? 'Текст' : 'Резюме'}</span><a class="ext" href="${officialUrl(k)}" target="_blank" rel="noopener">официален текст ↗</a></div>
      <div class="tx">${esc(a.text)}</div>${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}
      ${uniq.length ? `<div class="cited">Цитиран в: ${uniq.map(c => c.kind === 'node' ? who(c.id) : c.kind === 'edge' ? `<span class="who" data-edge="${c.id}">${esc(c.label)}</span>` : esc(c.label)).join(' · ')}</div>` : ''}</div>`;
    shown++;
  }
  if (!shown) h += '<p class="muted">Няма съвпадения.</p>';
  p.innerHTML = h;
  const cq = $('#cq');
  cq.addEventListener('input', () => { constQuery = cq.value; renderConst(); const c = $('#cq'); c.focus(); c.setSelectionRange(c.value.length, c.value.length); });
  p.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { state.art = state.art === b.dataset.pick ? null : b.dataset.pick; renderConst(); paint(); }));
  if (scrollTo) document.getElementById('art-' + scrollTo)?.scrollIntoView({ block: 'start' });
}
function openArticle(k) {
  constQuery = '';
  setTab('const');
  state.art = k; renderConst(k); paint();
}

// ---------- delegated clicks ----------
document.addEventListener('click', ev => {
  const a = ev.target.closest('a.art, .article .hd b[data-art]');
  if (a) { ev.preventDefault(); openArticle(a.dataset.art); return; }
  const w = ev.target.closest('[data-node]');
  if (w) { ev.preventDefault(); select({ kind: 'node', id: w.dataset.node }); return; }
  const gq = ev.target.closest('[data-group]');
  if (gq) { ev.preventDefault(); selectGroup(gq.dataset.group); return; }
  const ed = ev.target.closest('[data-edge]');
  if (ed) { ev.preventDefault(); select({ kind: 'edge', id: ed.dataset.edge }); return; }
  if (ev.target.closest('a.back')) { ev.preventDefault(); select(null); }
});

renderFilters(); colorNodes(); renderInfo(); paint();
</script>
