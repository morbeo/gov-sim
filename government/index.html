оловината от всички народни представители.\n(3) Повторно приетият от Народното събрание закон се обнародва от президента в 7-дневен срок от получаването му."},"102":{"ch":"4","verbatim":true,"text":"(1) В изпълнение на своите правомощия президентът издава укази, отправя обръщения и послания.\n(2) Указите се приподписват от министър-председателя или от съответния министър.\n(3) Не подлежат на приподписване указите, с които президентът:\n1. назначава служебно правителство;\n2. възлага проучвателен мандат за образуване на правителство;\n3. (отм.);\n4. връща закон, гласуван от Народното събрание, за повторно обсъждане;\n5. определя организацията и реда на дейност на службите към Президентството и назначава персонала;\n6. насрочва избори и референдум;\n7. обнародва законите."},"103":{"ch":"4","verbatim":true,"text":"(1) Президентът и вицепрезидентът не носят отговорност за действията, извършени при изпълнение на своите функции, с изключение на държавна измяна и нарушение на Конституцията.\n(2) Обвинението се повдига по предложение най-малко на една четвърт от народните представители и се поддържа от Народното събрание, ако повече от две трети от народните представители са гласували за това.\n(3) Конституционният съд разглежда обвинението срещу президента или вицепрезидента в едномесечен срок от внасянето на обвинението. Ако бъде установено, че президентът или вицепрезидентът са извършили държавна измяна или са нарушили Конституцията, пълномощията им се прекратяват.\n(4) Президентът и вицепрезидентът не могат да бъдат задържани и срещу тях не може да бъде възбудено наказателно преследване."},"104":{"ch":"4","verbatim":true,"text":"Президентът може да възлага на вицепрезидента правомощията си по чл. 98, т. 7, 9, 10 и 11."},"105":{"ch":"5","verbatim":true,"text":"(1) Министерският съвет ръководи и осъществява вътрешната и външната политика на страната в съответствие с Конституцията и законите.\n(2) Министерският съвет осигурява обществения ред и националната сигурност и осъществява общото ръководство на държавната администрация и на Въоръжените сили.\n(3) Министерският съвет информира Народното събрание по въпроси, отнасящи се до задълженията, произтичащи за Република България от нейното членство в Европейския съюз.\n(4) Когато участва в разработването и приемането на актове на Европейския съюз, Министерският съвет информира предварително Народното събрание и дава отчет за своите действия."},"106":{"ch":"5","verbatim":true,"text":"Министерският съвет ръководи изпълнението на държавния бюджет; организира стопанисването на държавното имущество; сключва, утвърждава и денонсира международни договори в случаите, предвидени в закона."},"107":{"ch":"5","verbatim":true,"text":"Министерският съвет отменя незаконосъобразните или неправилните актове на министрите."},"108":{"ch":"5","verbatim":true,"text":"(1) Министерският съвет се състои от министър-председател, заместник министър-председатели и министри.\n(2) Министър-председателят ръководи и координира общата политика на правителството и носи отговорност за нея. Той назначава и освобождава от длъжност заместник-министрите.\n(3) Министрите ръководят отделни министерства освен ако Народното събрание реши друго. Те носят отговорност за своите действия."},"111":{"ch":"5","verbatim":true,"text":"(1) Правомощията на Министерския съвет се прекратяват:\n1. с гласуване на недоверие на Министерския съвет или на министър-председателя;\n2. с приемане на оставката на Министерския съвет или на министър-председателя;\n3. при смърт на министър-председателя.\n(2) Министерският съвет подава оставка пред новоизбраното Народно събрание.\n(3) В случаите по предходните алинеи Министерският съвет изпълнява функциите си до избирането на нов Министерски съвет."},"112":{"ch":"5","verbatim":true,"text":"(1) Министерският съвет може да поиска Народното събрание да му гласува доверие по цялостната политика, по програмата или по конкретен повод. Решението се приема с мнозинство повече от половината от присъстващите народни представители.\n(2) Когато Министерският съвет не получи исканото доверие, министър-председателят подава оставката на правителството."},"114":{"ch":"5","verbatim":true,"text":"Въз основа и в изпълнение на законите Министерският съвет приема постановления, разпореждания и решения. С постановления Министерският съвет приема и правилници и наредби."},"117":{"ch":"6","verbatim":true,"text":"(1) Съдебната власт защитава правата и законните интереси на гражданите, юридическите лица и държавата.\n(2) Съдебната власт е независима и неин основен носител е съдът. Прокуратурата и следствените органи са в системата на съдебната власт. При осъществяване на своите функции съдиите, съдебните заседатели, прокурорите и следователите се подчиняват само на закона.\n(3) Съдебната власт има самостоятелен бюджет."},"120":{"ch":"6","verbatim":true,"text":"(1) Съдилищата осъществяват контрол за законност на актове и действия на административните органи.\n(2) Гражданите и юридическите лица могат да обжалват всички административни актове, които ги засягат освен изрично посочените със закон."},"121":{"ch":"6","verbatim":true,"text":"(1) Съдилищата осигуряват равенство и условия за състезателност на страните в съдебния процес.\n(2) Производството по делата осигурява установяването на истината.\n(3) Разглеждането на делата във всички съдилища е публично, освен когато законът предвижда друго.\n(4) Актовете на правораздаването се мотивират."},"124":{"ch":"6","verbatim":true,"text":"Върховният касационен съд осъществява върховен съдебен надзор за точно и еднакво прилагане на законите от всички съдилища."},"125":{"ch":"6","verbatim":true,"text":"(1) Върховният административен съд осъществява върховен съдебен надзор за точното и еднакво прилагане на законите в административното правораздаване.\n(2) Върховният административен съд се произнася по спорове за законността на актовете на Министерския съвет и на министрите, както и на други актове, посочени в закона."},"126":{"ch":"6","verbatim":true,"text":"(1) Структурата на прокуратурата е в съответствие с тази на съдилищата, които разглеждат наказателни дела.\n(2) Главният прокурор осъществява надзор за законност и методическо ръководство върху дейността на всички прокурори.\n(3) Обявена за противоконституционна с Решение № 13 на КС от 2024 г.","note":"Ал. 3 (нова от 2023 г.) е обявена за противоконституционна."},"127":{"ch":"6","verbatim":true,"text":"Прокуратурата следи за спазване на законността, като:\n1. ръководи разследването и упражнява надзор за законосъобразното му провеждане;\n2. може да извършва разследване;\n3. привлича към отговорност лицата, които са извършили престъпления, и поддържа обвинението по наказателни дела от общ характер;\n4. упражнява надзор при изпълнение на наказателните и други принудителни мерки;\n5. предприема действия за оспорване на незаконосъобразни актове пред съда в случаите, предвидени в закон;\n6. освен по наказателните дела от общ характер, в предвидените със закон случаи участва и в други дела в защита на значим обществен интерес или в интерес на лица, които се нуждаят от специална закрила."},"129":{"ch":"6","verbatim":true,"text":"(1) Съдиите, прокурорите и следователите се назначават, повишават, понижават, преместват и освобождават от длъжност от съдийската, съответно прокурорската колегия на Висшия съдебен съвет.\n(2) Председателят на Върховния касационен съд, председателят на Върховния административен съд и главният прокурор се назначават и освобождават от президента на републиката по предложение на пленума на Висшия съдебен съвет за срок от седем години без право на повторно избиране. Президентът не може да откаже назначаването или освобождаването при повторно направено предложение.\n(3) С навършване на петгодишен стаж като съдия, прокурор или следовател и след атестиране, с решение на съдийската, съответно прокурорската колегия на Висшия съдебен съвет, съдиите, прокурорите и следователите стават несменяеми. Те, включително лицата по ал. 2, се освобождават от длъжност само при: 1. навършване на 65-годишна възраст; 2. подаване на оставка; 3. влизане в сила на присъда, с която е наложено наказание лишаване от свобода за умишлено престъпление; 4. трайна фактическа невъзможност да изпълняват задълженията си за повече от една година; 5. тежко нарушение или системно неизпълнение на служебните задължения, както и действия, които накърняват престижа на съдебната власт.","note":"Показани са ал. 1–3. Ал. 4 е обявена за противоконституционна с Решение № 7 на КС от 2006 г."},"130":{"ch":"6","verbatim":true,"text":"(1) Висшият съдебен съвет се състои от 25 членове. Председателят на Върховния касационен съд, председателят на Върховния административен съд и главният прокурор са по право негови членове.\n(2) За членове на Висшия съдебен съвет, които не са негови членове по право, се избират юристи с високи професионални и нравствени качества, които имат най-малко петнадесетгодишен юридически стаж.\n(3) Единадесет от членовете на Висшия съдебен съвет се избират от Народното събрание с мнозинство две трети от народните представители и единадесет – от органите на съдебната власт. Членовете на Висшия съдебен съвет се избират при условията на чл. 130а, ал. 3 и 4 и по ред, определен със закон.\n(4) Мандатът на изборните членове на Висшия съдебен съвет е пет години. Те не могат да бъдат преизбирани веднага след изтичане на този срок.\n…\n(8) Мандатът на изборен член на Висшия съдебен съвет се прекратява при: 1. подаване на оставка; 2. влязъл в сила съдебен акт за извършено престъпление; 3. трайна фактическа невъзможност да изпълнява задълженията си за повече от една година; 4. дисциплинарно освобождаване от длъжност или лишаване от право да упражнява юридическа професия или дейност.\n(9) При прекратяване на мандата на изборен член на Висшия съдебен съвет на негово място се избира друг от съответната квота, който довършва мандата."},"130а":{"ch":"6","verbatim":true,"text":"(1) Висшият съдебен съвет осъществява правомощията си чрез пленум, съдийска и прокурорска колегия.\n(2) Пленумът се състои от всички членове на Висшия съдебен съвет. Пленумът на Висшия съдебен съвет: 1. приема проекта на бюджета на съдебната власт; 2. приема решение за прекратяване на мандата на изборен член на Висшия съдебен съвет при условията на чл. 130, ал. 8; 3. организира квалификацията на съдиите, прокурорите и следователите; 4. решава общи за съдебната власт организационни въпроси; 5. изслушва и приема годишните доклади по чл. 84, т. 16; 6. управлява недвижимите имоти на съдебната власт; 7. прави предложение до президента на републиката за назначаване и освобождаване на председателя на Върховния касационен съд, председателя на Върховния административен съд и главния прокурор; 8. осъществява и други правомощия, определени със закон.\n(3) Съдийската колегия на Висшия съдебен съвет се състои от 14 членове и включва председателите на Върховния касационен съд и на Върховния административен съд, шестима членове, избрани пряко от съдиите, и шестима членове, избрани от Народното събрание.\n(4) Прокурорската колегия на Висшия съдебен съвет се състои от 11 членове и включва главния прокурор, четирима членове, избрани пряко от прокурорите, един член, избран пряко от следователите, и петима членове, избрани от Народното събрание.\n(5) Колегиите в съответствие със своята професионална насоченост: 1. назначават, повишават, преместват и освобождават от длъжност съдиите, прокурорите и следователите; 2. правят периодични атестации на съдиите, прокурорите, следователите и административните ръководители в органите на съдебната власт и решават въпроси за придобиване и възстановяване на несменяемост; 3. налагат дисциплинарните наказания понижаване и освобождаване от длъжност на съдиите, прокурорите, следователите и административните ръководители в органите на съдебната власт; 4. назначават и освобождават административните ръководители в органите на съдебната власт; 5. решават въпроси за организацията на дейността на съответната система от органи на съдебната власт; 6. осъществяват и други правомощия, определени със закон."},"130б":{"ch":"6","verbatim":true,"text":"(1) Заседанията на пленума на Висшия съдебен съвет се председателстват от министъра на правосъдието. Той не участва в гласуването.\n(2) Съдийската колегия на Висшия съдебен съвет се председателства от председателя на Върховния касационен съд. Прокурорската колегия на Висшия съдебен съвет се председателства от главния прокурор. Министърът на правосъдието може да присъства на заседанията, като не участва в гласуването.\n(3) Главният инспектор може да присъства на заседанията на пленума на Висшия съдебен съвет и на заседанията на съдийската и прокурорската колегия на Висшия съдебен съвет, като не участва в гласуването."},"130в":{"ch":"6","verbatim":true,"text":"Министърът на правосъдието:\n1. предлага проект на бюджет на съдебната власт и го внася във Висшия съдебен съвет;\n2. (отм.);\n3. може да прави предложения за назначаване, повишаване, понижаване, преместване и освобождаване от длъжност на съдии, прокурори и следователи;\n4. участва в управлението на съдебното обучение;\n5. (отм.)."},"132а":{"ch":"6","verbatim":true,"text":"(1) Към Висшия съдебен съвет се създава Инспекторат, който се състои от главен инспектор и десет инспектори.\n(2) Главният инспектор се избира от Народното събрание с мнозинство две трети от народните представители за срок от пет години.\n(3) Инспекторите се избират от Народното събрание за срок от четири години по реда на ал. 2.\n(4) Главният инспектор и инспекторите могат да бъдат преизбирани на същата длъжност само за още един мандат.\n(5) Бюджетът на Инспектората се приема от Народното събрание в рамките на бюджета на съдебната власт.\n(6) Инспекторатът проверява дейността на органите на съдебната власт, без да засяга независимостта на съдиите, съдебните заседатели, прокурорите и следователите при осъществяването на техните функции. Инспекторатът извършва проверки за почтеност и конфликт на интереси на съдии, прокурори и следователи, на имуществените им декларации, както и за установяване на действия, които накърняват престижа на съдебната власт, и такива, свързани с нарушаване на независимостта на съдиите, прокурорите и следователите. Главният инспектор и инспекторите при осъществяване на функциите си са независими и се подчиняват само на закона.\n(7) Инспекторатът действа служебно, по инициатива на граждани, юридически лица или държавни органи, включително на съдии, прокурори и следователи.\n(8) Инспекторатът представя годишен доклад за дейността си на Висшия съдебен съвет.\n(9) Инспекторатът отправя сигнали, предложения и доклади до други държавни органи, включително и до компетентните органи на съдебната власт. Инспекторатът предоставя публично информация за дейността си.\n(10) Условията и редът за избиране и освобождаване на главния инспектор и на инспекторите, както и организацията и дейността на Инспектората се уреждат със закон."},"134":{"ch":"6","verbatim":true,"text":"(1) Адвокатурата е свободна, независима и самоуправляваща се. Тя подпомага гражданите и юридическите лица при защитата на техните права и законни интереси.\n(2) Организацията и редът на дейността на адвокатурата се уреждат със закон."},"138":{"ch":"7","verbatim":true,"text":"Орган на местното самоуправление в общината е общинският съвет, който се избира от населението на съответната община за срок от четири години по ред, определен със закон."},"139":{"ch":"7","verbatim":true,"text":"(1) Орган на изпълнителната власт в общината е кметът. Той се избира от населението или от общинския съвет за срок от четири години по ред, определен със закон.\n(2) В своята дейност кметът се ръководи от закона, актовете на общинския съвет и решенията на населението."},"143":{"ch":"7","verbatim":false,"text":"(1) Областта се управлява от областен управител, подпомаган от областна администрация. (2) Областният управител се назначава от Министерския съвет. (3) Областният управител осигурява провеждането на държавната политика, отговаря за защитата на националните интереси, на законността и обществения ред и осъществява административен контрол."},"144":{"ch":"7","verbatim":false,"text":"Централните държавни органи и техните представители по места осъществяват контрол за законосъобразност върху актовете на органите на местното самоуправление само когато това е предвидено със закон."},"147":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд се състои от 12 съдии, от които една трета се избират от Народното събрание, една трета се назначават от президента и една трета се избират от общото събрание на съдиите от Върховния касационен съд и Върховния административен съд. (2) Съдиите се избират за девет години и не могат да бъдат преизбирани; съставът се обновява всеки три години от всяка квота по ред, определен със закон. (3) Юристи с високи професионални и нравствени качества и най-малко 15 години юридически стаж. (4) Съдиите избират председател на съда с тайно гласуване за срок от три години. (5) Длъжността е несъвместима с представителен мандат, държавна или обществена длъжност, членство в партия или синдикат, свободна, търговска или друга платена професионална дейност. (6) Съдиите имат имунитета на народните представители."},"148":{"ch":"8","verbatim":false,"text":"Мандатът на конституционен съдия се прекратява при изтичане на срока, оставка, влязла в сила присъда за умишлено престъпление, трайна невъзможност, несъвместимост и смърт. Имунитетът се снема и трайната невъзможност се установява от КС с тайно гласуване и мнозинство две трети от всички съдии."},"149":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд: 1. дава задължителни тълкувания на Конституцията; 2. произнася се по искане за установяване на противоконституционност на законите и на другите актове на Народното събрание, както и на актовете на президента; 3. решава спорове за компетентност между Народното събрание, президента и Министерския съвет, както и между органите на местното самоуправление и централните изпълнителни органи; 4. произнася се за съответствието на сключените международни договори с Конституцията преди ратификацията им, както и за съответствие на законите с общопризнатите норми на международното право и с международните договори; 5. произнася се по спорове за конституционността на политическите партии и сдружения; 6. произнася се по спорове за законността на избора на президент и вицепрезидент; 7. произнася се по спорове за законността на избора на народен представител; 8. произнася се по обвинения, повдигнати от Народното събрание срещу президента и вицепрезидента. (2) Със закон не могат да се създават или отнемат правомощия на Конституционния съд."},"150":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд действа по инициатива на не по-малко от една пета от народните представители, на президента, на Министерския съвет, на Върховния касационен съд, на Върховния административен съд и на главния прокурор; по спорове за компетентност по чл. 149, ал. 1, т. 3 – и на общинските съвети. (2) Всеки съд, по искане на страна по делото или по свой почин, може да сезира Конституционния съд, когато установи несъответствие между приложимия закон и Конституцията. (3) Обявена за противоконституционна с Решение № 13 на КС от 2024 г. (4) Омбудсманът може да сезира съда с искане за установяване на противоконституционност на закон, с който се нарушават права и свободи на гражданите. (5) Висшият адвокатски съвет може да сезира съда на същото основание.","note":"Ал. 2 („всеки съд“) е от изменението от 2023 г. и е в сила; ал. 3 е обявена за противоконституционна."},"151":{"ch":"8","verbatim":false,"text":"(1) Конституционният съд приема решения с мнозинство повече от половината от всички съдии. (2) Решенията се обнародват в „Държавен вестник“ в 15-дневен срок от приемането им и влизат в сила три дни след обнародването; обявеният за противоконституционен акт не се прилага от деня на влизането в сила на решението. (3) Противоконституционността на част от закона не засяга останалата му част."},"153":{"ch":"9","verbatim":false,"text":"Народното събрание може да изменя и допълва всички разпоредби на Конституцията с изключение на тези, които са от компетентност на Великото Народно събрание."},"154":{"ch":"9","verbatim":false,"text":"(1) Право на инициатива за изменение на Конституцията имат една четвърт от народните представители и президентът. (2) Предложението се разглежда от Народното събрание не по-рано от един месец и не по-късно от три месеца от постъпването му."},"155":{"ch":"9","verbatim":false,"text":"(1) Народното събрание приема закон за изменение на Конституцията с мнозинство три четвърти от всички народни представители на три гласувания в различни дни. (2) Когато предложението получи по-малко от три четвърти, но повече от две трети от гласовете, то може да бъде подложено на ново обсъждане не по-рано от два и не по-късно от пет месеца; при новото гласуване се приема с мнозинство две трети от всички народни представители."},"156":{"ch":"9","verbatim":false,"text":"Законът за изменение на Конституцията се подписва и обнародва в „Държавен вестник“ от председателя на Народното събрание в седемдневен срок от приемането му."},"157":{"ch":"9","verbatim":false,"text":"Великото Народно събрание се състои от 400 народни представители, избрани по общия ред."},"158":{"ch":"9","verbatim":false,"text":"Великото Народно събрание: 1. приема нова Конституция; 2. решава въпроса за изменение на територията на Република България и ратифицира международни договори, предвиждащи такова изменение; 3. решава въпросите за промени във формата на държавно устройство и на държавно управление; 4. решава въпросите за изменение на чл. 5, ал. 2 и 4 и на чл. 57, ал. 1 и 3; 5. решава въпросите за изменение и допълнение на глава девета."},"159":{"ch":"9","verbatim":false,"text":"(1) Право на инициатива по чл. 158 имат не по-малко от половината народни представители и президентът. (2) Проектът се обсъжда от Народното събрание не по-рано от два и не по-късно от пет месеца от постъпването му."},"160":{"ch":"9","verbatim":false,"text":"(1) Народното събрание решава да се произведат избори за Велико Народно събрание с мнозинство две трети от всички народни представители. (2) Изборите се насрочват от президента в тримесечен срок. (3) С произвеждането на изборите се прекратяват пълномощията на Народното събрание."},"161":{"ch":"9","verbatim":false,"text":"Великото Народно събрание приема решения по внесения проект с мнозинство две трети от всички народни представители на три гласувания в различни дни."},"162":{"ch":"9","verbatim":false,"text":"(1) Великото Народно събрание решава само въпросите, за които е избрано. (2) При неотложни случаи изпълнява и функциите на обикновено Народно събрание. (3) Пълномощията му се прекратяват след като реши въпросите, за които е избрано; президентът насрочва избори по реда на закона."},"163":{"ch":"9","verbatim":false,"text":"Актовете на Великото Народно събрание се подписват и обнародват от неговия председател в седемдневен срок от приемането им."},"128":{"ch":"6","verbatim":false,"text":"Следствените органи са в системата на съдебната власт. Те осъществяват разследване по наказателни дела в случаите, предвидени в закона."},"136":{"ch":"7","verbatim":false,"text":"(1) Общината е основната административно-териториална единица, в която се осъществява местното самоуправление. Гражданите участват в управлението на общината както чрез избраните от тях органи на местно самоуправление, така и непосредствено чрез референдум и общо събрание на населението."},"141":{"ch":"7","verbatim":false,"text":"Общината има самостоятелен бюджет. Общинският съвет определя размера на местните данъци при условия, по ред и в границите, установени със закон, и размера на местните такси по ред, установен със закон. Държавата подпомага нормалната дейност на общините чрез бюджетни средства и по друг начин."}}}};
const G = DATA.gov, C = DATA.const;
const NODES = G.nodes, EDGES = G.edges, ET = G.edgeTypes, BR = G.branches, PL = G.publicityLevels;
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const edgeById = Object.fromEntries(EDGES.map(e => [e.id, e]));
const ART_RE = /чл\.\s*(\d+[а-я]?)/g;
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const arts = ref => [...String(ref || '').matchAll(ART_RE)].map(m => m[1]);

const state = { unitHi: null, icons: true, group: null, sel: null, hover: null, scn: null, art: null, hidden: new Set(), color: 'branch', tab: 'info',
  lines: 'focus',        // 'focus': lines only for the hovered / selected item; 'all': every line
  star: false,           // focus mode: arrange the selected institution's links around it
  collapsed: new Set(),  // collapsed group ids
  ref: 'who', whoQ: '',  // reference tab section and "who can" query
  play: null, scnFull: false };

// ---------- links to the Constitution ----------
function officialUrl(key) {
  return C.source.official + '#:~:text=' + encodeURIComponent('Чл. ' + key + '.');
}
function refHtml(ref, law) {
  let h = '';
  if (ref) h += String(ref).split(';').map(p => p.trim()).filter(Boolean).map(p => {
    const k = arts(p)[0];
    return k ? `<a class="art" data-art="${esc(k)}" data-ref="${esc(p)}" title="Покажи текста на чл. ${esc(k)}">${esc(p)}</a>` : `<span class="law">${esc(p)}</span>`;
  }).join('');
  if (law) h += lawHtml(law);
  return h ? `<span class="refs">${h}</span>` : '';
}

// ---------- links to laws ----------
const EU_ACTS = {
  'Договор за Европейския съюз': 'CELEX:12016M/TXT',
  'Договор за функционирането на ЕС': 'CELEX:12016E/TXT',
  'Регламент (ЕС) 2017/1939': 'CELEX:32017R1939',
};
function lawUrl(name) {
  const base = name.replace(/,?\s*(чл\.|ал\.|т\.).*$/, '').trim();
  for (const [k, v] of Object.entries(EU_ACTS)) if (base.startsWith(k)) return { url: 'https://eur-lex.europa.eu/legal-content/BG/TXT/?uri=' + v, where: 'EUR-Lex' };
  if (/^(Закон|Изборен кодекс|Кодекс|Административнопроцесуален|Наказателен|Граждански|Правилник|Устройствен)/.test(base))
    return { url: 'https://www.google.com/search?q=' + encodeURIComponent(`site:lex.bg "${base}"`), where: 'lex.bg' };
  return null;
}
function lawHtml(law) {
  return String(law).split(';').map(p => p.trim()).filter(Boolean).map(p => {
    const u = lawUrl(p);
    return u ? `<a class="law lnk" href="${esc(u.url)}" target="_blank" rel="noopener" title="Уредено в закон, не в Конституцията. Текст в ${u.where}">${esc(p)} ↗</a>`
             : `<span class="law" title="Уредено в закон, не в Конституцията">${esc(p)}</span>`;
  }).join('');
}

// ---------- citation index ----------
const CITED = {};
function cite(ref, item) { for (const k of arts(ref)) (CITED[k] ||= []).push(item); }
for (const n of NODES) {
  const it = { kind: 'node', id: n.id, label: n.label };
  cite(n.refs, it); cite(n.pub?.ref, it);
  for (const p of n.powers || []) cite(p.ref, it);
}
for (const e of EDGES) cite(e.ref, { kind: 'edge', id: e.id, label: `${byId[e.from].label} → ${byId[e.to].label}` });
for (const s of G.scenarios) for (const st of s.steps) cite(st.ref, { kind: 'scn', id: s.id, label: 'Сценарий: ' + s.title });

// cited points of an article: "чл. 84, т. 8; чл. 99, ал. 5" → { '84': [{al: null, t: '8'}], '99': [{al: '5', t: null}] }
function citedParts(ref) {
  const out = {};
  for (const part of String(ref || '').split(';')) {
    const k = arts(part)[0]; if (!k) continue;
    const al = part.match(/ал\.\s*(\d+[а-я]?)/)?.[1] || null, t = part.match(/т\.\s*(\d+[а-я]?)/)?.[1] || null;

}
// article text with the cited paragraphs (ал.) and points (т.) highlighted
function articleTextHtml(k, ref) {
  const text = C.articles[k].text, want = citedParts(ref)[k];
  if (!want) return esc(text);
  const marks = [];
  for (const m of text.matchAll(/(^|\s)\((\d+[а-я]?)\)\s/g)) marks.push({ type: 'al', n: m[2], pos: m.index + m[1].length });
  for (const m of text.matchAll(/(^|\n|[:;]\s)(\d+[а-я]?)\.\s/g)) marks.push({ type: 't', n: m[2], pos: m.index + m[1].length });
  marks.sort((a, b) => a.pos - b.pos);
  const endOf = (i, sameOnly) => { for (let j = i + 1; j < marks.length; j++) if (!sameOnly || marks[j].type === 'al') return marks[j].pos; return text.length; };
  const ranges = [];
  for (const w of want) {
    let lo = 0, hi = text.length;
    if (w.al) {
      const i = marks.findIndex(m => m.type === 'al' && m.n === w.al);
      if (i < 0) continue;
      lo = marks[i].pos; hi = endOf(i, true);
    }
    if (w.t) {
      const i = marks.findIndex(m => m.type === 't' && m.n === w.t && m.pos >= lo && m.pos < hi);
      if (i < 0) continue;
      lo = marks[i].pos; hi = Math.min(hi, endOf(i, false));
    }
    ranges.push([lo, text.slice(lo, hi).trimEnd().length + lo]);
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let h = '', at = 0;
  for (const [lo, hi] of ranges) { if (lo < at) continue; h += esc(text.slice(at, lo)) + `<mark class="cit">${esc(text.slice(lo, hi))}</mark>`; at = hi; }
  return h + esc(text.slice(at));
}
function articleBlocks(ref) {
  return [...new Set(arts(ref))].map(k => {
    const a = C.articles[k];
    return `<div class="article"><div class="hd"><b data-art="${k}" data-ref="${esc(ref)}">Чл. ${esc(k)}</b><span class="badge muted">${a.verbatim ? 'Текст' : 'Резюме'}</span><a class="ext" href="${officialUrl(k)}" target="_blank" rel="noopener">официален текст ↗</a></div><div class="tx">${articleTextHtml(k, ref)}</div>${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}</div>`;

}

// ---------- scenarios (flowchart) ----------
function stepNext(sc, i) {

}
function renderScn() {
  const p = $('#p-scn');

  h += `<div class="scnpick">${G.scenarios.map(s => `<button class="pick${cur?.id === s.id ? ' on' : ''}" data-scn="${s.id}">${esc(s.title)}</button>`).join('')}</div>`;
  if (cur) {
    // rows: main steps in order; a side step sits on the row of the first step that leads to it
    const rowOf = {}, sideOn = {};
    let row = 0;
    cur.steps.forEach((st, i) => {
      if (st.side) return;
      rowOf[i] = row++;
      for (const nx of stepNext(cur, i)) {
        const t = cur.steps[nx.to];
        if (t?.side && rowOf[nx.to] === undefined && !sideOn[rowOf[i]]) { rowOf[nx.to] = rowOf[i]; sideOn[rowOf[i]] = true; }
      }
    });
    cur.steps.forEach((st, i) => { if (rowOf[i] === undefined) rowOf[i] = row++; });
    h += `<div class="scnbar"><button id="play" class="small">${state.play ? '⏸ Пауза' : state.scn.i && !stepNext(cur, state.scn.i).length ? '↺ Отначало' : '▶ Пусни'}</button><button id="sprev" class="small" ${state.scn.i ? '' : 'disabled'}>←</button><button id="snext" class="small" ${stepNext(cur, state.scn.i).length ? '' : 'disabled'}>→</button><span class="sp"></span><button id="full" class="small">${state.scnFull ? '✕ Затвори' : '⛶ На цял екран'}</button></div>`;
    h += `<div class="scnbody"><div class="scnflow"><div class="flegend"><span><i style="border-color:#8c877d"></i>действие</span><span><i style="border-color:#c98a1b;background:#fff8e6;border-radius:6px"></i>въпрос / решение</span><span><i style="border-color:#2e6b3a;background:#eef6ef;border-width:2.5px"></i>край</span></div>`;
    h += `<div class="fchart" id="flow">${cur.steps.map((st, i) => `<div class="fbox k-${st.kind}${st.side ? ' side' : ''}${i === state.scn.i ? ' on' : ''}${state.scn.seen?.includes(i) && i !== state.scn.i ? ' done' : ''}" data-i="${i}" data-row="${rowOf[i]}" style="grid-row:${rowOf[i] + 1};grid-column:${st.side ? 2 : 1}"><span class="n">${i + 1}</span>${esc(st.title)}</div>`).join('')}</div></div>`;
    const st = cur.steps[state.scn.i];
    h += `<div class="scndet"><div class="step"><b>${state.scn.i + 1}. ${esc(st.title)}</b><p>${lk(st.text)}</p><p>${refHtml(st.ref, st.law)}</p><p class="small">${st.nodes.map(who).join(' · ')}</p>
      ${stepNext(cur, state.scn.i).length ? `<div class="small">Следва: ${stepNext(cur, state.scn.i).map(nx => `<a href="#" class="goto" data-i="${nx.to}">${nx.label ? esc(nx.label) + ' → ' : ''}${esc(cur.steps[nx.to].title)}</a>`).join(' · ')}</div>` : '<div class="small muted">Край на процедурата.</div>'}</div>${articleBlocks(st.ref)}</div></div>`;
  }
  p.innerHTML = h;
  p.querySelectorAll('[data-scn]').forEach(b => b.addEventListener('click', () => { stopPlay(); openScn(b.dataset.scn, 0); }));
  p.querySelectorAll('.fbox, a.goto').forEach(b => b.addEventListener('click', ev => { ev.preventDefault(); goStep(+b.dataset.i); }));
  if (cur) {
    $('#play').addEventListener('click', () => state.play ? stopPlay() : startPlay());
    $('#sprev').addEventListener('click', () => { const sn = state.scn.seen || []; goStep(sn.length > 1 ? sn[sn.length - 2] : 0, true); });
    $('#snext').addEventListener('click', () => { const nx = stepNext(cur, state.scn.i)[0]; if (nx) goStep(nx.to); });
    $('#full').addEventListener('click', () => setFull(!state.scnFull));

}
function openScn(id, i = 0) {
  if (state.tab !== 'scn') setTab('scn');
  state.scn = { id, i, seen: [i] }; state.sel = null;
  renderScn(); paint();
}
// go to a step; "back" drops the last visited step instead of adding one
function goStep(i, back = false) {
  const sc = state.scn; if (!sc) return;
  if (back) { sc.seen = (sc.seen || []).slice(0, -1); if (!sc.seen.length) sc.seen = [i]; }
  else (sc.seen ||= []).push(i);
  sc.i = i; renderScn(); paint();
  if (state.play) { sc.zoomed = true; fitNodes(G.scenarios.find(s => s.id === sc.id).steps[i].nodes, 90); }
}
function startPlay() {
  const sc = G.scenarios.find(s => s.id === state.scn.id);
  if (!stepNext(sc, state.scn.i).length) { state.scn.seen = []; state.scn.i = 0; }
  state.play = setInterval(() => {
    const nx = stepNext(sc, state.scn.i)[0];
    if (!nx || (state.scn.seen || []).filter(x => x === nx.to).length > 1) return stopPlay();
    goStep(nx.to);
  }, 2800);
  goStep(state.scn.i);
}
function stopPlay(fit = true) {
  if (!state.play) return;
  clearInterval(state.play); state.play = null;

}
function setFull(on) {
  if (state.scnFull === on) return;
  state.scnFull = on; document.querySelector('aside').classList.toggle('full', on);
  if (state.tab === 'scn') renderScn();
}
function drawFlow(sc) {
  const flow = $('#flow'); if (!flow) return;
  const base = flow.getBoundingClientRect();
  const R = {};
  flow.querySelectorAll('.fbox').forEach(b => { const r = b.getBoundingClientRect(); R[b.dataset.i] = { l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top, cx: (r.left + r.right) / 2 - base.left, cy: (r.top + r.bottom) / 2 - base.top, side: b.classList.contains('side'), row: +b.dataset.row }; });
  const svgf = document.createElementNS(SVGNS, 'svg');
  svgf.setAttribute('class', 'fl'); svgf.setAttribute('width', base.width); svgf.setAttribute('height', base.height);
  svgf.innerHTML = `<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b6760"/></marker></defs>`;
  let lane = 0;
  const path = (d, label, lx, ly, anchor = 'start') => {
    svgf.insertAdjacentHTML('beforeend', `<path d="${d}" fill="none" stroke="#6b6760" stroke-width="1.4" marker-end="url(#fa)"/>`
      + (label ? `<text x="${lx}" y="${ly}" font-size="10.5" fill="#8a4a06" font-weight="600" text-anchor="${anchor}" paint-order="stroke" stroke="#fffdf8" stroke-width="3">${esc(label)}</text>` : ''));
  };
  sc.steps.forEach((st, i) => {
    const a = R[i];
    for (const nx of stepNext(sc, i)) {
      const b = R[nx.to]; if (!b) continue;
      const L = nx.label || '';
      if (!a.side && !b.side && b.row === a.row + 1) {            // straight down
        path(`M${a.cx},${a.b} L${b.cx},${b.t - 1}`, L, a.cx + 5, a.b + 13);
      } else if (!a.side && b.side && b.row === a.row) {                              // across to the side
        const y = Math.min(Math.max(a.cy, b.t + 8), b.b - 8);
        path(`M${a.r},${y} L${b.l - 1},${y}`, L, a.r + 3, y - 4);
      } else if (!a.side && b.side) {                                              // side, lower row
        path(`M${a.r},${a.cy} L${b.cx},${a.cy} L${b.cx},${b.cy < a.cy ? b.b + 1 : b.t - 1}`, L, a.r + 3, a.cy - 4);
      } else if (a.side && !b.side) {                                              // back from the side
        const y = b.t > a.b ? b.cy : b.cy;
        path(`M${a.cx},${a.b} L${a.cx},${y} L${b.r + 1},${y}`, L, a.cx - 4, a.b + 12, 'end');
      } else {                                                                     // jump via the left gutter
        const x = 52 - (lane++ % 3) * 7;
        path(`M${a.l},${a.cy} L${x},${a.cy} L${x},${b.cy} L${b.l - 1},${b.cy}`, L, b.l - 4, b.cy - 5, 'end');   // label at the target: several jumps can leave one box
      }
    }
  });

}
addEventListener('resize', () => { if (state.tab === 'scn' && state.scn) drawFlow(G.scenarios.find(s => s.id === state.scn.id)); });
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,select,textarea')) return;

  if (ev.altKey) return;
  if (state.tab !== 'scn' || !state.scn) return;
  const sc = G.scenarios.find(s => s.id === state.scn.id);
  if (ev.key === 'ArrowRight') { const nx = stepNext(sc, state.scn.i)[0]; if (nx) goStep(nx.to); }
  if (ev.key === 'ArrowLeft') { const sn = state.scn.seen || []; if (sn.length > 1) goStep(sn[sn.length - 2], true); }
  if (ev.key === ' ') { ev.preventDefault(); state.play ? stopPlay() : startPlay(); }
});

// "who can …" — the question is read as: verb → link types, institution → target (or source for "какво може X")
const VERBS = [
  [/сезир/, ['refer']], [/свал|освобожд|разпус|недовер|отстран|импийчм|уволн|прекрат/, ['dismiss']],
  [/избир|назнач|избор|излъчв/, ['elect']], [/предлаг|внас|инициатив/, ['propose']], [/вето|връщ|спир/, ['veto']],
  [/провер|противоконст|отмен|съди|обжалв/, ['review']], [/контрол|отчит|отчет|изслуш|питан|надзор/, ['control']],
  [/насроч|свикв|мандат|възлаг|референдум/, ['call']], [/замест|служеб/, ['replace']],

function parseWho(q) {

}

    ${list.map(n => `<div class="term"><span class="nm who" data-node="${n.id}">${esc(n.label)}</span><span class="tr"><span class="tb" style="width:${n.termYears / max * 100}%;background:${BR[n.branch].color}"></span><span class="tl">${n.termYears} г.</span></span></div>`).join('')}

}

    ${G.majorities.map(m => `<div class="maj"><div><b>${m.n}</b><br><span class="small muted">${esc(m.label)}</span></div><div>${lk(m.what)}<br>${refHtml(m.ref)}</div></div>`).join('')}
    <p class="small muted">Обикновените закони се приемат с мнозинство от присъстващите при кворум над половината ${refHtml('чл. 81')}.</p>`;

// ---------- constitution ----------
let constQuery = '';
function renderConst(scrollTo) {
  const p = $('#p-const');
  const keys = Object.keys(C.articles).sort((a, b) => parseInt(a) - parseInt(b) || a.localeCompare(b, 'bg'));
  const q = constQuery.trim().toLowerCase();
  let h = `<div class="src">${esc(C.source.title)}, ${esc(C.source.version)}.<br><a class="ext" href="${C.source.official}" target="_blank" rel="noopener">Официален текст (parliament.bg) ↗</a> · <a class="ext" href="${C.source.consolidated}" target="_blank" rel="noopener">консолидиран PDF ↗</a> · <a class="ext" href="${C.source.lex}" target="_blank" rel="noopener">lex.bg ↗</a> · <a class="ext" href="${C.source.english}" target="_blank" rel="noopener">English ↗</a><br><span class="muted">${esc(C.source.note)}</span></div>
    <p><input type="search" id="cq" placeholder="Търси в членовете: напр. недоверие, 99, прокурор" value="${esc(constQuery)}"></p>
    <p class="small muted">Изберете член, за да светнат институциите и връзките, които се позовават на него.</p>`;
  let lastCh = null, shown = 0;
  for (const k of keys) {
    const a = C.articles[k];
    if (q && !(('чл. ' + k).includes(q) || k === q || a.text.toLowerCase().includes(q))) continue;
    if (a.ch !== lastCh) { h += `<div class="chap">${esc(C.chapters[a.ch])}</div>`; lastCh = a.ch; }
    const cited = CITED[k] || [];
    const uniq = [...new Map(cited.map(c => [c.kind + c.id, c])).values()];
    h += `<div class="article${state.art === k ? ' hi' : ''}" id="art-${k}"><div class="hd"><b data-pick="${k}">Чл. ${esc(k)}</b><span class="badge muted">${a.verbatim ? 'Текст' : 'Резюме'}</span><a class="ext" href="${officialUrl(k)}" target="_blank" rel="noopener">официален текст ↗</a></div>
      <div class="tx">${articleTextHtml(k, state.art === k ? state.artRef : null)}</div>${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}
      ${uniq.length ? `<div class="cited">Цитиран в: ${uniq.map(c => c.kind === 'node' ? who(c.id) : c.kind === 'edge' ? `<span class="who" data-edge="${c.id}">${esc(c.label)}</span>` : esc(c.label)).join(' · ')}</div>` : ''}</div>`;
    shown++;
  }
  if (!shown) h += '<p class="muted">Няма съвпадения.</p>';
  p.innerHTML = h;
  const cq = $('#cq');
  cq.addEventListener('input', () => { constQuery = cq.value; renderConst(); const c = $('#cq'); c.focus(); c.setSelectionRange(c.value.length, c.value.length); });
  p.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { state.art = state.art === b.dataset.pick ? null : b.dataset.pick; state.artRef = null; renderConst(); paint(); }));
  if (scrollTo) document.getElementById('art-' + scrollTo)?.scrollIntoView({ block: 'start' });
}
function openArticle(k, ref) {
  constQuery = '';
  setTab('const');
  state.art = k; state.artRef = ref || null; renderConst(k); paint();
  document.querySelector(`#art-${CSS.escape(k)} mark.cit`)?.scrollIntoView({ block: 'center' });
}

// ---------- fuzzy search ----------
const norm = x => String(x || '').toLowerCase().replace(/[„“"'’«»().,;:!?–—-]/g, ' ').replace(/\s+/g, ' ').trim();
function lev1(a, b) { // edit distance ≤ limit, cheap
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function fuzzyScore(q, text) {
  const t = norm(text); if (!t) return 0;
  const nq = norm(q); if (!nq) return 0;
  if (t === nq) return 100;
  if (t.startsWith(nq)) return 90;
  if (t.includes(nq)) return 75;
  const words = t.split(' ');
  const inits = words.filter(w => w.length > 2 || /^[а-я]{2,}$/.test(w)).map(w => w[0]).join('');
  if (nq.length >= 2 && !nq.includes(' ') && (inits === nq || words.map(w => w[0]).join('') === nq)) return 95;
  let total = 0;
  for (const qt of nq.split(' ')) {
    let best = 0;
    for (const w of words) {
      if (w.startsWith(qt)) best = Math.max(best, 1);
      else if (qt.length >= 4 && w.length >= 3) {
        const dd = lev1(qt, w.slice(0, qt.length + 1)), d2 = lev1(qt, w);
        const m = Math.min(dd, d2);
        if (m <= (qt.length >= 7 ? 2 : 1)) best = Math.max(best, .7);
      }
      if (!best && qt.length >= 2 && qt.length <= 5 && w.length > 1 && qt === w.replace(/[^а-яa-z]/g, '').slice(0, qt.length)) best = .9;
    }
    if (!best) {  // initials: "кс" → Конституционен съд
      const ini = words.map(w => w[0]).join('');
      if (qt.length >= 2 && ini.includes(qt)) best = .8;
    }
    if (!best) return 0;
    total += best;
  }
  return 60 * total / nq.split(' ').length;
}
const SEARCH = [];
for (const n of NODES) {
  SEARCH.push({ kind: 'Институция', label: n.label + (n.abbr && n.abbr !== n.label ? ` (${n.abbr})` : ''), abbr: n.abbr, text: [n.label, n.short, n.sub, n.abbr].join(' '), extra: n.comp, go: () => select({ kind: 'node', id: n.id }), icon: n });
  for (const u of n.units || []) SEARCH.push({ kind: 'Структура · ' + (n.short || n.label).replace('|', ' '), label: u.name, text: u.name + ' ' + (u.area || ''), go: () => { select({ kind: 'node', id: n.id }); state.unitHi = u.name; renderInfo(); { const u = document.querySelector('.unit.hi'), pane = $('#p-info'); if (u) pane.scrollTop = u.offsetTop - pane.clientHeight / 2; } state.unitHi = null; }, icon: n });
  for (const pw of n.powers || []) SEARCH.push({ kind: 'Правомощие · ' + n.label, label: pw.t, text: pw.t, go: () => select({ kind: 'node', id: n.id }), weak: true });
}
for (const e of EDGES) SEARCH.push({ kind: 'Връзка · ' + byId[e.from].label + ' → ' + byId[e.to].label, label: e.label, text: e.label, go: () => select({ kind: 'edge', id: e.id }), weak: true });
for (const g of G.groups) SEARCH.push({ kind: 'Група', label: g.label, text: g.label, go: () => selectGroup(g.id) });
for (const sc of G.scenarios) SEARCH.push({ kind: 'Сценарий', label: sc.title, text: sc.title + ' ' + sc.steps.map(x => x.title).join(' '), go: () => openScn(sc.id) });
for (const [k, a] of Object.entries(C.articles)) SEARCH.push({ kind: 'Конституция', label: 'Чл. ' + k, text: 'чл ' + k + ' член ' + k, extra: a.text, go: () => openArticle(k), weak: true });
let hits = [], act = 0;
const qi = $('#q'), res = $('#results');
function hl(label, q) {
  const nq = norm(q).split(' ').filter(x => x.length > 1);
  let h = esc(label);
  for (const t of nq) h = h.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
  return h;
}
function runSearch() {
  const q = qi.value;
  if (norm(q).length < 2) { res.classList.remove('on'); hits = []; return; }
  const asks = /^\s*(кой|коя|кои|какво|какви|кого)(?=\s|$)/i.test(q) && parseWho(q).id;
  hits = (asks ? [{ it: { kind: 'Отговор от връзките', label: q.trim().replace(/\?*$/, '?'), go: () => { state.whoQ = q.trim(); state.ref = 'who'; setTab('ref'); }, icon: byId[parseWho(q).id] }, sc: 999 }] : []).concat(SEARCH.map(it => {
    let sc = it.abbr && norm(it.abbr) === norm(q) ? 110 : fuzzyScore(q, it.text);
    if (!sc && it.extra) sc = fuzzyScore(q, it.extra) * .6;
    if (it.weak) sc *= .8;
    return { it, sc };
  }).filter(x => x.sc > 0)).sort((a, b) => b.sc - a.sc).slice(0, 14);
  act = 0;
  res.innerHTML = hits.length ? hits.map((h, i) => `<div class="r${i === act ? ' act' : ''}" data-h="${i}" role="option">${h.it.icon ? iconSvg(h.it.icon, 13) : ''}${hl(h.it.label, q)}<div class="k">${esc(h.it.kind)}</div></div>`).join('') : '<div class="r muted">Няма резултати</div>';
  res.classList.add('on');
}
function pick(i) { const h = hits[i]; if (!h) return; res.classList.remove('on'); h.it.go(); }
qi.addEventListener('input', runSearch);
qi.addEventListener('focus', runSearch);
qi.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); act = (act + (ev.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(hits.length, 1); res.querySelectorAll('.r').forEach((r, i) => r.classList.toggle('act', i === act)); res.querySelector('.r.act')?.scrollIntoView({ block: 'nearest' }); }
  if (ev.key === 'Enter') { ev.preventDefault(); pick(act); }
  if (ev.key === 'Escape') { res.classList.remove('on'); qi.blur(); }
});
res.addEventListener('mousedown', ev => { const r = ev.target.closest('[data-h]'); if (r) { ev.preventDefault(); pick(+r.dataset.h); } });
qi.addEventListener('blur', () => setTimeout(() => res.classList.remove('on'), 120));
document.addEventListener('keydown', ev => { if (ev.key === '/' && !ev.target.closest('input,select,textarea')) { ev.preventDefault(); qi.focus(); } });

// ---------- address of the current view (#…) and back / forward ----------
function viewHash() {
  const q = new URLSearchParams();
  if (state.tab === 'scn' && state.scn) q.set('s', state.scn.id + '.' + (state.scn.i + 1));
  else if (state.tab === 'scn') q.set('t', 'scn');
  else if (state.tab === 'const') { if (state.art) q.set('a', state.art); else q.set('t', 'const'); }
  else if (state.tab === 'ref') { q.set('r', state.ref); if (state.ref === 'who' && state.whoQ) q.set('q', state.whoQ); }
  else if (state.sel?.kind === 'node') q.set('n', state.sel.id);
  else if (state.sel?.kind === 'edge') q.set('e', state.sel.id);
  else if (state.group) q.set('g', state.group);
  if (state.star) q.set('f', '1');
  return q.toString().replace(/%2C/g, ',');
}
let canPush = true;
try { history.replaceState(history.state, '', location.href); } catch { canPush = false; }
const nav = { stack: [], i: -1, applying: false, idx: 0, max: 0 };
function syncHash() {
  if (nav.applying) return;
  const h = viewHash();
  const noQ = x => x.replace(/(^|&)q=[^&]*/, '');
  if (canPush) {
    if (location.hash.slice(1) === h) return;
    try {
      if (state.play || noQ(location.hash.slice(1)) === noQ(h)) history.replaceState({ i: nav.idx }, '', '#' + h);
      else { nav.idx++; nav.max = nav.idx; history.pushState({ i: nav.idx }, '', '#' + h); }
    } catch { canPush = false; }
  }
  if (!canPush) {
    if (nav.stack[nav.i] === h) return;
    if ((state.play || noQ(nav.stack[nav.i] || '') === noQ(h)) && nav.i >= 0) nav.stack[nav.i] = h; else { nav.stack = nav.stack.slice(0, nav.i + 1); nav.stack.push(h); nav.i++; }
  }
  navButtons();
}
function navButtons() {
  $('#hback').disabled = canPush ? nav.idx <= 0 : nav.i <= 0;
  $('#hfwd').disabled = canPush ? nav.idx >= nav.max : nav.i >= nav.stack.length - 1;
}
function applyHash(h) {
  const q = new URLSearchParams(h.replace(/^#/, ''));
  nav.applying = true;
  try {
    stopPlay();
    const star = q.get('f') === '1';
    state.star = star; $('#star').classList.toggle('on', star); $('#star').setAttribute('aria-pressed', star);
    state.sel = null; state.group = null; state.art = null; state.whoHi = null;
    if (q.get('s')) { const [id, i] = q.get('s').split('.'); if (G.scenarios.some(s => s.id === id)) { setTab('scn'); state.scn = { id, i: Math.max((+i || 1) - 1, 0), seen: [Math.max((+i || 1) - 1, 0)] }; renderScn(); } }
    else if (q.get('t') === 'scn') setTab('scn');
    else if (q.get('a') && C.articles[q.get('a')]) { setTab('const'); state.art = q.get('a'); renderConst(state.art); }
    else if (q.get('t') === 'const') setTab('const');
    else if (q.get('r')) { state.ref = REFS[q.get('r')] ? q.get('r') : 'who'; state.whoQ = q.get('q') || ''; setTab('ref'); }
    else {
      if (state.tab !== 'info') setTab('info');
      if (q.get('n') && byId[q.get('n')]) state.sel = { kind: 'node', id: q.get('n') };
      else if (q.get('e') && edgeById[q.get('e')]) state.sel = { kind: 'edge', id: q.get('e') };
      else if (q.get('g') && G.groups.some(g => g.id === q.get('g'))) state.group = q.get('g');
      renderInfo();
    }
    placeNodes(); applyStar(); paint();
  } finally { nav.applying = false; }
  navButtons();
}
addEventListener('popstate', ev => { nav.idx = ev.state?.i ?? 0; applyHash(location.hash); });
$('#hback').addEventListener('click', () => { if (canPush) history.back(); else if (nav.i > 0) applyHash(nav.stack[--nav.i]); });
$('#hfwd').addEventListener('click', () => { if (canPush) history.forward(); else if (nav.i < nav.stack.length - 1) applyHash(nav.stack[++nav.i]); });
$('#share').addEventListener('click', async () => {
  const url = location.href.split('#')[0] + '#' + viewHash();
  const b = $('#share');
  try { await navigator.clipboard.writeText(url); b.textContent = '✓ Копирано'; setTimeout(() => { b.textContent = '🔗 Линк'; }, 1600); }
  catch {
    const row = $('.navrow'); row.querySelector('input')?.remove();
    const inp = document.createElement('input'); inp.value = url; inp.readOnly = true; inp.setAttribute('aria-label', 'Линк към изгледа');
    row.insertBefore(inp, b); inp.select();
  }
});

// ---------- keyboard ----------
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,select,textarea')) return;
  if (ev.altKey && ev.key === 'ArrowLeft') { ev.preventDefault(); $('#hback').click(); return; }
  if (ev.altKey && ev.key === 'ArrowRight') { ev.preventDefault(); $('#hfwd').click(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === '+' || ev.key === '=') zoomAt(vb.x + vb.w / 2, vb.y + vb.h / 2, .8);
  else if (ev.key === '-') zoomAt(vb.x + vb.w / 2, vb.y + vb.h / 2, 1.25);
  else if (ev.key === '0') fitAll();
  else if (ev.key === 'f' || ev.key === 'F' || ev.key === 'ф' || ev.key === 'Ф') setStar(!state.star);
});

// ---------- delegated clicks ----------
document.addEventListener('click', ev => {
  const a = ev.target.closest('a.art, .article .hd b[data-art]');
  if (a) { ev.preventDefault(); openArticle(a.dataset.art, a.dataset.ref); return; }
  const w = ev.target.closest('[data-node]');
  if (w) { ev.preventDefault(); select({ kind: 'node', id: w.dataset.node }); return; }
  const gq = ev.target.closest('[data-group]');
  if (gq) { ev.preventDefault(); selectGroup(gq.dataset.group); return; }
  const ed = ev.target.closest('[data-edge]');
  if (ed) { ev.preventDefault(); select({ kind: 'edge', id: ed.dataset.edge }); return; }
  if (ev.target.closest('a.back')) { ev.preventDefault(); select(null); }
});

setTimeout(() => { $('#hint').style.opacity = 0; }, 9000);
renderFilters(); colorNodes();
if (location.hash.length > 1) applyHash(location.hash); else { renderInfo(); paint(); }
navButtons();
</script>
